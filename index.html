// ====================== SHIKAKU ======================
const SKC = ['#FF8A65', '#5EB1FF', '#3DDC84', '#FFC247', '#B794FF', '#FF6FB5', '#2EC4F1', '#A6E35B', '#F2B179', '#9EE7FF', '#E58CFF', '#FFE14D'];
function mountSK(stage, controls, P, api) {
  const { W, H } = P;
  const clueAt = new Map(P.clues);
  let rects = []; // {x,y,w,h,col}
  const hist = [];
  let colorN = 0;
  const board = $('div', 'sk-board');
  board.style.aspectRatio = `${W} / ${H}`;
  board.style.width = `min(100%, ${Math.round(440 * W / H)}px)`;
  board.style.backgroundSize = `calc(100% / ${W}) calc(100% / ${H})`;
  const layer = $('div', 'sk-layer'), labels = $('div', 'sk-layer');
  board.append(layer, labels);
  for (const [c, a] of P.clues) { const l = $('div', 'sk-num', a); l.style.left = ((c % W) + 0.5) / W * 100 + '%'; l.style.top = (Math.floor(c / W) + 0.5) / H * 100 + '%'; labels.appendChild(l); }
  const preview = $('div', 'sk-rect preview'); preview.style.display = 'none'; board.appendChild(preview);
  const place = (el, r) => { el.style.left = r.x / W * 100 + '%'; el.style.top = r.y / H * 100 + '%'; el.style.width = r.w / W * 100 + '%'; el.style.height = r.h / H * 100 + '%'; };
  const cluesIn = (r) => P.clues.filter(([c]) => { const x = c % W, y = Math.floor(c / W); return x >= r.x && x < r.x + r.w && y >= r.y && y < r.y + r.h; });
  const valid = (r) => { const cl = cluesIn(r); return cl.length === 1 && cl[0][1] === r.w * r.h; };
  const overlap = (a, b) => a.x < b.x + b.w && b.x < a.x + a.w && a.y < b.y + b.h && b.y < a.y + a.h;
  function render() {
    layer.innerHTML = '';
    for (const r of rects) { const el = $('div', 'sk-rect' + (valid(r) ? '' : ' bad')); el.style.setProperty('--rc', r.col); place(el, r); layer.appendChild(el); }
    const covered = rects.reduce((a, r) => a + r.w * r.h, 0);
    api.setExtra('Covered', `${Math.round(covered / (W * H) * 100)}<i>%</i>`);
    if (covered === W * H && rects.every(valid)) { board.classList.add('done'); api.win(); }
  }
  const cellAt = (e) => { const b = board.getBoundingClientRect(); return [Math.max(0, Math.min(W - 1, Math.floor((e.clientX - b.left) / b.width * W))), Math.max(0, Math.min(H - 1, Math.floor((e.clientY - b.top) / b.height * H)))]; };
  let down = null;
  const box = (a, b) => ({ x: Math.min(a[0], b[0]), y: Math.min(a[1], b[1]), w: Math.abs(a[0] - b[0]) + 1, h: Math.abs(a[1] - b[1]) + 1 });
  board.onpointerdown = (e) => { if (api.done) return; e.preventDefault(); api.start(); down = { a: cellAt(e), b: cellAt(e), id: e.pointerId, moved: false }; try { board.setPointerCapture(e.pointerId); } catch (_) {} };
  board.onpointermove = (e) => {
    if (!down || e.pointerId !== down.id) return;
    const b = cellAt(e); if (b[0] === down.b[0] && b[1] === down.b[1]) return;
    down.b = b; down.moved = true; preview.style.display = 'block'; place(preview, box(down.a, b));
  };
  const up = () => {
    if (!down) return; const d = down; down = null; preview.style.display = 'none';
    const r = box(d.a, d.b);
    hist.push(rects.map((x) => ({ ...x })));
    if (!d.moved) { // tap: remove the rectangle under the finger, or make a 1×1 on a "1"
      const hit = rects.findIndex((q) => overlap(q, r));
      if (hit >= 0) rects.splice(hit, 1);
      else if (clueAt.get(r.y * W + r.x) === 1) rects.push({ ...r, col: SKC[colorN++ % SKC.length] });
      else { hist.pop(); return; }
    } else {
      rects = rects.filter((q) => !overlap(q, r));
      const cl = cluesIn(r);
      rects.push({ ...r, col: SKC[(cl.length ? P.clues.indexOf(cl[0]) : colorN++) % SKC.length] });
    }
    api.move(); render();
  };
  board.onpointerup = up; board.onpointercancel = up;
  stage.appendChild(board);
  render();
  api.hint(() => {
    const idx = P.solution.findIndex(([x, y, w, h]) => !rects.some((r) => r.x === x && r.y === y && r.w === w && r.h === h)); if (idx < 0) return false;
    const [x, y, w, h] = P.solution[idx];
    hist.push(rects.map((r) => ({ ...r })));
    rects = rects.filter((r) => r.x + r.w <= x || x + w <= r.x || r.y + r.h <= y || y + h <= r.y);
    rects.push({ x, y, w, h, col: SKC[idx % SKC.length] }); render();
  });
  api.persist(() => ({ rects, hist, colorN }), (d) => { rects = d.rects; hist.splice(0, hist.length, ...d.hist); colorN = d.colorN; render(); });
  api.solution(() => { rects = P.solution.map(([x, y, w, h], i) => ({ x, y, w, h, col: SKC[i % SKC.length] })); render(); board.classList.add('done'); });
  api.btn('↶  Undo', () => { if (api.done || !hist.length) return; rects = hist.pop(); render(); });
  api.btn('Clear', () => { if (api.done) return; hist.push(rects.map((x) => ({ ...x }))); rects = []; render(); });
}

// ====================== MINESWEEPER ======================
const MSC = ['', '#5EB1FF', '#3DDC84', '#FF6B6B', '#B794FF', '#FFB020', '#2EC4F1', '#ECEEF3', '#8C93A6'];
function mountMS(stage, controls, P, api) {
  const { W, H, M } = P, N = W * H;
  const open = new Uint8Array(N), flag = new Uint8Array(N);
  let tool = 'dig', boom = -1;
  const reveal = (i) => { const st = [i]; while (st.length) { const c = st.pop(); if (open[c] || flag[c] || P.mines[c]) continue; open[c] = 1; if (!P.counts[c]) for (const nb of Core.msNeighbours(W, H, c)) if (!open[nb]) st.push(nb); } };
  reveal(P.start);
  const avail = Math.min(window.innerWidth - 32, 420), cs = Math.floor(avail / W);
  const grid = $('div', 'ms-grid');
  grid.style.gridTemplateColumns = `repeat(${W}, ${cs}px)`; grid.style.setProperty('--cs', cs + 'px');
  const els = [];
  for (let i = 0; i < N; i++) { const b = $('div', 'ms-c'); b.dataset.i = i; grid.appendChild(b); els.push(b); }
  function paint() {
    els.forEach((el, i) => {
      el.className = 'ms-c' + (open[i] ? ' o' : '') + (flag[i] && !open[i] ? ' fl' : '') + (boom >= 0 && P.mines[i] ? ' mine' : '') + (i === boom ? ' boom' : '');
      el.textContent = open[i] && P.counts[i] ? P.counts[i] : '';
      el.style.color = open[i] ? MSC[P.counts[i]] : '';
    });
    api.setExtra('Mines', `${M - flag.reduce((a, b) => a + b, 0)}<i>left</i>`);
  }
  const won = () => { for (let i = 0; i < N; i++) if (!P.mines[i] && !open[i]) return false; return true; };
  const dig = (i) => {
    if (open[i] || flag[i]) return;
    if (P.mines[i]) { boom = i; paint(); grid.classList.add('lost'); setTimeout(() => api.fail('Boom!', 'hit a mine'), 900); return; }
    reveal(i);
  };
  const act = (i, longPress) => {
    if (api.done || boom >= 0) return;
    api.start();
    if (open[i]) { // chord: open the neighbours when the flags around a number are complete
      const nb = Core.msNeighbours(W, H, i);
      if (P.counts[i] && nb.filter((c) => flag[c]).length === P.counts[i]) nb.forEach((c) => { if (boom < 0) dig(c); });
      else return;
    } else if (tool === 'flag' || longPress) flag[i] ^= 1;
    else dig(i);
    api.move(); paint();
    if (boom < 0 && won()) { grid.classList.add('done'); api.win(); }
  };
  let press = null;
  grid.addEventListener('contextmenu', (e) => e.preventDefault());
  grid.onpointerdown = (e) => {
    const t = e.target.closest('.ms-c'); if (!t) return; e.preventDefault();
    const i = +t.dataset.i;
    press = { i, fired: false, timer: setTimeout(() => { press.fired = true; act(i, true); if (navigator.vibrate) navigator.vibrate(15); }, 380) };
  };
  const up = (e) => { if (!press) return; clearTimeout(press.timer); if (!press.fired) act(press.i, false); press = null; };
  grid.onpointerup = up;
  grid.onpointercancel = () => { if (press) clearTimeout(press.timer); press = null; };
  grid.onpointerleave = () => { if (press) clearTimeout(press.timer); press = null; };
  const tools = $('div', 'qn-tools');
  const tD = $('button', 'on', '⛏ &nbsp;Dig'), tF = $('button', '', '⚑ &nbsp;Flag');
  const setTool = (t) => { tool = t; tD.classList.toggle('on', t === 'dig'); tF.classList.toggle('on', t === 'flag'); };
  tD.onclick = () => setTool('dig'); tF.onclick = () => setTool('flag');
  tools.append(tD, tF); tools.style.width = cs * W + 'px';
  stage.append(grid, tools, $('div', 'toast', 'Long-press a cell to flag it · tap a finished number to clear around it'));
  api.hint(() => {
    if (boom >= 0) return false;

// ====================== HANGMAN ======================
const KB = { en: ['qwertyuiop', 'asdfghjkl', 'zxcvbnm'], ru: ['йцукенгшщзх', 'фывапролджэ', 'ячсмитьбюъ'], hy: ['աբգդեզէըթժ', 'իլխծկհձղճմ', 'յնշոչպջռսվ', 'տրցւփքօֆ'] };
// any other alphabet: the word's own letters plus look-alike decoys from the same Unicode block
function kbFor(word) {
  const own = [...new Set(word)], cps = own.map((ch) => ch.codePointAt(0)), pool = [];
  for (let c = Math.min(...cps) - 8; c <= Math.max(...cps) + 8; c++) { const ch = String.fromCodePoint(c); if (/\p{Ll}|\p{Lo}/u.test(ch) && ch.toLowerCase() === ch && !own.includes(ch)) pool.push(ch); }
  const R = Core.rng(Core.hashStr(word)), extra = [];

  const all = [...own, ...extra].sort((a, b) => a.localeCompare(b)), rows = [];
  for (let i = 0; i < all.length; i += 10) rows.push(all.slice(i, i + 10).join(''));
  return rows;
}
function mountHM(stage, controls, P, api) {
  const word = P.word, lang = P.lang, MAX = 6, inWord = new Set([...word]);
  const tried = new Set();
  let misses = 0, over = false;
  api.setCap(MAX);
  const cat = $('div', 'hm-cat', `${esc(P.cat)} · ${[...word].length} letters`);
  const fig = $('div', 'hm-fig');
  const wordEl = $('div', 'hm-word');
  const kb = $('div', 'hm-kb');
  const keys = new Map();
  for (const row of KB[lang] || kbFor(word)) { const r = $('div', 'hm-row'); for (const ch of [...row]) { const k = $('button', 'hm-key', ch); k.onclick = () => guess(ch); keys.set(ch, k); r.appendChild(k); } kb.appendChild(r); }
  const parts = [
    '<circle cx="132" cy="58" r="15"/>', '<path d="M132 73V121"/>', '<path d="M132 86L112 106"/>', '<path d="M132 86L152 106"/>', '<path d="M132 121L116 150"/>', '<path d="M132 121L148 150"/>'];
  function paint(reveal) {
    fig.innerHTML = `<svg viewBox="0 0 200 170"><g class="gal"><path d="M24 162H112M50 162V12H132V28"/></g><g class="man">${parts.slice(0, misses).join('')}</g>${misses >= MAX ? '<g class="eyes"><path d="M125 53l5 5M130 53l-5 5M134 53l5 5M139 53l-5 5"/></g>' : ''}</svg>`;
    wordEl.innerHTML = [...word].map((ch) => { const show = tried.has(ch) || reveal; return `<span class="${show ? 'on' : ''} ${reveal && !tried.has(ch) ? 'missed' : ''}">${show ? ch : ''}</span>`; }).join('');
    wordEl.style.setProperty('--n', [...word].length);
    keys.forEach((k, ch) => { k.className = 'hm-key' + (tried.has(ch) ? (inWord.has(ch) ? ' hit' : ' miss') : ''); k.disabled = tried.has(ch) || over; });
    api.setExtra && null;
  }

    paint();
    if ([...inWord].every((c) => tried.has(c))) { over = true; wordEl.classList.add('won'); api.win({ m: misses }); }
    else if (misses >= MAX) { over = true; paint(true); fig.classList.add('lost'); setTimeout(() => api.fail('Hanged', 'was hanged'), 1100); }
  }
  window.onkeydown = (e) => {
    if (e.target && e.target.closest && e.target.closest('input, textarea')) return; // typing a word — never ours
    if (over || api.done || !kb.isConnected) return;                                    // game finished or left
    const ch = e.key.toLowerCase().replace('ё', 'е'); if (keys.has(ch)) { e.preventDefault(); guess(ch); }
  };
  if (KB[lang] == null) kb.classList.add('kb-wide');
  stage.append(cat, fig, wordEl, kb);
  paint();
  api.solution(() => { over = true; paint(true); });
  api.hint(() => { if (over) return false; const left = [...inWord].filter((c) => !tried.has(c)); if (left.length < 2 || misses >= MAX - 1) return false; misses++; api.move(); guess(left[Math.floor(Math.random() * left.length)]); }, 'Hint · costs a miss');

}

// ====================== WORD SEARCH ======================
function mountWS(stage, controls, P, api) {
  const n = P.n, found = new Map(); // word -> colour index
  const board = $('div', 'ws-board');
  board.style.setProperty('--n', n);
  const NS = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(NS, 'svg'); svg.setAttribute('viewBox', `0 0 ${n} ${n}`); svg.setAttribute('class', 'ws-svg');
  const letters = $('div', 'ws-letters');
  letters.innerHTML = P.grid.map((ch) => `<span>${ch.toUpperCase()}</span>`).join('');
  board.append(svg, letters);
  const list = $('div', 'ws-list');
  const cxy = (i) => [(i % n) + 0.5, Math.floor(i / n) + 0.5];
  let drag = null;
  const cap = (a, b, col, cls = '') => { const [x1, y1] = cxy(a), [x2, y2] = cxy(b); return `<line class="${cls}" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${col}" stroke-width="0.78" stroke-linecap="round"/>`; };
  function render() {
    let h = '';
    let k = 0;
    for (const w of P.words) { if (found.has(w.w)) h += cap(w.cells[0], w.cells[w.cells.length - 1], SKC[found.get(w.w) % SKC.length], 'f'); k++; }
    if (drag && drag.b != null) h += cap(drag.a, drag.b, 'rgba(255,255,255,.28)', 'p');
    svg.innerHTML = h;
    list.innerHTML = P.words.map((w) => `<span class="${found.has(w.w) ? 'done' : ''}" ${found.has(w.w) ? `style="--fc:${SKC[found.get(w.w) % SKC.length]}"` : ''}>${w.w}</span>`).join('');
    api.setExtra('Found', `${found.size}<i>/ ${P.words.length}</i>`);
  }
  const cellAt = (e) => { const r = board.getBoundingClientRect(); const x = Math.floor((e.clientX - r.left) / r.width * n), y = Math.floor((e.clientY - r.top) / r.height * n); return x < 0 || y < 0 || x >= n || y >= n ? null : y * n + x; };
  const line = (a, b) => { // cells from a to b if they lie on a straight or diagonal line
    const ax = a % n, ay = Math.floor(a / n), bx = b % n, by = Math.floor(b / n), dx = Math.sign(bx - ax), dy = Math.sign(by - ay);
    if (!(ax === bx || ay === by || Math.abs(bx - ax) === Math.abs(by - ay))) return null;
    const len = Math.max(Math.abs(bx - ax), Math.abs(by - ay)) + 1, out = [];
    for (let k = 0; k < len; k++) out.push((ay + dy * k) * n + ax + dx * k);
    return out;
  };
  board.onpointerdown = (e) => { if (api.done) return; e.preventDefault(); const c = cellAt(e); if (c == null) return; api.start(); drag = { a: c, b: c, id: e.pointerId }; try { board.setPointerCapture(e.pointerId); } catch (_) {} render(); };
  board.onpointermove = (e) => { if (!drag || e.pointerId !== drag.id) return; const c = cellAt(e); if (c == null || c === drag.b) return; if (line(drag.a, c)) { drag.b = c; render(); } };
  const up = () => {
    if (!drag) return; const cells = line(drag.a, drag.b); drag = null;
    if (cells && cells.length > 1) {
      const str = cells.map((c) => P.grid[c]).join(''), rev = [...str].reverse().join('');
      const hit = P.words.find((w) => !found.has(w.w) && (w.w === str || w.w === rev));
      if (hit) { hit.cells = cells; found.set(hit.w, found.size); }
      api.move();
    }
    render();
    if (found.size === P.words.length) { board.classList.add('done'); api.win(); }
  };
  board.onpointerup = up; board.onpointercancel = up;
  stage.append($('div', 'hm-cat', `Theme: ${esc(P.cat)}`), board, list);
  render();
  api.hint(() => { const w = P.words.find((x) => !found.has(x.w)); if (!w) return false; found.set(w.w, found.size); render(); if (found.size === P.words.length) { board.classList.add('done'); api.win(); } });
  api.persist(() => ({ found: [...found] }), (d) => { found.clear(); d.found.forEach(([w, c]) => found.set(w, c)); render(); });
  api.solution(() => { P.words.forEach((w) => { if (!found.has(w.w)) found.set(w.w, found.size); }); render(); board.classList.add('done'); });

const TREE_SVG = '<svg viewBox="0 0 40 40"><path d="M20 4 31 19h-5l7 9H7l7-9H9Z" fill="#3DDC84"/><rect x="18" y="28" width="4" height="7" rx="1" fill="#A0724A"/></svg>';

    for (let c = 0; c < n; c++) { let k = 0; for (let r = 0; r < n; r++) if (st[r * n + c] === 2) k++; colEls[c].className = 'tn-cnt' + (k === P.cols[c] ? ' ok' : k > P.cols[c] ? ' over' : ''); if (k !== P.cols[c]) ok = false; }

      }
      if (!api.done) api.win({ m: st.score, s: stars, title: ['', 'Level complete', 'Great job!', 'Perfect!'][stars] });
      return;
    }
    if (s === 'lose') { paintMoves(); showBanner('Out of moves'); await blWait(1200); hideBanner(); if (!api.done) api.fail('Out of moves', 'out of moves', st.score); return; }
    busy = false; armHint();
  }
  const onResize = () => { if (!wrap.isConnected) { window.removeEventListener('resize', onResize); return; } if (!busy) layout(); };
  window.addEventListener('resize', onResize);
  layout(); armHint();
  api.persist(() => ({ st }), (d) => {
    Object.assign(st, d.st); layout(); paintMoves();
    st.goals.forEach((g, j) => { disp[j] = g.left; setGoal(j); });
    shownScore = st.score; scoreEl.querySelector('b').textContent = st.score.toLocaleString('en-US');
    if (M3.status(st) !== 'play') { busy = true; setTimeout(after, 300); }
  });
  window.__bl = { st, swap: doSwap, tap: doTap, busy: () => busy }; // test hook
}

// ====================== YACHT (Yatzy · Maxi Yatzy) ======================
const YC_UP = [['1', 'Ones'], ['2', 'Twos'], ['3', 'Threes'], ['4', 'Fours'], ['5', 'Fives'], ['6', 'Sixes']].map(([k, n]) => [k, n, '', (c) => c[+k] * +k]);
const YC_F = [6, 5, 4, 3, 2, 1];
const ycKind = (n) => (c) => { for (const f of YC_F) if (c[f] >= n) return f * n; return 0; };
const ycPairs = (m) => (c) => { const p = YC_F.filter((f) => c[f] >= 2); return p.length >= m ? p.slice(0, m).reduce((a, f) => a + 2 * f, 0) : 0; };
const ycRun = (a, b, pts) => (c) => { for (let f = a; f <= b; f++) if (!c[f]) return 0; return pts; };
// any `len` consecutive numbers (e.g. small = 1-2-3-4, 2-3-4-5 or 3-4-5-6)
const ycStr = (len, pts) => (c) => { for (let a = 1; a + len - 1 <= 6; a++) { let ok = true; for (let f = a; f < a + len; f++) if (!c[f]) ok = false; if (ok) return pts; } return 0; };
const ycCombo = (x, y) => (c) => { let best = 0; for (const a of YC_F) if (c[a] >= x) for (const b of YC_F) if (b !== a && c[b] >= y) best = Math.max(best, a * x + b * y); return best; };
const ycSum = (c, s) => s, ycAlike = (n, pts) => (c) => (Math.max(...c) === n ? pts : 0);
const YC_RULES = {
  yatzy: { n: 5, target: 63, bonus: 50, yk: 'y', cats: [...YC_UP,
    ['3k', 'Three of a kind', 'sum of the three', ycKind(3)], ['4k', 'Four of a kind', 'sum of the four', ycKind(4)],
    ['ss', 'Small straight', '4 in a row · 15', ycStr(4, 15)], ['ls', 'Large straight', '5 in a row · 30', ycStr(5, 30)],
    ['fh', 'Full house', '3 + 2 · sum', ycCombo(3, 2)], ['ch', 'Chance', 'sum of dice', ycSum], ['y', 'Yatzy', 'five alike · 50', ycAlike(5, 50)]] },
  maxi: { n: 6, target: 84, bonus: 100, yk: 'my', cats: [...YC_UP,
    ['p3', 'Three pairs', 'sum of the pairs', ycPairs(3)],
    ['3k', 'Three of a kind', 'sum of the three', ycKind(3)], ['4k', 'Four of a kind', 'sum of the four', ycKind(4)], ['5k', 'Five of a kind', 'sum of the five', ycKind(5)],
    ['ss', 'Small straight', '4 in a row · 15', ycStr(4, 15)], ['ls', 'Large straight', '5 in a row · 30', ycStr(5, 30)], ['fs', 'Full straight', '1–6 · 60', ycRun(1, 6, 60)],
    ['fh', 'Full house', '3 + 2 · sum', ycCombo(3, 2)], ['cs', 'Castle', '3 + 3 · sum', ycCombo(3, 3)], ['tw', 'Tower', '4 + 2 · sum', ycCombo(4, 2)],
    ['ch', 'Chance', 'sum of dice', ycSum], ['my', 'Maxi Yatzy', 'six alike · 100', ycAlike(6, 100)]] },
};
function ycScore(R, k, d) { const c = [0, 0, 0, 0, 0, 0, 0]; d.forEach((v) => c[v]++); return R.cats.find((r) => r[0] === k)[3](c, d.reduce((a, b) => a + b, 0)); }
const PIPS = { 1: [[50, 50]], 2: [[28, 28], [72, 72]], 3: [[26, 26], [50, 50], [74, 74]], 4: [[28, 28], [72, 28], [28, 72], [72, 72]], 5: [[27, 27], [73, 27], [50, 50], [27, 73], [73, 73]], 6: [[28, 25], [72, 25], [28, 50], [72, 50], [28, 75], [72, 75]] };
const ycFace = (v) => (v ? `<svg viewBox="0 0 100 100">${PIPS[v].map(([x, y]) => `<circle cx="${x}" cy="${y}" r="10"/>`).join('')}</svg>` : '');
const ycAnim = (el, cls, delay = 0) => { el.style.animationDelay = delay + 'ms'; el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); el.addEventListener('animationend', () => el.classList.remove(cls), { once: true }); };
function mountYC(stage, controls, P, api, ctx) {
  const R = YC_RULES[P.rules] || YC_RULES.yatzy, N = R.cats.length, ND = R.n;
  const duo = ctx.duo, players = duo ? [0, 1] : [0];
  const rng = players.map((q) => Core.rng(Core.hashStr(P.seed + (duo && duo.mode === 'diff' ? '-p' + q : ''))));
  const cards = players.map(() => ({})), shown = players.map(() => 0);
  let turn = duo ? duo.first : 0, view = turn, dice = Array(ND).fill(0), held = dice.map(() => false), rolls = 0, busy = false, turnsDone = 0;
  const TOTAL = N * players.length;
  const turnNote = () => `${Math.min(N, Math.floor(turnsDone / 2) + 1)} of ${N}`;
  const upper = (q) => YC_UP.reduce((a, [k]) => a + (cards[q][k] || 0), 0);
  const total = (q) => Object.values(cards[q]).reduce((a, b) => a + b, 0) + (upper(q) >= R.target ? R.bonus : 0);
  const diceEl = $('div', 'yc-dice');
  const dEls = dice.map((_, i) => {
    const b = $('button', 'yc-die blank', '<div class="yc-box"><div class="yc-face"></div></div>');
    b.setAttribute('aria-label', `Die ${i + 1}`);
    b.onclick = () => { if (!rolls || busy || api.done) return; held[i] = !held[i]; b.classList.toggle('held', held[i]); };
    diceEl.appendChild(b); return b;
  });
  // dice are drawn at an exact pixel size, so they are always square
  const size = () => { const w = diceEl.clientWidth || 340, gap = ND === 6 ? 8 : 10; diceEl.style.setProperty('--d', Math.floor(Math.min(ND === 6 ? 54 : 60, (w - gap * (ND - 1)) / ND)) + 'px'); };
  const ro = new ResizeObserver(() => { if (!diceEl.isConnected) { ro.disconnect(); return; } size(); });
  ro.observe(diceEl);
  const rollBtn = $('button', 'yc-roll');
  rollBtn.onclick = roll;
  const sheet = $('div', 'yc-sheet');
  const toastEl = $('div', 'yc-toast');
  stage.append(diceEl, rollBtn, sheet, toastEl);
  const setFace = (i, v) => { dEls[i].firstChild.firstChild.innerHTML = ycFace(v); };
  const toast = (t) => { toastEl.textContent = t; toastEl.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => toastEl.classList.remove('on'), 1100); };
  function roll() {
    if (busy || api.done || rolls >= 3) return;
    api.start();
    busy = true; rolls++; view = turn;
    const res = dice.map((v, i) => (held[i] && v ? v : 1 + Math.floor(rng[turn]() * 6)));
    paintCard(); paintBtn();
    let last = 0;
    dice.forEach((v, i) => {
      if (held[i] && v) return;
      const el = dEls[i], delay = i * 50; last = delay;
      el.classList.remove('blank');
      ycAnim(el.firstChild, 'yc-shake', delay); // one shake, then it settles — no second wobble
      [0, 80, 170, 260].forEach((t) => setTimeout(() => setFace(i, 1 + Math.floor(Math.random() * 6)), delay + t));
      setTimeout(() => setFace(i, res[i]), delay + 340);
    });
    setTimeout(() => {
      dice = res; busy = false;
      if (!sheet.isConnected) return;
      paintCard(); paintBtn();
      if (res.every((v) => v === res[0])) toast(R.cats.find((r) => r[0] === R.yk)[1] + '!');
    }, last + 440);
  }
  function choose(k) {
    if (!rolls || busy || api.done || view !== turn || cards[turn][k] != null) return;
    const q = turn, before = total(q), bonusBefore = upper(q) >= R.target;
    const v = ycScore(R, k, dice);
    cards[q][k] = v; turnsDone++; rolls = 0; held = held.map(() => false);
    api.move();
    paintCard(k); paintBtn();
    if (v) fly(sheet.querySelector(`[data-k="${k}"] .yc-v`), sheet.querySelector(`[data-tot="${q}"]`), '+' + v);
    countTo(q, before, total(q));
    if (!bonusBefore && upper(q) >= R.target) setTimeout(() => toast('Bonus +' + R.bonus), 450);
    busy = true;
    dEls.forEach((el) => { el.classList.remove('held'); el.classList.add('fade'); });
    setTimeout(() => {
      if (!sheet.isConnected) return;
      dEls.forEach((el, i) => { el.classList.remove('fade'); el.classList.add('blank'); setFace(i, 0); });
      dice = dice.map(() => 0); busy = false;
      if (turnsDone >= TOTAL) { paintBtn(); finish(); return; }
      if (duo) { turn = 1 - turn; view = turn; api.setTurn(turn, turnNote()); paintCard(); }
      paintBtn();
    }, duo ? 850 : 400);
  }
  function fly(from, to, text) {
    if (!from || !to) return;
    const a = from.getBoundingClientRect(), b = to.getBoundingClientRect();
    const el = $('div', 'yc-fly', text);
    el.style.left = a.left + a.width / 2 - 14 + 'px'; el.style.top = a.top + 2 + 'px';
    document.body.appendChild(el);
    const dx = b.left + b.width / 2 - a.left - a.width / 2, dy = b.top - a.top;
    el.animate([{ transform: 'translate(0,0) scale(1.2)', opacity: 1 }, { transform: 'translate(0,-14px) scale(1.3)', opacity: 1, offset: 0.25 }, { transform: `translate(${dx}px,${dy}px) scale(.8)`, opacity: 0.3 }], { duration: 700, easing: 'cubic-bezier(.5,0,.3,1)' }).onfinish = () => el.remove();
  }
  function countTo(q, a, b) {
    if (a === b) { shown[q] = b; return; }
    const t0 = performance.now() + 350;
    const step = (t) => {
      const p = Math.max(0, Math.min(1, (t - t0) / 450));
      shown[q] = a + (b - a) * (1 - (1 - p) ** 3);
      const el = sheet.querySelector(`[data-tot="${q}"]`); if (el) el.textContent = Math.round(shown[q]);
      if (p < 1 && sheet.isConnected) requestAnimationFrame(step); else shown[q] = b;
    };
    requestAnimationFrame(step);
    setTimeout(() => { const el = sheet.querySelector(`[data-tot="${q}"]`); if (el) ycAnim(el, 'up'); }, 350);
  }
  function finish() {
    sheet.classList.add('done');
    if (duo) api.endTogether([total(0), total(1)]);
    else api.win({ m: total(0), title: 'Game over' });
  }
  api.concedeTogether = () => api.endTogether([total(0), total(1)], turn);
  function paintBtn() {
    rollBtn.textContent = rolls === 0 ? 'Roll the dice' : rolls < 3 ? `Roll again · ${3 - rolls} left` : 'Pick a box to score';
    rollBtn.disabled = rolls >= 3 || busy || api.done;
    rollBtn.classList.toggle('idle', rolls >= 3);
  }
  function paintCard(just) {
    const q = view, mine = q === turn, live = mine && rolls > 0 && !busy;
    let pot = null, best = 0;
    if (live) { pot = {}; R.cats.forEach(([k]) => { if (cards[q][k] == null) { pot[k] = ycScore(R, k, dice); best = Math.max(best, pot[k]); } }); }
    const up = upper(q), ok = up >= R.target;
    const tile = ([k, name, hint], idx) => {
      const v = cards[q][k];
      let cls = '', txt = '';
      if (v != null) { cls = 'set' + (v ? '' : ' z'); txt = v; }
      else if (pot) { cls = 'pot' + (pot[k] ? '' : ' z') + (pot[k] && pot[k] === best ? ' best' : ''); txt = pot[k]; }
      return `<button class="yc-t ${cls}" data-k="${k}"><span class="nm"><span>${idx < 6 ? ycFace(+k) : ''}${name}</span>${hint ? `<i>${hint}</i>` : ''}</span><b class="yc-v">${txt}</b></button>`;
    };
    let h = '';
    if (duo) {
      h += `<div class="yc-who">${players.map((p) => `<button class="yc-pl${p === view ? ' on' : ''}" data-p="${p}" style="--pc:${PC[p]}"><span>${nm(p)}</span><b data-tot="${p}">${Math.round(shown[p])}</b></button>`).join('')}</div>`;
    }
    h += `<div class="yc-tiles">${R.cats.slice(0, 6).map(tile).join('')}<div class="yc-bonus"><span>Bonus · ${R.target}+ in the top half → +${R.bonus}</span><b class="${ok ? 'ok' : ''}">${ok ? '+' + R.bonus : up + ' / ' + R.target}</b></div>${R.cats.slice(6).map((r, i) => tile(r, i + 6)).join('')}</div>`;
    if (!duo) h += `<div class="yc-tot"><span>Total</span><b data-tot="0">${Math.round(shown[0])}</b></div>`;
    sheet.innerHTML = h;
    if (just) sheet.querySelector(`[data-k="${just}"]`).classList.add('just');
    if (duo) api.turnNote(turnNote()); else api.setExtra('Turn', `${Math.min(N, turnsDone + 1)}<i>/ ${N}</i>`);
  }
  sheet.onclick = (e) => {
    const pb = e.target.closest('.yc-pl');
    if (pb) { if (busy) return; view = +pb.dataset.p; paintCard(); return; }
    const t = e.target.closest('.yc-t');
    if (t) choose(t.dataset.k);
  };
  api.persist(() => ({ cards, turn, turnsDone, dice, held, rolls }), (d) => {
    cards.forEach((c, q) => { for (const k in c) delete c[k]; Object.assign(c, d.cards[q]); shown[q] = total(q); });
    turn = d.turn; view = turn; turnsDone = d.turnsDone; dice = d.dice; held = d.held; rolls = d.rolls;
    dEls.forEach((el, i) => { el.classList.toggle('blank', !dice[i]); el.classList.toggle('held', !!held[i]); setFace(i, dice[i]); });
    if (duo) api.setTurn(turn, turnNote());
    paintCard(); paintBtn();
  });
  paintCard(); paintBtn(); size();
}

// ====================== 2048 ======================
const G2C = { 2: ['#2A2F3D', '#ECEEF3'], 4: ['#363C4E', '#ECEEF3'], 8: ['#F2B179', '#2A1606'], 16: ['#FF8A3D', '#2A1300'], 32: ['#FF5A5F', '#2B0507'], 64: ['#E8364A', '#FFF'],
  128: ['#FFE14D', '#2B2300'], 256: ['#F5C518', '#2B2000'], 512: ['#3DDC84', '#03261A'], 1024: ['#2EC4F1', '#032330'], 2048: ['#A770FF', '#FFF'] };
function mountG2(stage, controls, P, api) {
  let R, tiles, nid, score, over, reached;
  const els = new Map();
  const board = $('div', 'g2-board');
  const POS = (k) => (3 + k * 24.25) + '%';
  for (let r = 0; r < 4; r++) for (let c = 0; c < 4; c++) { const b = $('div', 'g2-bg'); b.style.left = POS(c); b.style.top = POS(r); board.appendChild(b); }
  const alive = () => tiles.filter((t) => !t.dead);
  function spawn() {
    const empty = [];
    for (let r = 0; r < 4; r++) for (let c = 0; c < 4; c++) if (!alive().some((t) => t.r === r && t.c === c)) empty.push([r, c]);
    if (!empty.length) return;
    const [r, c] = empty[Math.floor(R() * empty.length)];
    tiles.push({ id: nid++, v: R() < 0.9 ? 2 : 4, r, c, isNew: true });
  }
  function render() {
    for (const t of tiles) {
      let el = els.get(t.id);
      if (!el) { el = $('div', 'g2-t num'); els.set(t.id, el); board.appendChild(el); }
      el.style.left = POS(t.c); el.style.top = POS(t.r);
      const col = G2C[t.v] || ['#FF6FB5', '#FFF'];
      el.style.background = col[0]; el.style.color = col[1];
      el.textContent = t.v;
      const d = String(t.v).length;
      el.className = 'g2-t num' + (d >= 3 ? ' d' + Math.min(d, 5) : '') + (t.isNew ? ' new' : '') + (t.merged ? ' merged' : '') + (t.dead ? ' dead' : '');
    }
    const dead = tiles.filter((t) => t.dead);
    if (dead.length) setTimeout(() => dead.forEach((t) => { const el = els.get(t.id); if (el) el.remove(); els.delete(t.id); }), 110);
    tiles = alive();
    api.setExtra('Score', score.toLocaleString('en-US'));
  }
  function canMove() {
    const g = Array.from({ length: 4 }, () => new Array(4).fill(0));
    alive().forEach((t) => (g[t.r][t.c] = t.v));
    for (let r = 0; r < 4; r++) for (let c = 0; c < 4; c++) {
      if (!g[r][c]) return true;
      if (c < 3 && g[r][c] === g[r][c + 1]) return true;
      if (r < 3 && g[r][c] === g[r + 1][c]) return true;
    }
    return false;
  }
  function move(dir) { // 0 up 1 right 2 down 3 left
    if (over || api.done) return;
    const [dr, dc] = [[-1, 0], [0, 1], [1, 0], [0, -1]][dir];
    tiles.forEach((t) => { t.isNew = false; t.merged = false; });
    const grid = Array.from({ length: 4 }, () => new Array(4).fill(null));
    tiles.forEach((t) => (grid[t.r][t.c] = t));
    const rs = [0, 1, 2, 3], cs = [0, 1, 2, 3];
    if (dr === 1) rs.reverse(); if (dc === 1) cs.reverse();
    const mergedIds = new Set();
    let moved = false;
    for (const r of rs) for (const c of cs) {
      const t = grid[r][c]; if (!t) continue;
      let nr = r, nc = c, merged = false;
      while (true) {
        const r2 = nr + dr, c2 = nc + dc;
        if (r2 < 0 || r2 > 3 || c2 < 0 || c2 > 3) break;
        const o = grid[r2][c2];
        if (!o) { nr = r2; nc = c2; continue; }
        if (o.v === t.v && !mergedIds.has(o.id)) {
          grid[r][c] = null; t.r = r2; t.c = c2; t.dead = true;
          o.v *= 2; o.merged = true; mergedIds.add(o.id); score += o.v; merged = true; moved = true;
          if (o.v === 2048 && !reached) reached = true;
        }
        break;
      }
      if (!merged && (nr !== r || nc !== c)) { grid[r][c] = null; grid[nr][nc] = t; t.r = nr; t.c = nc; moved = true; }
    }
    if (!moved) return;
    api.move(); spawn(); render();
    if (!canMove()) { over = true; setTimeout(() => api.win({ m: score, title: reached ? 'You made 2048!' : 'Game over' }), 550); }
  }
  function reset() {
    R = Core.rng(Core.hashStr(P.seed));
    els.forEach((el) => el.remove()); els.clear();
    tiles = []; nid = 0; score = 0; over = false; reached = false;
    spawn(); spawn(); render();
  }
  let sw = null;
  board.addEventListener('pointerdown', (e) => { e.preventDefault(); sw = { x: e.clientX, y: e.clientY, id: e.pointerId }; try { board.setPointerCapture(e.pointerId); } catch (_) {} });
  const end = (e) => {
    if (!sw || e.pointerId !== sw.id) return;
    const dx = e.clientX - sw.x, dy = e.clientY - sw.y; sw = null;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 22) return;
    move(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 1 : 3) : (dy > 0 ? 2 : 0));
  };
  board.addEventListener('pointerup', end); board.addEventListener('pointercancel', () => (sw = null));
  window.onkeydown = (e) => { if (e.target && e.target.closest && e.target.closest('input, textarea')) return; if (!board.isConnected) return; const k = { ArrowUp: 0, ArrowRight: 1, ArrowDown: 2, ArrowLeft: 3 }[e.key]; if (k != null) { e.preventDefault(); move(k); } };
  stage.appendChild(board);
  reset();
  api.persist(() => ({ tiles: alive().map(({ id, v, r, c }) => ({ id, v, r, c })), nid, score, reached }), (d) => { R = Core.rng(Core.hashStr(P.seed + '-r' + d.nid)); els.forEach((el) => el.remove()); els.clear(); tiles = d.tiles; nid = d.nid; score = d.score; reached = d.reached; over = false; render(); });
  api.btn('↺  Restart', () => { if (api.done) return; reset(); api.resetMoves(); });
  api.btn('End game', () => { if (api.done) return; over = true; api.win({ m: score, title: 'Game over' }); });
}

renderHome();
// ---- offline + self-updating ----
// The installed app can sit in the background for days running old code. Every time it comes back
// to the screen it asks for a new version; once one is installed it reloads itself if you're on the
// arcade or a game's menu, or offers a one-tap update if you're mid-puzzle.
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost') && !/claude/.test(location.hostname)) {
  let reg = null, hadController = !!navigator.serviceWorker.controller, reloading = false;
  const check = () => { if (reg && navigator.onLine !== false) reg.update().catch(() => {}); };
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').then((r) => { reg = r; check(); }).catch(() => {}));
  document.addEventListener('visibilitychange', () => { if (!document.hidden) check(); });
  window.addEventListener('online', check);
  setInterval(check, 10 * 60 * 1000);
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (!hadController) { hadController = true; return; } // first install, nothing old to replace
    if (reloading) return;
    const busy = !!document.querySelector('.stage') && !document.querySelector('.solbar') && !document.querySelector('.veil');
    if (!busy) { reloading = true; location.reload(); return; }
    if (document.querySelector('.upd')) return;
    const u = $('button', 'upd', '↻ New version ready — tap to update');
    u.onclick = () => { reloading = true; location.reload(); };
    document.body.appendChild(u);
  });
}
