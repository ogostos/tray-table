<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0B0D12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tray Table">
<meta name="mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Tray Table — puzzle arcade</title>
<style>
:root{
  --bg:#0B0D12;--s1:#12151D;--s2:#191D28;--s3:#222735;--line:#262B39;--tx:#ECEEF3;--mute:#8C93A6;--dim:#596075;
  --lo:#FFC247;--ub:#FF6B5E;--qn:#B794FF;--t24:#3BE3C3;--kk:#A6E35B;--lk:#FF6FB5;--pp:#4CA8FF;--pr:#FF9F43;--fl:#3DDC84;--g2:#F2B179;--yc:#FF6B5E;--bl:#7BD35A;--hm:#FF8FA3;--ws:#5EB1FF;--tn:#3DDC84;--zp:#7C8CFF;--hb:#C7A27A;--sk:#FF8A65;--ng:#F5E663;--ms:#9AA5B8;--ol:#9EE7FF;--tg:#FFB86B;--hu:#E58CFF;--acc:#FFC247;
  --font:ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--font)}
body{min-height:100dvh;user-select:none;-webkit-user-select:none;touch-action:manipulation;overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
#app{max-width:480px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 18px)}

/* ---------- HOME ---------- */
.brand{display:flex;align-items:center;gap:12px;margin:4px 2px 18px}
.logo{width:42px;height:42px;border-radius:13px;background:linear-gradient(145deg,#FFC247,#FF6B5E);display:grid;place-items:center;
  color:#14110a;font-size:22px;font-weight:800;box-shadow:0 6px 24px -8px #FF8A4C}
.t1{font-size:22px;font-weight:800;letter-spacing:-.02em}
.t2{font-size:12.5px;color:var(--mute);margin-top:1px}
.duel{background:var(--s1);border:1px solid var(--line);border-radius:20px;padding:12px;margin-bottom:4px}
.duel-row{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.pill{height:52px;border-radius:15px;background:var(--s2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;gap:8px;
  font-weight:700;font-size:15px;min-width:0;padding:0 10px;transition:.18s}
.pill .dot{width:9px;height:9px;border-radius:50%;background:var(--dim);flex:none}
.pill span.nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill.on{background:#FFF;color:#0B0D12;border-color:#FFF}
.pill.on .dot{background:#22C55E}
.pill input{width:100%;background:transparent;border:0;outline:0;text-align:center;font-weight:700;color:#0B0D12}
.score{font-size:26px;font-weight:800;letter-spacing:-.02em;padding:0 6px;text-align:center}
.score small{display:block;font-size:10px;letter-spacing:.12em;color:var(--mute);font-weight:700;text-transform:uppercase;margin-top:2px}
.duel-hint{font-size:11.5px;color:var(--dim);text-align:center;margin-top:9px}
.cards{display:flex;flex-direction:column;gap:10px}
.card{display:grid;grid-template-columns:64px 1fr auto 30px;align-items:center;gap:14px;text-align:left;background:var(--s1);border:1px solid var(--line);
  border-radius:20px;padding:12px 14px 12px 12px;position:relative;overflow:hidden;transition:transform .12s}
.card:active{transform:scale(.985)}
.card::before{content:"";position:absolute;inset:0 auto 0 0;width:3px;background:var(--c)}
.ico{width:64px;height:64px;border-radius:16px;background:var(--s2);display:grid;place-items:center;overflow:hidden}
.ico svg{width:46px;height:46px}
.cname{font-size:17px;font-weight:800;letter-spacing:-.01em}
.cdesc{font-size:12.5px;color:var(--mute);margin-top:3px;line-height:1.35}
.cmeta{text-align:right}
.fav{width:30px;height:44px;display:grid;place-items:center;font-size:21px;color:#4A5165;margin-right:-6px;line-height:1}
.fav.on{color:#FFC247;text-shadow:0 0 12px rgba(255,194,71,.5)}
.fav-sec{color:#FFC247}
.cmeta b{display:block;font-size:15px;color:var(--c)}
.cmeta span{font-size:11px;color:var(--dim)}
.foot{margin-top:auto;padding-top:20px;text-align:center;font-size:11px;color:var(--dim);letter-spacing:.04em}

/* ---------- GAME SHELL ---------- */
.gbar{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;margin-bottom:10px}
.ibtn{width:44px;height:44px;border-radius:14px;background:var(--s1);border:1px solid var(--line);display:grid;place-items:center;font-size:20px;font-weight:700}
.gtitle{text-align:center;font-weight:800;font-size:18px;justify-self:center;padding:2px 10px;border-radius:12px}
.gtitle:active{background:var(--s1)}
.gtitle small{display:block;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--acc);font-weight:800;margin-top:1px}
.pnav{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:12px}
.pnav button{width:36px;height:32px;border-radius:10px;background:var(--s1);border:1px solid var(--line);font-weight:800;color:var(--mute)}
.pnav .pn{font-size:14px;color:var(--mute);min-width:104px;text-align:center}
.pnav .pn b{color:var(--tx);font-size:16px}
.pnav .tick{color:var(--acc)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.stat{background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:8px 10px}
.stat label{display:block;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);font-weight:800}
.stat b{font-size:19px;font-weight:800}
.stat b i{font-style:normal;font-size:12px;color:var(--mute);font-weight:700;margin-left:3px}
.stat .who{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.rival{font-size:12px;color:var(--mute);text-align:center;min-height:18px;margin-bottom:6px}
.rival b{color:var(--tx)}
.stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;min-height:300px}
.controls{display:flex;gap:8px;justify-content:center;margin-top:14px;flex-wrap:wrap}
.cbtn{height:44px;padding:0 18px;border-radius:14px;background:var(--s1);border:1px solid var(--line);font-weight:700;font-size:14px;color:var(--mute)}
.cbtn:active{background:var(--s2)}
.shake{animation:shake .35s}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}

/* ---------- LIGHTS OUT ---------- */
.lo-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;width:min(100%,380px);padding:14px;background:var(--s1);border-radius:24px;border:1px solid var(--line)}
.lo-cell{aspect-ratio:1;border-radius:14px;background:#1B1F2A;border:1px solid #252A37;transition:background .18s,box-shadow .18s,transform .1s}
.lo-cell.on{background:radial-gradient(circle at 40% 35%,#FFE39A,#FFC247 55%,#E59A12);border-color:#FFD36E;box-shadow:0 0 18px -2px rgba(255,194,71,.65),inset 0 -3px 0 rgba(0,0,0,.15)}
.lo-cell:active{transform:scale(.92)}
.lo-cell.hit{animation:pop .22s}
@keyframes pop{50%{transform:scale(.9)}}

/* ---------- UNBLOCK ---------- */
.ub-wrap{position:relative;width:min(100%,380px);padding:12px;background:#151924;border-radius:24px;border:1px solid var(--line)}
.ub-board{position:relative;width:100%;aspect-ratio:1;border-radius:12px;
  background-color:#0F121A;background-image:linear-gradient(#1C2130 1px,transparent 1px),linear-gradient(90deg,#1C2130 1px,transparent 1px);background-size:calc(100%/6) calc(100%/6);touch-action:none}
.ub-exit{position:absolute;right:0;width:12px;top:calc(12px + (100% - 24px)*2/6);height:calc((100% - 24px)/6);background:#0F121A;display:grid;place-items:center;color:var(--ub);font-weight:900;font-size:14px}
.ub-exit::after{content:"›";}
.car{position:absolute;padding:3.5px;touch-action:none;transition:left .15s ease-out,top .15s ease-out}
.car.drag{transition:none;z-index:3}
.car .body{width:100%;height:100%;border-radius:10px;background:linear-gradient(160deg,#4A5674,#36405A);box-shadow:inset 0 1px 0 rgba(255,255,255,.12),inset 0 -3px 0 rgba(0,0,0,.25);
  display:grid;place-items:center}
.car.l3 .body{background:linear-gradient(160deg,#5C5288,#443C69)}
.car.red .body{background:linear-gradient(160deg,#FF8A74,#FF5A4E);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),inset 0 -3px 0 rgba(0,0,0,.2),0 0 22px -6px #FF6B5E}
.car.red .body::after{content:"→";color:#3A0E0A;font-weight:900;font-size:20px;opacity:.7}
.car.drag .body{filter:brightness(1.15)}
.car.out{left:110%!important;opacity:0;transition:left .45s ease-in,opacity .45s}

/* ---------- QUEENS ---------- */
.qn-wrap{position:relative;width:min(100%,400px);aspect-ratio:1;touch-action:none;--fs:calc(min(100vw - 32px, 400px) / var(--n) * .56)}
.qn-grid{position:absolute;inset:0;display:grid;border-radius:9px;overflow:hidden}
.qn-cell{position:relative;min-width:0;min-height:0;overflow:hidden}
.qn-cell::after{content:"";position:absolute;inset:0;display:grid;place-items:center;font-size:var(--fs);line-height:1;color:#191326;font-weight:900}
.qn-cell.x::after{content:"×";font-weight:700;opacity:.5}
.qn-cell.ax::after{content:"×";font-weight:600;opacity:.22}
.qn-cell.q::after{content:"♛";}
.qn-cell.bad{background-image:repeating-linear-gradient(45deg,rgba(220,38,38,.38) 0 5px,transparent 5px 10px)}
.qn-cell.bad.q::after{color:#B91C1C}
.qn-svg{position:absolute;pointer-events:none}
.qn-wrap.erasing{outline:2px dashed rgba(255,107,107,.6);outline-offset:4px;border-radius:12px}
.qn-tools{display:flex;gap:6px;width:min(100%,400px)}
.qn-tools button{flex:1;height:42px;border-radius:12px;background:var(--s1);border:1px solid var(--line);font-weight:700;font-size:13.5px;color:var(--mute)}
.qn-tools button.on{background:#fff;color:#0B0D12;border-color:#fff}
.qn-tools button.auto{flex:.8}
.qn-tools button.auto.on{background:var(--qn);border-color:var(--qn);color:#1A1030}
/* ---------- 24 ---------- */
.t24-dots{display:flex;gap:7px}
.t24-dots i{width:28px;height:6px;border-radius:3px;background:var(--s3)}
.t24-dots i.done{background:var(--t24)}
.t24-dots i.cur{background:#fff}
.t24-cards{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:min(100%,340px)}
.t24-card{aspect-ratio:1.15;border-radius:22px;background:var(--s1);border:1.5px solid var(--line);font-size:44px;font-weight:800;display:grid;place-items:center;transition:.15s}
.t24-card.sel{border-color:var(--t24);background:#10302B;box-shadow:0 0 0 3px rgba(59,227,195,.18)}
.t24-card.gone{visibility:hidden;transition:none}
.t24-card.win{background:var(--t24);color:#062A23;border-color:var(--t24)}
.t24-card .fr{display:inline-flex;flex-direction:column;align-items:center;font-size:28px;line-height:1}
.t24-card .fr i{font-style:normal;border-top:2.5px solid currentColor;padding-top:2px;margin-top:2px}
.t24-ops{display:flex;gap:10px}
.t24-op{width:62px;height:56px;border-radius:16px;background:var(--s2);border:1.5px solid var(--line);font-size:26px;font-weight:800;color:var(--t24)}
.t24-op.sel{background:var(--t24);color:#062A23;border-color:var(--t24)}
.toast{font-size:13px;color:var(--mute);min-height:18px;text-align:center}
.toast b{color:var(--t24)}

/* ---------- KENKEN ---------- */
.kk-grid{display:grid;width:min(100%,380px);aspect-ratio:1;background:var(--s1);border:3px solid #E9ECF3;border-radius:8px;overflow:hidden}
.kk-cell{position:relative;display:grid;place-items:center;font-size:clamp(20px,8vw,34px);font-weight:800;border:0 solid #E9ECF3;box-shadow:inset 0 0 0 .5px #303647}
.kk-cell .lab{position:absolute;top:3px;left:5px;font-size:clamp(9px,2.8vw,12px);font-weight:800;color:var(--kk);letter-spacing:-.01em}
.kk-cell.sel{background:#22301A}
.kk-cell.peer{background:#161A24}
.kk-cell.sel.peer{background:#22301A}
.kk-cell.dup{color:#FF6B6B}
.kk-cell.badcage .lab{color:#FF6B6B}
.kk-pad{display:flex;gap:8px;width:min(100%,380px)}
.kk-key{flex:1;height:56px;border-radius:15px;background:var(--s2);border:1.5px solid var(--line);font-size:24px;font-weight:800}
.kk-key:active{background:var(--s3)}
.kk-key.del{font-size:18px;color:var(--mute)}


/* ---------- LINKS ---------- */
.lk-svg{width:min(100%,400px);aspect-ratio:1;background:#10131B;border-radius:18px;border:1px solid var(--line);touch-action:none;display:block}
/* ---------- PIPES ---------- */
.pp-grid{display:grid;gap:3px;width:min(100%,400px);aspect-ratio:1;padding:8px;background:#10131B;border-radius:20px;border:1px solid var(--line)}
.pp-tile{background:#171B25;border-radius:9px;display:grid;place-items:center;color:#3A4254;overflow:hidden}
.pp-tile svg{width:100%;height:100%;transition:transform .16s ease-out;display:block}
.pp-tile.wet{color:var(--pp)}
.pp-tile.wet.src{color:var(--pp)}
.pp-grid.solved .pp-tile{color:var(--pp);background:#13243A}
/* ---------- POUR ---------- */
.pr-rack{display:grid;justify-content:center;gap:22px 12px;width:min(100%,400px);padding:18px 6px 6px}
.tube{width:46px;height:168px;border:2.5px solid #3A4152;border-top:0;border-radius:0 0 23px 23px;display:flex;flex-direction:column-reverse;padding:3px;gap:0;overflow:hidden;
  transition:transform .15s,border-color .15s;background:rgba(255,255,255,.02);position:relative}
.tube::before{content:"";position:absolute;top:0;left:-6px;right:-6px;height:3px}
.tube i{display:block;height:25%;flex:none;border-radius:2px;box-shadow:inset 0 -2px 0 rgba(0,0,0,.18)}
.tube i:first-child{border-radius:0 0 18px 18px}
.tube.sel{transform:translateY(-16px);border-color:#fff}
.tube.done{border-color:var(--pr);box-shadow:0 0 18px -6px var(--pr)}
.rack-small .tube{width:38px;height:144px}
/* ---------- FLOOD ---------- */
.fl-grid{display:grid;width:min(100%,400px);aspect-ratio:1;border-radius:14px;overflow:hidden;border:1px solid var(--line)}
.fl-grid i{display:block;transition:background-color .28s}
.fl-grid i.home{box-shadow:inset 0 0 0 2px rgba(255,255,255,.75)}
.fl-pal{display:flex;gap:9px;justify-content:center;width:min(100%,400px)}
.fl-btn{flex:1;max-width:58px;aspect-ratio:1;border-radius:16px;box-shadow:inset 0 -4px 0 rgba(0,0,0,.2);transition:transform .1s,opacity .2s}
.fl-btn:active{transform:scale(.9)}
.fl-btn.cur{opacity:.25}
/* ---------- HOME SECTIONS ---------- */
.sec{font-size:12px;font-weight:800;color:var(--mute);margin:18px 4px 8px;display:flex;justify-content:space-between;align-items:baseline}
.sec span{font-weight:600;color:var(--dim);font-size:11.5px}


/* ---------- 2048 ---------- */
.g2-board{position:relative;width:min(100%,380px);aspect-ratio:1;background:#151924;border-radius:18px;border:1px solid var(--line);touch-action:none}
.g2-bg,.g2-t{position:absolute;width:21.25%;height:21.25%;border-radius:11px}
.g2-bg{background:#1C2130}
.g2-t{display:grid;place-items:center;font-weight:800;font-size:clamp(22px,8.5vw,36px);transition:left .1s ease-out,top .1s ease-out;letter-spacing:-.02em}
.g2-t.d3{font-size:clamp(18px,7vw,30px)}.g2-t.d4{font-size:clamp(15px,5.6vw,24px)}.g2-t.d5{font-size:clamp(12px,4.4vw,19px)}
.g2-t.new{animation:g2in .2s ease-out}
.g2-t.merged{animation:g2pop .2s}
.g2-t.dead{z-index:0}
@keyframes g2in{from{transform:scale(.3);opacity:0}}
@keyframes g2pop{50%{transform:scale(1.15)}}
/* ---------- SOLO ---------- */
.solo-row{display:grid;grid-template-columns:1fr auto;gap:8px}
.add2{height:52px;padding:0 16px;border-radius:15px;background:transparent;border:1.5px dashed #3A4152;color:var(--mute);font-weight:700;font-size:14px;white-space:nowrap}
.lnk{color:var(--mute);text-decoration:underline;text-underline-offset:2px;font-size:11.5px;font-weight:700}
.res-row.solo1{grid-template-columns:1fr}

/* ---------- HUE ---------- */
.hu-grid{display:grid;gap:3px;touch-action:none;transition:gap .4s}
.hu-t{aspect-ratio:1;border-radius:6px;position:relative;transition:transform .12s,border-radius .4s}
.hu-t.fixed::after{content:"";position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:rgba(11,13,18,.55)}
.hu-t.sel{transform:scale(.82);box-shadow:0 0 0 3px #fff}
.hu-grid.solved{gap:0}.hu-grid.solved .hu-t{border-radius:0}
/* ---------- ONE LINE ---------- */
.ol-svg{display:block;touch-action:none;background:#10131B;border-radius:22px;border:1px solid var(--line)}
.ol-svg.done{box-shadow:0 0 0 2px var(--ol),0 0 40px -10px var(--ol)}
/* ---------- TANGO ---------- */
.tg-wrap{position:relative;width:min(100%,390px);aspect-ratio:1}
.tg-grid{position:absolute;inset:0;display:grid;gap:4px}
.tg-c{background:#1A1E29;border-radius:10px;display:grid;place-items:center;padding:16%;min-width:0;min-height:0}
.tg-c svg{width:100%;height:100%;display:block}
.tg-c.given{background:#262B38}
.tg-c.bad{background:#3A1A20;box-shadow:inset 0 0 0 2px #FF6B6B}
.tg-sign{position:absolute;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;background:#0B0D12;color:#C9CDD8;display:grid;place-items:center;font-size:13px;font-weight:900;line-height:1;pointer-events:none;border:1px solid #3A4152}
.tg-sign.bad{color:#FF6B6B;border-color:#FF6B6B}
/* ---------- LOBBY / DUEL ---------- */
.dim{color:var(--dim)}
.pdot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px;vertical-align:1px}
.pill.on{background:#fff;color:#0B0D12;border-color:#fff}
.pill.on .dot{background:var(--pc,#22C55E)}
.sheet{max-height:92dvh;overflow:auto}
.lobby .rules{background:var(--s2);border-radius:14px;padding:10px 12px;margin-bottom:10px}
.lobby .rules p{font-size:12.5px;margin:0 0 6px;line-height:1.42}
.lobby .lobby-btns{margin-bottom:12px}
.fold{border-top:1px solid var(--line);padding:2px 0}
.fold>summary{list-style:none;cursor:pointer;display:flex;align-items:baseline;gap:8px;padding:12px 2px;font-size:15px}
.fold>summary::-webkit-details-marker{display:none}
.fold>summary::after{content:"›";margin-left:auto;color:var(--mute);font-size:18px;transition:transform .2s}
.fold[open]>summary::after{transform:rotate(90deg)}
.fold>summary small{color:var(--mute);font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lobby .rules p:last-child{margin:0}
.opt{margin-bottom:12px}
.opt>label{display:block;font-size:12px;color:var(--mute);font-weight:700;margin:0 2px 6px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:4px;background:var(--s2);border:1px solid var(--line);border-radius:14px;padding:4px}
.seg button{min-height:42px;padding:6px 4px;border-radius:10px;font-weight:700;font-size:13.5px;color:var(--mute);line-height:1.15}
.seg button small{display:block;font-size:10.5px;font-weight:600;opacity:.7;margin-top:2px}
.seg button.on{background:#fff;color:#0B0D12}
.note{font-size:12px;color:var(--mute);text-align:center;margin-bottom:4px}
.verdict .vs{margin-top:6px;font-size:13px;color:var(--mute)}
.turn{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px;padding:9px 12px;border-radius:14px;
  background:color-mix(in srgb,var(--pc) 15%,var(--s1));border:1.5px solid var(--pc);font-size:14px}
.turn b{color:var(--pc)}
.turn .sc{font-size:12px;white-space:nowrap}
.turn .sc b{color:var(--tx)}
#app.duelling{box-shadow:inset 0 4px 0 var(--pc)}
.handoff{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:30px;text-align:center;
  background:radial-gradient(circle at 50% 38%,color-mix(in srgb,var(--pc) 55%,#0B0D12),#0B0D12 72%);animation:fade .2s}
.handoff .kick{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#D9DCE5;font-weight:800}
.handoff .who{font-size:52px;font-weight:800;letter-spacing:-.02em;color:#fff;line-height:1.05;margin-top:6px}
.handoff .sub{color:#fff;font-size:20px;font-weight:700}
.handoff .det{color:#C3C7D2;font-size:14px;margin:4px 0 22px}
.handoff .go{height:60px;padding:0 36px;border-radius:18px;background:var(--pc);color:#0B0D12;font-weight:800;font-size:18px;box-shadow:0 10px 40px -12px var(--pc)}
.handoff .lnk{margin-top:16px}
.res{border-left:3px solid var(--rc,transparent)}
.res.lost b{color:var(--mute)}
.cbtn.concede{color:#FF8A8A;border-color:#3A2A30}
.cbtn.warn{background:#4A1D24;color:#fff;border-color:#FF6B6B}

/* ---------- ZIP ---------- */
.zp-svg{display:block;width:min(100%,400px);aspect-ratio:1;background:#10131B;border-radius:18px;border:1px solid var(--line);touch-action:none}
.zp-svg.done{box-shadow:0 0 0 2px var(--zp),0 0 40px -10px var(--zp)}
/* ---------- BRIDGES ---------- */
.hb-svg{display:block;width:min(100%,400px);aspect-ratio:1;background:#10131B;border-radius:18px;border:1px solid var(--line);touch-action:none}
.hb-svg.done{box-shadow:0 0 0 2px var(--hb),0 0 40px -10px var(--hb)}
/* ---------- NONOGRAM ---------- */
.ng-view{width:100%;overflow:hidden;border-radius:10px;touch-action:none}
.ng-view.zoomed{overflow:auto;max-height:62dvh;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.ng-view.panning{touch-action:pan-x pan-y}.ng-view.panning .ng{touch-action:pan-x pan-y}
.ng{display:grid;touch-action:none;user-select:none;width:max-content;margin:0 auto}
.ng-corner{position:sticky;left:0;top:0;z-index:3;background:var(--bg)}
.ng-cc{position:sticky;top:0;z-index:2;background:var(--bg);display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:1px;padding-bottom:4px;font-size:var(--fs);font-weight:800;color:#C9CDD8;line-height:1.05}
.ng-rc{position:sticky;left:0;z-index:2;background:var(--bg);display:flex;justify-content:flex-end;align-items:center;gap:4px;padding-right:6px;font-size:var(--fs);font-weight:800;color:#C9CDD8}
.ng-cc.ok,.ng-rc.ok{color:#4A5165}
.ng-c{background:#1A1E29;border-right:1px solid #0B0D12;border-bottom:1px solid #0B0D12;position:relative}
.ng-c.br{border-right:2px solid #5A6175}.ng-c.bb{border-bottom:2px solid #5A6175}
.ng-c.f{background:var(--ng)}
.ng-c.x::after{content:"×";position:absolute;inset:0;display:grid;place-items:center;color:#5A6175;font-weight:700;font-size:calc(var(--cs)*.7);line-height:1}
.ng.done .ng-c.x::after{opacity:0}.ng.done .ng-c{border-color:transparent}
/* ---------- SHIKAKU ---------- */
.sk-board{position:relative;border-radius:10px;touch-action:none;background-color:#141822;border:2px solid #2A3040;
  background-image:linear-gradient(#262B39 1px,transparent 1px),linear-gradient(90deg,#262B39 1px,transparent 1px)}
.sk-layer{position:absolute;inset:0;pointer-events:none}
.sk-rect{position:absolute;padding:2px;box-sizing:border-box}
.sk-rect::before{content:"";position:absolute;inset:2px;border-radius:7px;background:var(--rc);opacity:.78;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)}
.sk-rect.bad::before{background:repeating-linear-gradient(45deg,rgba(255,107,107,.45) 0 6px,rgba(255,107,107,.18) 6px 12px);opacity:1;box-shadow:inset 0 0 0 2px #FF6B6B}
.sk-rect.preview{pointer-events:none;z-index:2}.sk-rect.preview::before{background:rgba(255,255,255,.14);box-shadow:inset 0 0 0 2px #fff;opacity:1}
.sk-num{position:absolute;transform:translate(-50%,-50%);font-weight:900;font-size:clamp(14px,4.6vw,20px);color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.6);z-index:3}
.sk-board.done{box-shadow:0 0 0 2px var(--sk),0 0 40px -10px var(--sk)}
/* ---------- MINESWEEPER ---------- */
.ms-grid{display:grid;gap:2px;touch-action:none;-webkit-touch-callout:none}
.ms-c{height:var(--cs);border-radius:5px;background:linear-gradient(160deg,#3A4152,#2C3242);display:grid;place-items:center;font-weight:900;font-size:calc(var(--cs)*.55);box-shadow:inset 0 -2px 0 rgba(0,0,0,.25)}
.ms-c.o{background:#161A24;box-shadow:none}
.ms-c.fl::after{content:"⚑";color:#FF6B6B;font-size:calc(var(--cs)*.55)}
.ms-c.mine{background:#3A1A20}.ms-c.mine::after{content:"✸";color:#FF6B6B}
.ms-c.boom{background:#FF5A5F}.ms-c.boom::after{color:#fff}
.ms-grid.done .ms-c:not(.o){background:#2A4A3A}

/* ---------- HANGMAN ---------- */
.hm-cat{font-size:13px;font-weight:700;color:var(--acc);background:color-mix(in srgb,var(--acc) 12%,var(--s1));border:1px solid color-mix(in srgb,var(--acc) 35%,transparent);padding:6px 12px;border-radius:999px}
.hm-fig{width:min(100%,240px)}.hm-fig svg{display:block;width:100%}
.hm-fig .gal path{stroke:#5A6175;stroke-width:5;fill:none;stroke-linecap:round;stroke-linejoin:round}
.hm-fig .man *{stroke:#FF8FA3;stroke-width:5;fill:none;stroke-linecap:round;animation:pop .25s}
.hm-fig.lost .man *{stroke:#FF5A5F}.hm-fig .eyes path{stroke:#FF5A5F;stroke-width:2;stroke-linecap:round}
.hm-word{display:flex;gap:min(6px,1.2vw);justify-content:center;flex-wrap:nowrap;width:100%}
.hm-word span{flex:0 1 calc((100% - 8px * var(--n)) / var(--n));max-width:34px;height:42px;border-bottom:3px solid #4A5165;display:grid;place-items:end center;padding-bottom:3px;font-size:clamp(17px,6vw,26px);font-weight:800;text-transform:uppercase}
.hm-word span.on{border-color:var(--acc)}.hm-word span.missed{color:#FF6B6B;border-color:#FF6B6B}
.hm-word.won span{color:#3DDC84;border-color:#3DDC84}
.hm-kb{display:flex;flex-direction:column;gap:6px;width:100%}
.hm-row{display:flex;gap:4px;justify-content:center}
.hm-key{flex:1 1 0;min-width:0;max-width:38px;height:46px;border-radius:9px;background:#2C3242;font-weight:800;font-size:17px;text-transform:uppercase;box-shadow:inset 0 -2px 0 rgba(0,0,0,.3)}
.hm-key:active{background:#3A4152}
.hm-key.hit{background:#1E4A33;color:#3DDC84;box-shadow:none}.hm-key.miss{background:#2A1A1E;color:#7A4A52;box-shadow:none}
/* ---------- WORD SEARCH ---------- */
.ws-board{position:relative;width:min(100%,410px);aspect-ratio:1;background:#12151D;border-radius:16px;border:1px solid var(--line);touch-action:none}
.ws-svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.ws-svg line.f{opacity:.45}
.ws-letters{position:absolute;inset:0;display:grid;grid-template-columns:repeat(var(--n),1fr)}
.ws-letters span{display:grid;place-items:center;font-weight:800;font-size:calc(min(100vw - 32px, 410px) / var(--n) * .5);color:#ECEEF3;pointer-events:none}
.ws-board.done{box-shadow:0 0 0 2px var(--ws),0 0 40px -10px var(--ws)}
.ws-list{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:410px}
.ws-list span{padding:5px 10px;border-radius:999px;background:var(--s1);border:1px solid var(--line);font-size:13.5px;font-weight:700;color:#C9CDD8}
.ws-list span.done{text-decoration:line-through;color:#0B0D12;background:var(--fc);border-color:var(--fc);opacity:.85}
/* ---------- TENTS ---------- */
.tn{display:grid;gap:3px;width:min(100%,400px);touch-action:none}
.tn-cnt{display:grid;place-items:center;font-weight:800;font-size:14px;color:#C9CDD8;min-height:22px}
.tn-cnt.ok{color:#4A5165}.tn-cnt.over{color:#FF6B6B}
.tn-c{aspect-ratio:1;border-radius:6px;background:#1A2A20;display:grid;place-items:center;padding:12%;position:relative}
.tn-c svg{width:100%;height:100%;display:block}
.tn-c.tree{background:#163322}
.tn-c.grass{background:#25472F}.tn-c.grass::after{content:"";width:22%;height:22%;border-radius:50%;background:#3E7A4F}
.tn-c.tent{background:#3A2E18}.tn-c.bad{box-shadow:inset 0 0 0 2px #FF6B6B}
.tn.done .tn-c.grass::after{opacity:0}
/* ---------- WRITE A WORD ---------- */
.wordform{display:flex;flex-direction:column;gap:10px;width:min(100%,340px);margin-top:6px}
.wf-row{display:flex;gap:8px}
.wordform input{flex:1;min-width:0;width:100%;height:54px;border-radius:14px;border:1.5px solid rgba(255,255,255,.25);background:rgba(0,0,0,.35);color:#fff;font-size:22px;font-weight:800;text-align:center;letter-spacing:.08em;outline:none;text-transform:lowercase}
.wordform .wf-word{flex:none;text-transform:none}
.wordform .wf-word::placeholder{color:rgba(255,255,255,.45)}
.wordform .wf-hint{font-size:15px;font-weight:600;letter-spacing:0;height:46px;text-transform:none;flex:none}
.wf-err{min-height:18px;color:#FFD0D0;font-size:13px}
.wordform .go{width:100%}

/* ---------- hints ---------- */
.hintfx{animation:hintPulse .7s ease-in-out 4!important;box-shadow:0 0 0 3px #FFC247,0 0 22px rgba(255,194,71,.85)!important;z-index:4}
@keyframes hintPulse{50%{filter:brightness(1.45)}}
.cbtn.hintb{border-color:rgba(255,194,71,.45);color:#FFC247}
/* ---------- BLOOM (match-3) ---------- */
.stage:has(.bl-wrap){justify-content:center;padding-top:2px}
.bl-wrap{width:calc(100% + 20px);max-width:460px;margin:0 -10px;display:flex;flex-direction:column;gap:10px;user-select:none;-webkit-user-select:none;background:var(--bl-bg);border-radius:24px;padding:16px 4px 8px;box-shadow:0 8px 26px rgba(0,0,0,.4)}
.bl-hud{position:relative;display:flex;align-items:center;gap:8px;background:var(--bl-hbg);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-radius:20px;padding:7px 10px 7px 7px;border:2px solid rgba(255,255,255,.85);box-shadow:0 8px 22px rgba(40,10,60,.28);color:var(--bl-txt);margin:0 2px}
.bl-hud.hard{border-color:#FF5A64;box-shadow:0 0 0 2px #E5323A,0 8px 22px rgba(80,10,20,.35)}
.bl-hud.super{border-color:#E25AB8;box-shadow:0 0 0 2px #8E1A8A,0 8px 22px rgba(80,10,50,.4)}
.bl-tag{position:absolute;left:50%;top:-12px;transform:translateX(-50%);background:linear-gradient(180deg,#FF6B6B,#D4202B);color:#fff;font-weight:900;font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:3px 12px;border-radius:99px;box-shadow:0 2px 0 #8E0C18;white-space:nowrap}
.bl-hud.super .bl-tag{background:linear-gradient(180deg,#E25AB8,#8E1A8A);box-shadow:0 2px 0 #5A0A55}
.bl-moves{flex:none;width:60px;height:60px;border-radius:16px;background:linear-gradient(180deg,var(--bl-acc2),var(--bl-acc));box-shadow:inset 0 -4px 0 rgba(0,0,0,.16),inset 0 2px 0 rgba(255,255,255,.35),0 3px 0 var(--bl-accd);display:grid;place-items:center;align-content:center;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.22)}
.bl-moves b{font-size:25px;line-height:1;font-weight:900;font-variant-numeric:tabular-nums}
.bl-moves small{font-size:9px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;opacity:.95}
.bl-moves.low{background:linear-gradient(180deg,#FF8A80,#E8323A 60%,#B3161F);box-shadow:inset 0 -4px 0 rgba(0,0,0,.16),0 3px 0 #8E0C18;animation:blLow 1s ease-in-out infinite}
@keyframes blLow{50%{transform:scale(1.07)}}
.bl-goals{flex:1;display:flex;gap:6px;justify-content:center;min-width:0}
.bl-goal{position:relative;flex:0 1 64px;height:56px;border-radius:14px;background:var(--bl-gbg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.bl-goal svg{width:31px;height:31px}
.bl-goal b{font-size:15px;font-weight:900;line-height:1;font-variant-numeric:tabular-nums;color:var(--bl-txt)}
.bl-goal.done b{visibility:hidden}
.bl-goal.done::after{content:"✓";position:absolute;right:-4px;bottom:-4px;width:22px;height:22px;border-radius:50%;background:#3DBE5A;color:#fff;font-weight:900;font-size:14px;display:grid;place-items:center;box-shadow:0 2px 0 #23863B}
.bl-goal.bump{animation:blBump .25s ease-out}
@keyframes blBump{40%{transform:scale(1.16)}}
.bl-score{position:absolute;right:12px;top:-11px;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--bl-txt);background:var(--bl-gbg);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1.5px solid rgba(255,255,255,.9);border-radius:99px;padding:2px 9px;white-space:nowrap}
.bl-score b{display:inline;font-size:12px;letter-spacing:0;font-variant-numeric:tabular-nums;margin-left:4px}
.bl-cmb{position:absolute;right:100%;top:0;margin-right:5px;font-style:normal;font-size:10px;font-weight:900;white-space:nowrap;background:#FFC93A;color:#6A3A00;border-radius:99px;padding:1px 7px;opacity:0;letter-spacing:0;text-transform:none}
.bl-cmb.on{animation:blCmb 2.2s ease-out forwards}@keyframes blCmb{0%{opacity:0;transform:scale(.6)}10%{opacity:1;transform:scale(1.15)}20%{transform:none}80%{opacity:1}100%{opacity:0}}
.bl-scene{position:relative;border-radius:18px;overflow:hidden;padding:8px 2px;display:grid;place-items:center}
.bl-board{position:relative;touch-action:none}
.bl-frame{position:absolute;inset:0;filter:drop-shadow(0 6px 14px rgba(40,10,70,.3))}
.bl-frame>div{position:absolute;inset:0}.bl-frame i{position:absolute;background:#fff;border-radius:12px}
.bl-frame .o{opacity:var(--bl-bo)}.bl-frame .n{opacity:var(--bl-bi)}.bl-frame .n i{border-radius:8px}
.bl-tiles,.bl-obs,.bl-pcs,.bl-fx{position:absolute;inset:0}
.bl-pcs{overflow:hidden}
.bl-fx{pointer-events:none}
.bl-tile{position:absolute;border-radius:6px;background:var(--bl-tile)}
.bl-tile.grass{background-color:var(--bl-carpet);background-image:radial-gradient(rgba(255,255,255,.09) 1px,transparent 1.4px),radial-gradient(rgba(0,60,20,.18) 1px,transparent 1.4px);background-size:6px 6px,7px 7px;background-position:0 0,3px 2px;box-shadow:none;border-radius:0}
.bl-tile.grow{animation:blGrow .4s ease-out}
@keyframes blGrow{0%{filter:saturate(1.6) brightness(1.15)}100%{filter:none}}
.bl-ice{position:absolute;pointer-events:none;border-radius:7px;background:linear-gradient(135deg,rgba(225,246,255,.92),rgba(170,220,250,.85));box-shadow:inset 0 0 0 2.5px #fff,inset 0 0 0 4px rgba(110,180,230,.5)}
.bl-ice::before{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(135deg,transparent 22%,rgba(255,255,255,.95) 23% 29%,transparent 30% 44%,rgba(255,255,255,.8) 45% 49%,transparent 50%)}
.bl-ice.l2{background:linear-gradient(135deg,rgba(240,250,255,.98),rgba(150,205,240,.95));box-shadow:inset 0 0 0 3px #fff,inset 0 0 0 6px rgba(90,160,220,.6),inset 0 0 12px rgba(255,255,255,.9)}
.bl-ice.crack{animation:blShake .22s}
.bl-pc{position:absolute;left:0;top:0;will-change:transform}
.bl-pc svg{position:absolute;inset:2%;width:96%;height:96%;overflow:visible;transition:transform .12s}
.bl-pc.sel svg{transform:scale(1.14);filter:drop-shadow(0 0 5px #fff) drop-shadow(0 0 3px #FFE14D)}
.bl-pc.hint svg{animation:blHint 1s ease-in-out infinite}
@keyframes blHint{0%,100%{transform:none}25%{transform:scale(1.12) rotate(-6deg)}75%{transform:scale(1.12) rotate(6deg)}}
.bl-pc.sp svg{animation:blIdle 1.6s ease-in-out infinite}
.bl-pc[data-sp=rain] svg{animation:none}
.bl-dfr{opacity:0;animation:blDfr 1.8s step-end infinite}.bl-pc.go .bl-dfr,.bl-sprite.go .bl-dfr{animation-duration:.45s}
@keyframes blDfr{0%{opacity:1}16.67%,100%{opacity:0}}
.bl-tw{transform-box:fill-box;transform-origin:center;animation:blTw 1.8s ease-in-out infinite}@keyframes blTw{0%,100%{opacity:.2;transform:scale(.5)}50%{opacity:1;transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.bl-dfr{animation:none}.bl-dfr:nth-child(3){opacity:1}.bl-tw{animation:none}}
@keyframes blIdle{50%{transform:scale(1.06)}}
@keyframes blSpin{to{transform:rotate(360deg)}}
.bl-trail{position:absolute;pointer-events:none;border-radius:99px;z-index:4}
.bl-trail.h{background:linear-gradient(180deg,transparent,rgba(255,206,90,.85) 32%,#fff 50%,rgba(255,206,90,.85) 68%,transparent)}
.bl-trail.v{background:linear-gradient(90deg,transparent,rgba(255,206,90,.85) 32%,#fff 50%,rgba(255,206,90,.85) 68%,transparent)}
.bl-cv{position:absolute;left:0;top:0;pointer-events:none;z-index:8}
.bl-word{position:absolute;left:50%;top:40%;z-index:9;pointer-events:none;white-space:nowrap;font-weight:900;font-size:25px;letter-spacing:.01em;color:#FFE14D;
  -webkit-text-stroke:2px #7A3A00;paint-order:stroke fill;text-shadow:0 3px 0 #7A3A00,0 6px 14px rgba(40,10,80,.45)}
.bl-glow{position:absolute;border-radius:50%;pointer-events:none;background:radial-gradient(circle,#fff 0,rgba(255,248,210,.95) 22%,rgba(255,200,80,.55) 50%,transparent 70%);z-index:5}
.bl-box,.bl-chain{position:absolute;pointer-events:none}
.bl-box svg,.bl-chain svg{width:100%;height:100%;display:block}
.bl-box.hit{animation:blShake .22s}
@keyframes blShake{20%{transform:translateX(-3px) rotate(-3deg)}50%{transform:translateX(3px) rotate(3deg)}80%{transform:translateX(-1px)}}
.bl-box.gone,.bl-chain.gone,.bl-ice.gone{animation:blGone .3s ease-in forwards}
@keyframes blGone{to{transform:scale(1.25);opacity:0}}
.bl-chain{z-index:2}
.bl-ring{position:absolute;border-radius:50%;border:4px solid #FFF6C8;box-shadow:0 0 16px #FFD54A,inset 0 0 12px #FFE680;pointer-events:none}
.bl-flash{position:absolute;inset:0;background:#fff;pointer-events:none;border-radius:12px}
.bl-sprite{position:absolute;pointer-events:none;z-index:5}
.bl-fly{position:fixed;z-index:70;pointer-events:none;width:34px;height:34px}
.bl-banner{position:absolute;left:50%;top:44%;z-index:20;transform:translate(-50%,-50%) scale(.6);opacity:0;text-align:center;white-space:nowrap;pointer-events:none;
  font-weight:900;font-size:28px;color:#fff;letter-spacing:.01em;background:linear-gradient(180deg,var(--bl-acc2),var(--bl-acc));padding:10px 26px;border-radius:18px;border:3px solid #fff;box-shadow:0 5px 0 var(--bl-accd),0 10px 24px rgba(30,10,80,.5);text-shadow:0 2px 0 rgba(0,0,0,.25);transition:opacity .2s,transform .35s cubic-bezier(.3,1.6,.5,1)}
.bl-banner small{display:block;font-size:18px;color:#FFE14D;letter-spacing:.1em}
.bl-banner.good{background:linear-gradient(180deg,#6FE08A,#2DB34F);box-shadow:0 5px 0 #1C7A35,0 10px 24px rgba(10,60,20,.45)}
.bl-banner.bad{background:linear-gradient(180deg,#FF7A7A,#D4202B);box-shadow:0 5px 0 #8E0C18,0 10px 24px rgba(80,10,20,.45)}
.bl-banner.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
.bl-card{position:absolute;inset:0;z-index:30;display:grid;place-items:center;background:rgba(40,20,90,.45);opacity:0;transition:opacity .25s}
.bl-card.on{opacity:1}
.bl-card>div{position:relative;width:min(80%,300px);background:#fff;border:4px solid var(--bl-acc);border-radius:24px;padding:26px 18px 16px;text-align:center;color:#3B2A6E;box-shadow:0 6px 0 var(--bl-accd),0 18px 40px rgba(20,5,60,.5);transform:scale(.7);transition:transform .35s cubic-bezier(.3,1.6,.5,1)}
.bl-card.on>div{transform:none}
.bl-card .rib{position:absolute;left:50%;top:-18px;transform:translateX(-50%);background:linear-gradient(180deg,#FFE680,#FFB020);color:#7A3A00;font-weight:900;font-size:16px;padding:5px 20px;border-radius:99px;box-shadow:0 3px 0 #B86E00;letter-spacing:.04em}
.bl-card .art{width:78px;height:78px;margin:0 auto 6px}
.bl-card .art svg{width:100%;height:100%}
.bl-card .art.six{display:flex;width:auto;height:auto;justify-content:center;gap:1px}.bl-card .art.six svg{width:36px;height:36px}
.bl-card h3{margin:2px 0 6px;font-size:21px;font-weight:900}
.bl-card p{margin:0 0 14px;font-size:14px;line-height:1.4;color:#5D4E8E}
.bl-card p b{color:#3B2A6E}
.bl-card button{width:100%;font:inherit;font-weight:900;font-size:16px;color:#fff;background:linear-gradient(180deg,#6FE08A,#2DB34F);border:0;border-radius:14px;padding:11px;box-shadow:0 4px 0 #1C7A35}
.bl-scene.shake{animation:blQuake .3s}.bl-scene.shake2{animation:blQuake .22s 2}

function mountUB(stage, controls, P, api) {
  const V = P.vehicles, parS = P.par;
  const start = V.map((v) => (v.h ? v.c : v.r));
  let pos = start.slice();
  api.setPar(+parS);
  const wrap = $('div', 'ub-wrap'), board = $('div', 'ub-board');
  wrap.append(board, $('div', 'ub-exit'));
  const cars = V.map((v, i) => {
    const car = $('div', 'car' + (i === 0 ? ' red' : '') + (v.len === 3 ? ' l3' : ''));
    car.appendChild($('div', 'body'));
    car.style.width = ((v.h ? v.len : 1) / 6 * 100) + '%';
    car.style.height = ((v.h ? 1 : v.len) / 6 * 100) + '%';
    board.appendChild(car);
    return car;
  });
  const place = (i, p) => { const v = V[i]; const r = v.h ? v.r : p, c = v.h ? p : v.c; cars[i].style.left = (c / 6 * 100) + '%'; cars[i].style.top = (r / 6 * 100) + '%'; };
  const placeAll = () => V.forEach((_, i) => place(i, pos[i]));
  placeAll();
  const occupied = (except) => {
    const g = new Array(36).fill(false);
    V.forEach((v, i) => { if (i === except) return; for (let k = 0; k < v.len; k++) g[(v.h ? v.r : pos[i] + k) * 6 + (v.h ? pos[i] + k : v.c)] = true; });
    return g;
  };
  let drag = null;
  cars.forEach((car, i) => {
    car.onpointerdown = (e) => {
      if (api.done || drag) return;
      e.preventDefault();
      const v = V[i], g = occupied(i);
      const free = (k) => !g[(v.h ? v.r : k) * 6 + (v.h ? k : v.c)];
      let lo = pos[i], hi = pos[i];
      while (lo - 1 >= 0 && free(lo - 1)) lo--;
      while (hi + v.len <= 5 && free(hi + v.len)) hi++;
      const cell = board.clientWidth / 6;
      drag = { i, id: e.pointerId, s: v.h ? e.clientX : e.clientY, p0: pos[i], lo, hi, cell, cur: pos[i] };
      try { car.setPointerCapture(e.pointerId); } catch (_) {}
      car.classList.add('drag');
    };
    car.onpointermove = (e) => {
      if (!drag || drag.i !== i || e.pointerId !== drag.id) return;
      const v = V[i];
      const d = (v.h ? e.clientX : e.clientY) - drag.s;
      const p = Math.max(drag.lo, Math.min(drag.hi, drag.p0 + d / drag.cell));
      drag.cur = p;
      const r = v.h ? v.r : p, c = v.h ? p : v.c;
      car.style.left = (c / 6 * 100) + '%'; car.style.top = (r / 6 * 100) + '%';
    };
    const end = (e) => {
      if (!drag || drag.i !== i) return;
      const np = Math.round(drag.cur);
      car.classList.remove('drag');
      pos[i] = np; place(i, np);
      if (np !== drag.p0) api.move();
      drag = null;
      if (i === 0 && np === 6 - V[0].len) {
        setTimeout(() => car.classList.add('out'), 120);
        api.win();
      }
    };
    car.onpointerup = end; car.onpointercancel = end;
  });
  stage.appendChild(wrap);
  api.hint(() => {
    const path = Core.ubPath(V.map((v, i) => (v.h ? { ...v, c: pos[i] } : { ...v, r: pos[i] })));
    if (!path || path.length < 2) return false;
    const k = path[1].findIndex((x, i) => x !== pos[i]); if (k < 0) return false;
    hintFx(cars[k]);
  });
  api.persist(() => ({ pos }), (d) => { pos = d.pos; placeAll(); });
  api.solution(() => {
    const path = Core.ubPath(V); if (!path) return;
    pos = path[0].slice(); placeAll();
    path.slice(1).forEach((q, k) => setTimeout(() => { pos = q.slice(); placeAll(); if (k === path.length - 2) setTimeout(() => cars[0].classList.add('out'), 350); }, 600 + k * 600));
  });
  api.btn('↺  Reset', () => { if (api.done) return; pos = start.slice(); placeAll(); api.resetMoves(); });
}

// ====================== QUEENS ======================
const QCOL = ['#E9A86B', '#8FB8F0', '#B6A0F2', '#9FD8A0', '#F0D27A', '#F29BA8', '#7FD4D0', '#D9BE96', '#C5CAD6', '#E8C3F0'];

  const C = cfg('qn');

  const hist = [];
  let tool = 'mark';
  const colorOrder = Core.rng(Core.hashStr('qc-' + num));
  const cols = QCOL.slice(); for (let i = cols.length - 1; i > 0; i--) { const j = Math.floor(colorOrder() * (i + 1)); [cols[i], cols[j]] = [cols[j], cols[i]]; }
  const wrap = $('div', 'qn-wrap'); wrap.style.setProperty('--n', n);

  const cells = [];
  for (let i = 0; i < n * n; i++) { const el = $('div', 'qn-cell'); el.style.background = cols[reg[i]]; cells.push(el); grid.appendChild(el); }
  // region borders drawn once as vector lines -> crisp, even, rounded joints

    const i = r * n + c;
    if (c < n - 1 && reg[i] !== reg[i + 1]) d += `M${c + 1} ${r}V${r + 1}`;
    if (r < n - 1 && reg[i] !== reg[i + n]) d += `M${c} ${r + 1}H${c + 1}`;
  }

  const svg = `<svg class="qn-svg" viewBox="-0.06 -0.06 ${n + 0.12} ${n + 0.12}"><path d="${thin}" stroke="rgba(0,0,0,.16)" stroke-width="0.025"/><path d="${d}" stroke="#0B0D12" stroke-width="0.085" stroke-linecap="round" stroke-linejoin="round" fill="none"/><rect x="0" y="0" width="${n}" height="${n}" rx="0.18" fill="none" stroke="#0B0D12" stroke-width="0.12"/></svg>`;
  wrap.append(grid);
  wrap.insertAdjacentHTML('beforeend', svg);
  { const pad = 0.06 / n * 100, el = wrap.lastElementChild; el.style.inset = `-${pad}%`; el.style.width = el.style.height = `${100 + 2 * pad}%`; }
  const attacked = (qs) => {
    const s = new Set();
    for (const q of qs) { const qr = Math.floor(q / n), qc = q % n;
      for (let i = 0; i < n * n; i++) { if (i === q) continue; const r = Math.floor(i / n), c = i % n;
        if (r === qr || c === qc || reg[i] === reg[q] || (Math.abs(r - qr) <= 1 && Math.abs(c - qc) <= 1)) s.add(i); } }

  };

      const i = qs[a], j = qs[b], ri = Math.floor(i / n), ci = i % n, rj = Math.floor(j / n), cj = j % n;
      if (ri === rj || ci === cj || reg[i] === reg[j] || (Math.abs(ri - rj) <= 1 && Math.abs(ci - cj) <= 1)) { bad.add(i); bad.add(j); }
    }
    const auto = C.autoX ? attacked(qs) : new Set();
    cells.forEach((el, i) => {

  const setTool = (t) => { tool = t; tMark.classList.toggle('on', t === 'mark'); tErase.classList.toggle('on', t === 'erase'); wrap.classList.toggle('erasing', t === 'erase'); };

  tAuto.onclick = () => { C.autoX = !C.autoX; store.save(); tAuto.classList.toggle('on', C.autoX); paint(); };

  api.hint(() => {

// ====================== KENKEN ======================
function mountKK(stage, controls, P, api) {

  const grid = $('div', 'kk-grid');

  for (let i = 0; i < n * n; i++) {
    const r = Math.floor(i / n), c = i % n, g = cageOf[i];
    const el = $('button', 'kk-cell num');
    const B = (cond) => (cond ? '2.5px' : '0');
    el.style.borderTopWidth = B(r > 0 && cageOf[i - n] !== g);
    el.style.borderLeftWidth = B(c > 0 && cageOf[i - 1] !== g);
    const cage = P.cages[g];

    const v = $('span', 'v'); el.appendChild(v);

  }

        if (b !== i && vals[b] === vals[i]) dup.add(i);

      if (!Core.cageOk(cg.op, cg.target, vs)) { badCage.add(gi); allCages = false; }

// ====================== LINKS ======================
function mountLK(stage, controls, P, api) {
  const n = P.n, K = P.k;
  const dotAt = new Map(); P.dots.forEach(([a, b], c) => { dotAt.set(a, c); dotAt.set(b, c); });
  let paths = P.dots.map(() => []), active = null;
  const NS = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(NS, 'svg'); svg.setAttribute('viewBox', `0 0 ${n} ${n}`); svg.setAttribute('class', 'lk-svg');
  const adj = (a, b) => Math.abs(Math.floor(a / n) - Math.floor(b / n)) + Math.abs((a % n) - (b % n)) === 1;
  const other = (c, d) => (P.dots[c][0] === d ? P.dots[c][1] : P.dots[c][0]);
  const complete = (c) => { const p = paths[c]; return p.length >= 2 && dotAt.get(p[0]) === c && p[p.length - 1] === other(c, p[0]); };
  const owner = (cell) => { for (let c = 0; c < K; c++) if (paths[c].includes(cell)) return c; return null; };
  const cxy = (i) => [(i % n) + 0.5, Math.floor(i / n) + 0.5];
  function render() {
    let h = '';
    for (let i = 1; i < n; i++) h += `<path d="M${i} 0V${n}M0 ${i}H${n}" stroke="#1E2330" stroke-width="0.03"/>`;
    paths.forEach((p, c) => p.forEach((i) => { h += `<rect x="${i % n}" y="${Math.floor(i / n)}" width="1" height="1" fill="${PAL[c]}" opacity="${complete(c) ? 0.22 : 0.12}"/>`; }));
    paths.forEach((p, c) => { if (p.length > 1) h += `<polyline points="${p.map((i) => cxy(i).join(',')).join(' ')}" fill="none" stroke="${PAL[c]}" stroke-width="0.34" stroke-linecap="round" stroke-linejoin="round"/>`; });
    P.dots.forEach(([a, b], c) => [a, b].forEach((d) => { const [x, y] = cxy(d); h += `<circle cx="${x}" cy="${y}" r="0.34" fill="${PAL[c]}"/>`; if (active === c) h += `<circle cx="${x}" cy="${y}" r="0.44" fill="none" stroke="${PAL[c]}" stroke-width="0.05" opacity=".6"/>`; }));
    svg.innerHTML = h;
    const linked = paths.filter((_, c) => complete(c)).length;
    const filled = new Set(paths.flat()).size;
    api.setExtra('Linked', `${linked}<i>/ ${K}</i>`);
    return { linked, filled };
  }
  const cellAt = (e) => { const r = svg.getBoundingClientRect(); const c = Math.floor((e.clientX - r.left) / r.width * n), rr = Math.floor((e.clientY - r.top) / r.height * n); return c < 0 || rr < 0 || c >= n || rr >= n ? null : rr * n + c; };
  svg.addEventListener('pointerdown', (e) => {
    if (api.done) return; e.preventDefault();
    const cell = cellAt(e); if (cell == null) return;
    api.start();
    if (dotAt.has(cell)) { const c = dotAt.get(cell); paths[c] = [cell]; active = c; }
    else { const o = owner(cell); if (o == null) return; paths[o] = paths[o].slice(0, paths[o].indexOf(cell) + 1); active = o; }

    if (dotAt.has(cell) && dotAt.get(cell) !== active) return;
    const o = owner(cell); if (o != null) paths[o] = paths[o].slice(0, paths[o].indexOf(cell));
    p.push(cell); render();
  });
  const up = () => { if (active == null) return; active = null; api.move(); const r = render(); if (r.linked === K && r.filled === n * n) api.win(); };
  svg.addEventListener('pointerup', up); svg.addEventListener('pointercancel', up);
  stage.appendChild(svg);
  render();
  api.hint(() => {
    const c = P.dots.findIndex((_, j) => !complete(j)); if (c < 0) return false;
    const seg = P.solution[c], used = new Set(seg);
    paths = paths.map((p, j) => { if (j === c) return seg.slice(); const cut = p.findIndex((x) => used.has(x)); return cut < 0 ? p : p.slice(0, cut); });
    active = null; const r = render(); if (r.linked === K && r.filled === n * n) api.win();
  });
  api.persist(() => ({ paths }), (d) => { paths = d.paths; active = null; render(); });
  api.solution(() => { paths = P.solution.map((sg) => sg.slice()); active = null; render(); });
  api.btn('↺  Reset', () => { if (api.done) return; paths = P.dots.map(() => []); render(); });
}

// ====================== POUR ======================

// ====================== ONE LINE ======================
function mountOL(stage, controls, P, api) {
  const { W, H } = P;
  const idx = new Map();
  P.edges.forEach(([a, b], k) => { idx.set(a + '-' + b, k); idx.set(b + '-' + a, k); });
  const xy = (v) => [v % W, Math.floor(v / W)];
  let path = [], usedE = [];
  const NS = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(NS, 'svg');
  svg.setAttribute('viewBox', `-0.6 -0.6 ${W + 0.2} ${H + 0.2}`);
  svg.setAttribute('class', 'ol-svg');
  svg.style.aspectRatio = `${W + 0.2} / ${H + 0.2}`;
  svg.style.width = `min(100%, ${Math.round(420 * (W + 0.2) / (H + 0.2))}px)`;
  const toast = $('div', 'toast', '&nbsp;');
  const cur = () => path[path.length - 1];
  function render() {
    let h = '';
    for (const [a, b] of P.edges) { const [x1, y1] = xy(a), [x2, y2] = xy(b); h += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#2A3040" stroke-width="0.16" stroke-linecap="round"/>`; }
    if (path.length > 1) h += `<polyline points="${path.map((v) => xy(v).join(',')).join(' ')}" fill="none" stroke="var(--ol)" stroke-width="0.17" stroke-linecap="round" stroke-linejoin="round"/>`;
    for (const v of P.nodes) { const [x, y] = xy(v); h += `<circle cx="${x}" cy="${y}" r="0.15" fill="${path.includes(v) ? '#9EE7FF' : '#3E4558'}"/>`; }
    if (path.length) { const [x, y] = xy(cur()); h += `<circle cx="${x}" cy="${y}" r="0.27" fill="none" stroke="#fff" stroke-width="0.06"/><circle cx="${x}" cy="${y}" r="0.17" fill="#fff"/>`; }
    svg.innerHTML = h;
    api.setExtra('Lines', `${usedE.length}<i>/ ${P.edges.length}</i>`);
  }
  const nodeAt = (e, rad) => {
    const r = svg.getBoundingClientRect();
    const ux = (e.clientX - r.left) / r.width * (W + 0.2) - 0.6, uy = (e.clientY - r.top) / r.height * (H + 0.2) - 0.6;
    let best = null, bd = rad;
    for (const v of P.nodes) { const [x, y] = xy(v); const d = Math.hypot(x - ux, y - uy); if (d < bd) { bd = d; best = v; } }
    return best;
  };
  const stepTo = (v) => {
    const c = cur();
    if (v === c) return;
    if (path.length >= 2 && v === path[path.length - 2] && usedE[usedE.length - 1] === idx.get(c + '-' + v)) { path.pop(); usedE.pop(); render(); return; }
    const k = idx.get(c + '-' + v);
    if (k == null || usedE.includes(k)) return;
    usedE.push(k); path.push(v); api.move(); render();
    if (usedE.length === P.edges.length) { svg.classList.add('done'); api.win(); return; }
    const free = P.edges.some(([a, b], j) => !usedE.includes(j) && (a === v || b === v));
    toast.innerHTML = free ? '&nbsp;' : 'Stuck — <b>undo</b> a few lines or start over';
  };
  let drawing = null;
  svg.addEventListener('pointerdown', (e) => {
    if (api.done) return; e.preventDefault();
    const v = nodeAt(e, 0.48);
    if (v == null) return;
    api.start();
    if (!path.length) { path = [v]; render(); }
    else if (v !== cur()) { toast.innerHTML = 'Carry on from the <b>white dot</b> — or start over'; return; }
    drawing = e.pointerId;
    try { svg.setPointerCapture(e.pointerId); } catch (_) {}
  });
  svg.addEventListener('pointermove', (e) => { if (drawing !== e.pointerId || api.done) return; const v = nodeAt(e, 0.36); if (v != null) stepTo(v); });
  const up = () => { drawing = null; if (path.length === 1 && !usedE.length) { path = []; render(); } };
  svg.addEventListener('pointerup', up); svg.addEventListener('pointercancel', up);
  stage.append(svg, toast);
  render();
  api.hint(() => {
    const E = P.edges, total = E.length;
    const dfs = (v, used, budget) => { if (used.size === total) return []; for (let j = 0; j < total; j++) { if (used.has(j)) continue; const [a, b2] = E[j]; if (a !== v && b2 !== v) continue; if (--budget.n < 0) return null; used.add(j); const r = dfs(a === v ? b2 : a, used, budget); used.delete(j); if (r) return [a === v ? b2 : a, ...r]; } return null; };
    // keep as much of the player's line as can still be finished, then add one more line
    for (let k = usedE.length; k >= 0; k--) {
      const from = k === 0 ? (path.length ? path[0] : null) : path[k];
      if (from == null) continue;
      const rest = dfs(from, new Set(usedE.slice(0, k)), { n: 60000 });
      if (rest && rest.length) {
        const undone = usedE.length - k;
        path = path.slice(0, k + 1); usedE = usedE.slice(0, k);
        usedE.push(idx.get(from + '-' + rest[0])); path.push(rest[0]); api.move();
        toast.innerHTML = undone ? `Took back ${undone} line${undone > 1 ? 's' : ''} that led to a dead end` : '&nbsp;'; render();
        if (usedE.length === total) { svg.classList.add('done'); api.win(); }
        return;
      }
    }
    const tr = P.trail; path = [tr[0], tr[1]]; usedE = [idx.get(tr[0] + '-' + tr[1])]; toast.innerHTML = 'Start here — this way works'; render();
  });
  api.persist(() => ({ path, usedE }), (d) => { path = d.path; usedE = d.usedE; render(); });
  api.solution(() => {
    const tr = P.trail; path = [tr[0]]; usedE = []; toast.innerHTML = 'Start at the white dot and follow the line'; render();
    tr.slice(1).forEach((v, k) => setTimeout(() => { usedE.push(idx.get(path[path.length - 1] + '-' + v)); path.push(v); render(); if (k === tr.length - 2) svg.classList.add('done'); }, 500 + k * 220));
  });
  api.btn('↶  Undo', () => { if (api.done || !usedE.length) return; usedE.pop(); path.pop(); if (path.length === 1) path = []; toast.innerHTML = '&nbsp;'; render(); });
  api.btn('↺  Start over', () => { if (api.done) return; path = []; usedE = []; toast.innerHTML = '&nbsp;'; render(); });
}

// ====================== TANGO ======================
const SUN = '<svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="11" fill="#FFB86B"/><circle cx="20" cy="20" r="15" fill="none" stroke="#FFB86B" stroke-width="2" stroke-dasharray="3 4.85" opacity=".7"/></svg>';
const MOON = '<svg viewBox="0 0 40 40"><path d="M25 7.5a13 13 0 1 0 8 22.5A11 11 0 0 1 25 7.5Z" fill="#8FB8F0"/></svg>';
function mountTG(stage, controls, P, api) {
  const n = P.n;
  let g = P.givens.slice();
  const hist = [];
  const wrap = $('div', 'tg-wrap');
  const grid = $('div', 'tg-grid');
  grid.style.gridTemplateColumns = grid.style.gridTemplateRows = `repeat(${n},minmax(0,1fr))`;
  const els = g.map((v, i) => {
    const b = $('button', 'tg-c' + (P.givens[i] >= 0 ? ' given' : ''));
    b.onclick = () => {
      if (api.done || P.givens[i] >= 0) return;
      hist.push(g.slice());
      g[i] = g[i] === -1 ? 0 : g[i] === 0 ? 1 : -1;
      api.move(); paint();
    };
    grid.appendChild(b); return b;
  });
  wrap.appendChild(grid);
  const signEls = P.signs.map(([a, b, ty]) => {
    const ra = Math.floor(a / n), ca = a % n, horiz = b === a + 1;
    const el = $('div', 'tg-sign', ty === '=' ? '=' : '×');
    el.style.left = ((horiz ? ca + 1 : ca + 0.5) / n * 100) + '%';
    el.style.top = ((horiz ? ra + 0.5 : ra + 1) / n * 100) + '%';
    wrap.appendChild(el); return el;
  });
  function paint() {
    const { bad, full } = Core.tangoCheck(n, g);
    P.signs.forEach(([a, b, ty], k) => {
      const broken = g[a] >= 0 && g[b] >= 0 && (ty === '=' ? g[a] !== g[b] : g[a] === g[b]);
      signEls[k].classList.toggle('bad', broken);
      if (broken) { bad.add(a); bad.add(b); }
    });
    els.forEach((el, i) => { el.innerHTML = g[i] === 0 ? SUN : g[i] === 1 ? MOON : ''; el.classList.toggle('bad', bad.has(i)); });
    api.setExtra('Filled', `${g.filter((v) => v >= 0).length}<i>/ ${n * n}</i>`);
    if (full && !bad.size) api.win();
  }
  stage.appendChild(wrap);
  paint();
  api.hint(() => { for (let i = 0; i < g.length; i++) if (g[i] !== P.solution[i]) { hist.push(g.slice()); g[i] = P.solution[i]; paint(); hintFx(els[i]); return; } return false; });
  api.persist(() => ({ g, hist }), (d) => { g = d.g; hist.splice(0, hist.length, ...d.hist); paint(); });
  api.solution(() => { g = P.solution.slice(); paint(); });
  api.btn('↶  Undo', () => { if (api.done || !hist.length) return; g = hist.pop(); paint(); });
  api.btn('Clear', () => { if (api.done) return; hist.push(g.slice()); g = P.givens.slice(); paint(); });
}

// ====================== ZIP ======================
function mountZP(stage, controls, P, api) {
  const n = P.n, numAt = new Map(P.numbers), K = P.count;
  const first = P.numbers.find(([, k]) => k === 1)[0], last = P.numbers.find(([, k]) => k === K)[0];
  let path = [];
  const NS = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(NS, 'svg');
  svg.setAttribute('viewBox', `0 0 ${n} ${n}`); svg.setAttribute('class', 'zp-svg');
  const adj = (a, b) => Math.abs(Math.floor(a / n) - Math.floor(b / n)) + Math.abs((a % n) - (b % n)) === 1;
  const cxy = (i) => [(i % n) + 0.5, Math.floor(i / n) + 0.5];
  const reached = () => path.reduce((m, c) => (numAt.has(c) ? Math.max(m, numAt.get(c)) : m), 0);
  function render() {
    let h = '';
    for (let i = 0; i < n * n; i++) if (path.includes(i)) h += `<rect x="${i % n}" y="${Math.floor(i / n)}" width="1" height="1" fill="var(--zp)" opacity=".14"/>`;
    for (let k = 1; k < n; k++) h += `<path d="M${k} 0V${n}M0 ${k}H${n}" stroke="#232838" stroke-width="0.03"/>`;
    if (path.length > 1) h += `<polyline points="${path.map((i) => cxy(i).join(',')).join(' ')}" fill="none" stroke="var(--zp)" stroke-width="0.42" stroke-linecap="round" stroke-linejoin="round"/>`;
    else if (path.length === 1) { const [x, y] = cxy(path[0]); h += `<circle cx="${x}" cy="${y}" r="0.21" fill="var(--zp)"/>`; }
    for (const [c, k] of P.numbers) { const [x, y] = cxy(c); const hit = path.includes(c);
      h += `<circle cx="${x}" cy="${y}" r="0.34" fill="${hit ? '#fff' : '#0B0D12'}" stroke="${hit ? '#fff' : '#3A4152'}" stroke-width="0.05"/><text x="${x}" y="${y + 0.13}" font-size="0.36" font-weight="800" text-anchor="middle" fill="${hit ? '#0B0D12' : '#fff'}" font-family="ui-rounded,system-ui">${k}</text>`; }
    svg.innerHTML = h;
    api.setExtra('Cells', `${path.length}<i>/ ${n * n}</i>`);
  }
  const cellAt = (e) => { const r = svg.getBoundingClientRect(); const c = Math.floor((e.clientX - r.left) / r.width * n), rr = Math.floor((e.clientY - r.top) / r.height * n); return c < 0 || rr < 0 || c >= n || rr >= n ? null : rr * n + c; };
  const extend = (c) => {
    const lastC = path[path.length - 1];
    if (c === lastC) return;
    const idx = path.indexOf(c);
    if (idx >= 0) { path = path.slice(0, idx + 1); render(); return; }
    if (!adj(lastC, c)) return;
    if (numAt.has(c) && numAt.get(c) !== reached() + 1) return;
    if (lastC === last && reached() === K) return;
    path.push(c); render();
  };
  let drawing = null;
  svg.addEventListener('pointerdown', (e) => {
    if (api.done) return; e.preventDefault();
    const c = cellAt(e); if (c == null) return;
    api.start();
    if (!path.length) { if (c !== first) return; path = [c]; }
    else if (path.includes(c)) path = path.slice(0, path.indexOf(c) + 1);
    else if (adj(path[path.length - 1], c)) extend(c);
    else return;
    drawing = e.pointerId; render();
    try { svg.setPointerCapture(e.pointerId); } catch (_) {}
  });
  svg.addEventListener('pointermove', (e) => { if (drawing !== e.pointerId) return; const c = cellAt(e); if (c != null) extend(c); });
  const up = () => { if (drawing == null) return; drawing = null; api.move(); if (path.length === n * n && path[path.length - 1] === last && reached() === K) { svg.classList.add('done'); api.win(); } };
  svg.addEventListener('pointerup', up); svg.addEventListener('pointercancel', up);
  stage.appendChild(svg);
  render();
  api.hint(() => {
    const S0 = P.solution; let k = 0; while (k < path.length && path[k] === S0[k]) k++;
    if (k >= S0.length) return false;
    let j = k; while (j < S0.length - 1 && !numAt.has(S0[j])) j++; // run on to the next numbered cell
    path = S0.slice(0, Math.max(j, k) + 1); render(); api.move();
    if (path.length === n * n && reached() === K) { svg.classList.add('done'); api.win(); }
  });
  api.persist(() => ({ path }), (d) => { path = d.path; render(); });
  api.solution(() => {
    path = [P.solution[0]]; render();
    P.solution.slice(1).forEach((c, k) => setTimeout(() => { path.push(c); render(); if (k === P.solution.length - 2) svg.classList.add('done'); }, 400 + k * 45));
  });
  api.btn('↺  Start over', () => { if (api.done) return; path = []; render(); });
}

// ====================== BRIDGES ======================
function mountHB(stage, controls, P, api) {
  const n = P.n, isl = P.islands, nb = Core.bridgeNeighbours(n, isl);
  const br = new Map();
  const key = (a, b) => (a < b ? a + '-' + b : b + '-' + a);
  let sel = null;
  const hist = [];
  const NS = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(NS, 'svg');
  svg.setAttribute('viewBox', `-0.5 -0.5 ${n} ${n}`); svg.setAttribute('class', 'hb-svg');
  const toast = $('div', 'toast', '&nbsp;');
  const sums = () => { const s = isl.map(() => 0); for (const [k, v] of br) { const [a, b] = k.split('-').map(Number); s[a] += v; s[b] += v; } return s; };
  function render() {
    const s = sums();
    let h = '';
    for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) h += `<circle cx="${x}" cy="${y}" r="0.035" fill="#262B39"/>`;
    for (const [k, v] of br) {
      if (!v) continue;
      const [a, b] = k.split('-').map(Number), [x1, y1] = isl[a], [x2, y2] = isl[b];
      const horiz = y1 === y2, off = v === 2 ? [-0.1, 0.1] : [0];
      for (const o of off) h += `<line x1="${x1 + (horiz ? 0 : o)}" y1="${y1 + (horiz ? o : 0)}" x2="${x2 + (horiz ? 0 : o)}" y2="${y2 + (horiz ? o : 0)}" stroke="var(--hb)" stroke-width="${v === 2 ? 0.07 : 0.09}" stroke-linecap="round"/>`;
    }
    isl.forEach(([x, y], i) => {
      const done = s[i] === P.need[i], over = s[i] > P.need[i];
      h += `<circle cx="${x}" cy="${y}" r="0.38" fill="${done ? 'var(--hb)' : '#1A1E29'}" stroke="${over ? '#FF6B6B' : sel === i ? '#fff' : done ? 'var(--hb)' : '#4A5165'}" stroke-width="${sel === i ? 0.09 : 0.06}"/>`;
      h += `<text x="${x}" y="${y + 0.14}" font-size="0.4" font-weight="800" text-anchor="middle" fill="${done ? '#1B140C' : over ? '#FF6B6B' : '#ECEEF3'}" font-family="ui-rounded,system-ui">${P.need[i]}</text>`;
    });
    svg.innerHTML = h;
    api.setExtra('Islands', `${s.filter((v, i) => v === P.need[i]).length}<i>/ ${isl.length}</i>`);
  }
  const islandAt = (e) => {
    const r = svg.getBoundingClientRect(), ux = (e.clientX - r.left) / r.width * n - 0.5, uy = (e.clientY - r.top) / r.height * n - 0.5;
    let best = null, bd = 0.55; isl.forEach(([x, y], i) => { const d = Math.hypot(x - ux, y - uy); if (d < bd) { bd = d; best = i; } });
    return { i: best, ux, uy };
  };
  const solved = () => {
    const s = sums(); if (s.some((v, i) => v !== P.need[i])) return false;
    const seen = new Set([0]), st = [0];
    while (st.length) { const a = st.pop(); for (const b of nb[a]) if (b >= 0 && (br.get(key(a, b)) || 0) > 0 && !seen.has(b)) { seen.add(b); st.push(b); } }
    return seen.size === isl.length;
  };
  const cycle = (a, b) => {
    const k = key(a, b), cur = br.get(k) || 0, next = (cur + 1) % 3;
    if (cur === 0) for (const [k2, v] of br) { if (!v) continue; const [c, d] = k2.split('-').map(Number); if (Core.bridgesCross(n, isl, a, b, c, d)) { toast.textContent = 'Bridges can’t cross'; svg.classList.remove('shake'); void svg.offsetWidth; svg.classList.add('shake'); return; } }
    hist.push(new Map(br));
    br.set(k, next); toast.innerHTML = '&nbsp;'; api.move(); render();
    if (solved()) { svg.classList.add('done'); api.win(); }
  };
  let down = null;
  svg.addEventListener('pointerdown', (e) => { if (api.done) return; e.preventDefault(); const h = islandAt(e); if (h.i == null) { sel = null; render(); return; } api.start(); down = { i: h.i, ux: h.ux, uy: h.uy, id: e.pointerId }; try { svg.setPointerCapture(e.pointerId); } catch (_) {} });
  svg.addEventListener('pointerup', (e) => {
    if (!down) return; const d = down; down = null;
    const h = islandAt(e), dx = h.ux - d.ux, dy = h.uy - d.uy;
    if (Math.hypot(dx, dy) > 0.45) { // drag from an island toward a neighbour
      const dir = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 1 : 3) : (dy > 0 ? 2 : 0);
      const b = nb[d.i][dir]; sel = null;
      if (b >= 0) cycle(d.i, b); else render();

    }

    if (nb[sel].includes(d.i)) { const a = sel; sel = null; cycle(a, d.i); } else { sel = d.i; render(); }
  });
  svg.addEventListener('pointercancel', () => (down = null));
  stage.append(svg, toast);
  render();
  api.hint(() => {
    const fin = () => { sel = null; render(); if (solved()) { svg.classList.add('done'); api.win(); } };
    for (const [k, v] of [...br]) if (v > 0 && !P.solution.some(([x]) => x === k)) { hist.push(new Map(br)); br.delete(k); fin(); return; } // wrong bridges go first, so nothing crosses
    for (const [k, v] of P.solution) if ((br.get(k) || 0) !== v) { hist.push(new Map(br)); br.set(k, v); fin(); return; }
    return false;
  });
  api.persist(() => ({ br: [...br], hist: hist.map((m) => [...m]) }), (d) => { br.clear(); d.br.forEach(([k, v]) => br.set(k, v)); hist.splice(0, hist.length, ...d.hist.map((e) => new Map(e))); sel = null; render(); });
  api.solution(() => { br.clear(); for (const [k, v] of P.solution) br.set(k, v); sel = null; render(); svg.classList.add('done'); });
  api.btn('↶  Undo', () => { if (api.done || !hist.length) return; const m = hist.pop(); br.clear(); m.forEach((v, k) => br.set(k, v)); render(); });
  api.btn('Clear', () => { if (api.done) return; hist.push(new Map(br)); br.clear(); render(); });
}

// ====================== NONOGRAM ======================
function mountNG(stage, controls, P, api) {
  const { W, H } = P;
  let g = new Array(W * H).fill(0); // 0 empty, 1 filled, 2 crossed
  const hist = [];
  let tool = 'fill', zoom = false;
  const maxR = Math.max(...P.rows.map((r) => Math.max(1, r.length))), maxC = Math.max(...P.cols.map((c) => Math.max(1, c.length)));
  const avail = Math.min(window.innerWidth - 24, 440);
  const view = $('div', 'ng-view');
  const wrap = $('div', 'ng');
  view.appendChild(wrap);
  const corner = $('div', 'ng-corner'); wrap.appendChild(corner);
  const colEls = P.cols.map((c, x) => { const e = $('div', 'ng-cc' + (x % 5 === 4 && x < W - 1 ? ' b5' : ''), (c.length ? c : [0]).map((v) => `<span>${v}</span>`).join('')); wrap.appendChild(e); return e; });
  const rowEls = [], cells = [];
  for (let y = 0; y < H; y++) {
    const rc = $('div', 'ng-rc', (P.rows[y].length ? P.rows[y] : [0]).map((v) => `<span>${v}</span>`).join('')); wrap.appendChild(rc); rowEls.push(rc);
    for (let x = 0; x < W; x++) { const c = $('div', 'ng-c' + (x % 5 === 4 && x < W - 1 ? ' br' : '') + (y % 5 === 4 && y < H - 1 ? ' bb' : '')); c.dataset.i = y * W + x; wrap.appendChild(c); cells.push(c); }
  }
  // sizes: fit the whole board on screen; "Zoom" doubles small cells and lets you pan
  let fitCs = 0;
  function layout() {

function blMini(rows, cs = 22) { // tokens: [g carpet|j jam|i glass|x blast][0-5 piece|r v rockets|b bomb|p plane|d disco|t toy|B cushion|K chest|.][* moved|c chain|u bubble]
  const g = rows.map((r) => r.trim().split(/\s+/)), H = g.length, W = g[0].length;
  const el = $('div', 'bl-mb'); el.style.cssText = `width:${W * cs}px;height:${H * cs}px`;
  let h = '';
  g.forEach((row, r) => row.forEach((tok, c) => {
    const m = /^([gjix]*)([0-5rvbpdtBK.])([*cu]*)$/.exec(tok); if (!m) return;
    const [, pre, main, suf] = m, x = c * cs, y = r * cs;
    h += `<i class="t${pre.includes('g') ? ' g' : ''}" style="left:${x}px;top:${y}px;width:${cs}px;height:${cs}px"></i>`;
    if (pre.includes('j')) h += `<i style="left:${x}px;top:${y}px;width:${cs}px;height:${cs}px">${BL_JAM}</i>`;
    if (pre.includes('i')) h += `<i class="ic" style="left:${x + 1}px;top:${y + 1}px;width:${cs - 2}px;height:${cs - 2}px"></i>`;
    const art = main === '.' ? '' : main === 'B' ? blBox(1) : main === 'K' ? BL_CHEST_ICON : main === 't' ? blArt(-2) : /[0-5]/.test(main) ? blArt(+main) : blArt(0, { r: 'rh', v: 'rv', b: 'bomb', p: 'plane', d: 'rain' }[main]);
    if (art) h += `<i class="p${suf.includes('*') ? ' mv' : ''}" style="left:${x}px;top:${y}px;width:${cs}px;height:${cs}px">${art}</i>`;
    if (suf.includes('c')) h += `<i style="left:${x}px;top:${y}px;width:${cs}px;height:${cs}px">${blChain(1)}</i>`;
    if (suf.includes('u')) h += `<i style="left:${x}px;top:${y}px;width:${cs}px;height:${cs}px">${BL_BUBBLE}</i>`;
    if (pre.includes('x')) h += `<i class="x" style="left:${x}px;top:${y}px;width:${cs}px;height:${cs}px"></i>`;
  }));
  el.innerHTML = h; return el;
}
