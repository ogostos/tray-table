    for (let k = 1; k < n; k++) h += `<path d="M${k} 0V${n}M0 ${k}H${n}" stroke="#232838" stroke-width="0.03"/>`;
    if (path.length > 1) h += `<polyline points="${path.map((i) => cxy(i).join(',')).join(' ')}" fill="none" stroke="var(--zp)" stroke-width="0.42" stroke-linecap="round" stroke-linejoin="round"/>`;
    else if (path.length === 1) { const [x, y] = cxy(path[0]); h += `<circle cx="${x}" cy="${y}" r="0.21" fill="var(--zp)"/>`; }
    for (const [c, k] of P.numbers) { const [x, y] = cxy(c); const hit = path.includes(c);
      h += `<circle cx="${x}" cy="${y}" r="0.34" fill="${hit ? '#fff' : '#0B0D12'}" stroke="${hit ? '#fff' : '#3A4152'}" stroke-width="0.05"/><text x="${x}" y="${y + 0.13}" font-size="0.36" font-weight="800" text-anchor="middle" fill="${hit ? '#0B0D12' : '#fff'}" font-family="ui-rounded,system-ui">${k}</text>`; }
    svg.innerHTML = h;
    api.setExtra('Cells', `${path.length}<i>/ ${n * n}</i>`);
  }
  const cellAt = (e) => { const r = svg.getBoundingClientRect(); const c = Math.floor((e.clientX - r.left) / r.width * n), rr = Math.floor((e.clientY - r.top) / r.height * n); return c < 0 || rr < 0 || c >= n || rr >= n ? null : rr * n + c; };
  const extend = (c) => {
    const lastC = path[path.length - 1];
    if (c === lastC) return;
    const idx = path.indexOf(c);
    if (idx >= 0) { path = path.slice(0, idx + 1); render(); return; }
    if (!adj(lastC, c)) return;
    if (numAt.has(c) && numAt.get(c) !== reached() + 1) return;
    if (lastC === last && reached() === K) return;
    path.push(c); render();
  };
  let drawing = null;
  svg.addEventListener('pointerdown', (e) => {
    if (api.done) return; e.preventDefault();
    const c = cellAt(e); if (c == null) return;
    api.start();
    if (!path.length) { if (c !== first) return; path = [c]; }
    else if (path.includes(c)) path = path.slice(0, path.indexOf(c) + 1);
    else if (adj(path[path.length - 1], c)) extend(c);
    else return;
    drawing = e.pointerId; render();
    try { svg.setPointerCapture(e.pointerId); } catch (_) {}
  });
  svg.addEventListener('pointermove', (e) => { if (drawing !== e.pointerId) return; const c = cellAt(e); if (c != null) extend(c); });
  const up = () => { if (drawing == null) return; drawing = null; api.move(); if (path.length === n * n && path[path.length - 1] === last && reached() === K) { svg.classList.add('done'); api.win(); } };
  svg.addEventListener('pointerup', up); svg.addEventListener('pointercancel', up);
  stage.appendChild(svg);
  render();
  api.solution(() => {
    path = [P.solution[0]]; render();
    P.solution.slice(1).forEach((c, k) => setTimeout(() => { path.push(c); render(); if (k === P.solution.length - 2) svg.classList.add('done'); }, 400 + k * 45));
  });
  api.btn('↺  Start over', () => { if (api.done) return; path = []; render(); });
}

// ====================== BRIDGES ======================
function mountHB(stage, controls, P, api) {
  const n = P.n, isl = P.islands, nb = Core.bridgeNeighbours(n, isl);
  const br = new Map();
  const key = (a, b) => (a < b ? a + '-' + b : b + '-' + a);
  let sel = null;
  const hist = [];
  const NS = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(NS, 'svg');
  svg.setAttribute('viewBox', `-0.5 -0.5 ${n} ${n}`); svg.setAttribute('class', 'hb-svg');
  const toast = $('div', 'toast', '&nbsp;');
  const sums = () => { const s = isl.map(() => 0); for (const [k, v] of br) { const [a, b] = k.split('-').map(Number); s[a] += v; s[b] += v; } return s; };
  function render() {
    const s = sums();
    let h = '';
    for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) h += `<circle cx="${x}" cy="${y}" r="0.035" fill="#262B39"/>`;
    for (const [k, v] of br) {
      if (!v) continue;
      const [a, b] = k.split('-').map(Number), [x1, y1] = isl[a], [x2, y2] = isl[b];
      const horiz = y1 === y2, off = v === 2 ? [-0.1, 0.1] : [0];
      for (const o of off) h += `<line x1="${x1 + (horiz ? 0 : o)}" y1="${y1 + (horiz ? o : 0)}" x2="${x2 + (horiz ? 0 : o)}" y2="${y2 + (horiz ? o : 0)}" stroke="var(--hb)" stroke-width="${v === 2 ? 0.07 : 0.09}" stroke-linecap="round"/>`;
    }
    isl.forEach(([x, y], i) => {
      const done = s[i] === P.need[i], over = s[i] > P.need[i];
      h += `<circle cx="${x}" cy="${y}" r="0.38" fill="${done ? 'var(--hb)' : '#1A1E29'}" stroke="${over ? '#FF6B6B' : sel === i ? '#fff' : done ? 'var(--hb)' : '#4A5165'}" stroke-width="${sel === i ? 0.09 : 0.06}"/>`;
      h += `<text x="${x}" y="${y + 0.14}" font-size="0.4" font-weight="800" text-anchor="middle" fill="${done ? '#1B140C' : over ? '#FF6B6B' : '#ECEEF3'}" font-family="ui-rounded,system-ui">${P.need[i]}</text>`;
    });
    svg.innerHTML = h;
    api.setExtra('Islands', `${s.filter((v, i) => v === P.need[i]).length}<i>/ ${isl.length}</i>`);
  }
  const islandAt = (e) => {
    const r = svg.getBoundingClientRect(), ux = (e.clientX - r.left) / r.width * n - 0.5, uy = (e.clientY - r.top) / r.height * n - 0.5;
    let best = null, bd = 0.55; isl.forEach(([x, y], i) => { const d = Math.hypot(x - ux, y - uy); if (d < bd) { bd = d; best = i; } });
    return { i: best, ux, uy };
  };
  const solved = () => {
    const s = sums(); if (s.some((v, i) => v !== P.need[i])) return false;
    const seen = new Set([0]), st = [0];
    while (st.length) { const a = st.pop(); for (const b of nb[a]) if (b >= 0 && (br.get(key(a, b)) || 0) > 0 && !seen.has(b)) { seen.add(b); st.push(b); } }
    return seen.size === isl.length;
  };
  const cycle = (a, b) => {
    const k = key(a, b), cur = br.get(k) || 0, next = (cur + 1) % 3;
    if (cur === 0) for (const [k2, v] of br) { if (!v) continue; const [c, d] = k2.split('-').map(Number); if (Core.bridgesCross(n, isl, a, b, c, d)) { toast.textContent = 'Bridges can’t cross'; svg.classList.remove('shake'); void svg.offsetWidth; svg.classList.add('shake'); return; } }
    hist.push(new Map(br));
    br.set(k, next); toast.innerHTML = '&nbsp;'; api.move(); render();
    if (solved()) { svg.classList.add('done'); api.win(); }
  };
  let down = null;
  svg.addEventListener('pointerdown', (e) => { if (api.done) return; e.preventDefault(); const h = islandAt(e); if (h.i == null) { sel = null; render(); return; } api.start(); down = { i: h.i, ux: h.ux, uy: h.uy, id: e.pointerId }; try { svg.setPointerCapture(e.pointerId); } catch (_) {} });
  svg.addEventListener('pointerup', (e) => {
    if (!down) return; const d = down; down = null;
    const h = islandAt(e), dx = h.ux - d.ux, dy = h.uy - d.uy;
    if (Math.hypot(dx, dy) > 0.45) { // drag from an island toward a neighbour
      const dir = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 1 : 3) : (dy > 0 ? 2 : 0);
      const b = nb[d.i][dir]; sel = null;
      if (b >= 0) cycle(d.i, b); else render();

    }

    if (nb[sel].includes(d.i)) { const a = sel; sel = null; cycle(a, d.i); } else { sel = d.i; render(); }
  });
  svg.addEventListener('pointercancel', () => (down = null));
  stage.append(svg, toast);
  render();
  api.solution(() => { br.clear(); for (const [k, v] of P.solution) br.set(k, v); sel = null; render(); svg.classList.add('done'); });
  api.btn('↶  Undo', () => { if (api.done || !hist.length) return; const m = hist.pop(); br.clear(); m.forEach((v, k) => br.set(k, v)); render(); });
  api.btn('Clear', () => { if (api.done) return; hist.push(new Map(br)); br.clear(); render(); });

// ====================== NONOGRAM ======================
function mountNG(stage, controls, P, api) {
  const { W, H } = P;
  let g = new Array(W * H).fill(0); // 0 empty, 1 filled, 2 crossed
  const hist = [];
  let tool = 'fill', zoom = false;
  const maxR = Math.max(...P.rows.map((r) => Math.max(1, r.length))), maxC = Math.max(...P.cols.map((c) => Math.max(1, c.length)));
  const avail = Math.min(window.innerWidth - 24, 440);
  const view = $('div', 'ng-view');
  const wrap = $('div', 'ng');
  view.appendChild(wrap);
  const corner = $('div', 'ng-corner'); wrap.appendChild(corner);
  const colEls = P.cols.map((c, x) => { const e = $('div', 'ng-cc' + (x % 5 === 4 && x < W - 1 ? ' b5' : ''), (c.length ? c : [0]).map((v) => `<span>${v}</span>`).join('')); wrap.appendChild(e); return e; });
  const rowEls = [], cells = [];
  for (let y = 0; y < H; y++) {
    const rc = $('div', 'ng-rc', (P.rows[y].length ? P.rows[y] : [0]).map((v) => `<span>${v}</span>`).join('')); wrap.appendChild(rc); rowEls.push(rc);
    for (let x = 0; x < W; x++) { const c = $('div', 'ng-c' + (x % 5 === 4 && x < W - 1 ? ' br' : '') + (y % 5 === 4 && y < H - 1 ? ' bb' : '')); c.dataset.i = y * W + x; wrap.appendChild(c); cells.push(c); }
  }
  // sizes: fit the whole board on screen; "Zoom" doubles small cells and lets you pan
  let fitCs = 0;
  function layout() {
    const f = (cs) => (cs < 17 ? 10 : cs < 24 ? 11 : 12);
    let cs = 46;
    for (; cs > 8; cs--) { const fs = f(cs), clueW = maxR * (fs + 5) + 6; if (clueW + cs * W <= avail) break; }
    fitCs = cs;
    const use = zoom ? Math.max(30, cs) : cs, fs = f(use), clueW = maxR * (fs + 5) + 6, clueH = maxC * (fs + 3) + 8;
    wrap.style.gridTemplateColumns = `${clueW}px repeat(${W}, ${use}px)`;
    wrap.style.gridTemplateRows = `${clueH}px repeat(${H}, ${use}px)`;
    wrap.style.setProperty('--cs', use + 'px'); wrap.style.setProperty('--fs', fs + 'px');
    view.style.maxWidth = avail + 'px';
    view.classList.toggle('zoomed', zoom);

  const eq = (a, b) => a.length === b.length && a.every((v, i) => v === b[i]);
  function paint() {
    cells.forEach((c, i) => { c.classList.toggle('f', g[i] === 1); c.classList.toggle('x', g[i] === 2); });
    let ok = 0;
    for (let y = 0; y < H; y++) { const done = eq(Core.lineClue(g.slice(y * W, y * W + W).map((v) => (v === 1 ? 1 : 0))), P.rows[y]); rowEls[y].classList.toggle('ok', done); if (done) ok++; }
    for (let x = 0; x < W; x++) { const col = []; for (let y = 0; y < H; y++) col.push(g[y * W + x] === 1 ? 1 : 0); const done = eq(Core.lineClue(col), P.cols[x]); colEls[x].classList.toggle('ok', done); if (done) ok++; }
    api.setExtra('Lines', `${ok}<i>/ ${W + H}</i>`);
    if (ok === W + H) { wrap.classList.add('done'); api.win(); }
  }
  let down = null;
  const cellAt = (e) => { const t = document.elementFromPoint(e.clientX, e.clientY); return t && t.classList.contains('ng-c') && wrap.contains(t) ? +t.dataset.i : null; };
  wrap.onpointerdown = (e) => {
    if (api.done || tool === 'move') return; const i = cellAt(e); if (i == null) return; e.preventDefault(); api.start();
    hist.push(g.slice());
    const want = tool === 'fill' ? 1 : 2;
    down = { v: g[i] === want ? 0 : want, id: e.pointerId };
    g[i] = down.v; paint();
    try { wrap.setPointerCapture(e.pointerId); } catch (_) {}
  };
  wrap.onpointermove = (e) => { if (!down || e.pointerId !== down.id) return; const i = cellAt(e); if (i == null || g[i] === down.v) return; if (down.v !== 0 && g[i] !== 0) return; g[i] = down.v; paint(); };
  const up = () => { if (down) { down = null; api.move(); } };
  wrap.onpointerup = up; wrap.onpointercancel = up;
  const tools = $('div', 'qn-tools');
  const tF = $('button', 'on', '■ Fill'), tX = $('button', '', '× Cross'), tMove = $('button', '', '✋ Move'), zoomBtn = $('button', 'auto', '🔍 Zoom');
  function setTool(t) { tool = t; tF.classList.toggle('on', t === 'fill'); tX.classList.toggle('on', t === 'x'); tMove.classList.toggle('on', t === 'move'); view.classList.toggle('panning', t === 'move'); }
  tF.onclick = () => setTool('fill'); tX.onclick = () => setTool('x'); tMove.onclick = () => setTool('move');
  zoomBtn.onclick = () => { zoom = !zoom; zoomBtn.classList.toggle('on', zoom); layout(); if (zoom) setTool('move'); };
  tools.append(tF, tX, tMove, zoomBtn);
  tools.style.width = `min(100%, ${avail}px)`;
  stage.append(view, tools);
  layout(); paint();
  api.solution(() => { g = P.solution.map((v) => (v ? 1 : 0)); paint(); wrap.classList.add('done'); });
  api.btn('↶  Undo', () => { if (api.done || !hist.length) return; g = hist.pop(); paint(); });
  api.btn('Clear', () => { if (api.done) return; hist.push(g.slice()); g.fill(0); paint(); });
}

// ====================== SHIKAKU ======================
const SKC = ['#FF8A65', '#5EB1FF', '#3DDC84', '#FFC247', '#B794FF', '#FF6FB5', '#2EC4F1', '#A6E35B', '#F2B179', '#9EE7FF', '#E58CFF', '#FFE14D'];
function mountSK(stage, controls, P, api) {
  const { W, H } = P;
  const clueAt = new Map(P.clues);
  let rects = []; // {x,y,w,h,col}
  const hist = [];
  let colorN = 0;
  const board = $('div', 'sk-board');
  board.style.aspectRatio = `${W} / ${H}`;
  board.style.width = `min(100%, ${Math.round(440 * W / H)}px)`;
  board.style.backgroundSize = `calc(100% / ${W}) calc(100% / ${H})`;
  const layer = $('div', 'sk-layer'), labels = $('div', 'sk-layer');
  board.append(layer, labels);
  for (const [c, a] of P.clues) { const l = $('div', 'sk-num', a); l.style.left = ((c % W) + 0.5) / W * 100 + '%'; l.style.top = (Math.floor(c / W) + 0.5) / H * 100 + '%'; labels.appendChild(l); }
  const preview = $('div', 'sk-rect preview'); preview.style.display = 'none'; board.appendChild(preview);
  const place = (el, r) => { el.style.left = r.x / W * 100 + '%'; el.style.top = r.y / H * 100 + '%'; el.style.width = r.w / W * 100 + '%'; el.style.height = r.h / H * 100 + '%'; };
  const cluesIn = (r) => P.clues.filter(([c]) => { const x = c % W, y = Math.floor(c / W); return x >= r.x && x < r.x + r.w && y >= r.y && y < r.y + r.h; });
  const valid = (r) => { const cl = cluesIn(r); return cl.length === 1 && cl[0][1] === r.w * r.h; };
  const overlap = (a, b) => a.x < b.x + b.w && b.x < a.x + a.w && a.y < b.y + b.h && b.y < a.y + a.h;
  function render() {
    layer.innerHTML = '';
    for (const r of rects) { const el = $('div', 'sk-rect' + (valid(r) ? '' : ' bad')); el.style.setProperty('--rc', r.col); place(el, r); layer.appendChild(el); }
    const covered = rects.reduce((a, r) => a + r.w * r.h, 0);
    api.setExtra('Covered', `${Math.round(covered / (W * H) * 100)}<i>%</i>`);
    if (covered === W * H && rects.every(valid)) { board.classList.add('done'); api.win(); }
  }
  const cellAt = (e) => { const b = board.getBoundingClientRect(); return [Math.max(0, Math.min(W - 1, Math.floor((e.clientX - b.left) / b.width * W))), Math.max(0, Math.min(H - 1, Math.floor((e.clientY - b.top) / b.height * H)))]; };
  let down = null;
  const box = (a, b) => ({ x: Math.min(a[0], b[0]), y: Math.min(a[1], b[1]), w: Math.abs(a[0] - b[0]) + 1, h: Math.abs(a[1] - b[1]) + 1 });
  board.onpointerdown = (e) => { if (api.done) return; e.preventDefault(); api.start(); down = { a: cellAt(e), b: cellAt(e), id: e.pointerId, moved: false }; try { board.setPointerCapture(e.pointerId); } catch (_) {} };
  board.onpointermove = (e) => {
    if (!down || e.pointerId !== down.id) return;
    const b = cellAt(e); if (b[0] === down.b[0] && b[1] === down.b[1]) return;
    down.b = b; down.moved = true; preview.style.display = 'block'; place(preview, box(down.a, b));
  };
  const up = () => {
    if (!down) return; const d = down; down = null; preview.style.display = 'none';
    const r = box(d.a, d.b);
    hist.push(rects.map((x) => ({ ...x })));
    if (!d.moved) { // tap: remove the rectangle under the finger, or make a 1×1 on a "1"
      const hit = rects.findIndex((q) => overlap(q, r));
      if (hit >= 0) rects.splice(hit, 1);
      else if (clueAt.get(r.y * W + r.x) === 1) rects.push({ ...r, col: SKC[colorN++ % SKC.length] });
      else { hist.pop(); return; }
    } else {
      rects = rects.filter((q) => !overlap(q, r));
      const cl = cluesIn(r);
      rects.push({ ...r, col: SKC[(cl.length ? P.clues.indexOf(cl[0]) : colorN++) % SKC.length] });
    }
    api.move(); render();
  };
  board.onpointerup = up; board.onpointercancel = up;
  stage.appendChild(board);
  render();
  api.solution(() => { rects = P.solution.map(([x, y, w, h], i) => ({ x, y, w, h, col: SKC[i % SKC.length] })); render(); board.classList.add('done'); });
  api.btn('↶  Undo', () => { if (api.done || !hist.length) return; rects = hist.pop(); render(); });
  api.btn('Clear', () => { if (api.done) return; hist.push(rects.map((x) => ({ ...x }))); rects = []; render(); });
}

// ====================== MINESWEEPER ======================
const MSC = ['', '#5EB1FF', '#3DDC84', '#FF6B6B', '#B794FF', '#FFB020', '#2EC4F1', '#ECEEF3', '#8C93A6'];
function mountMS(stage, controls, P, api) {
  const { W, H, M } = P, N = W * H;
  const open = new Uint8Array(N), flag = new Uint8Array(N);
  let tool = 'dig', boom = -1;
  const reveal = (i) => { const st = [i]; while (st.length) { const c = st.pop(); if (open[c] || flag[c] || P.mines[c]) continue; open[c] = 1; if (!P.counts[c]) for (const nb of Core.msNeighbours(W, H, c)) if (!open[nb]) st.push(nb); } };
  reveal(P.start);
  const avail = Math.min(window.innerWidth - 32, 420), cs = Math.floor(avail / W);
  const grid = $('div', 'ms-grid');
  grid.style.gridTemplateColumns = `repeat(${W}, ${cs}px)`; grid.style.setProperty('--cs', cs + 'px');
  const els = [];
  for (let i = 0; i < N; i++) { const b = $('div', 'ms-c'); b.dataset.i = i; grid.appendChild(b); els.push(b); }
  function paint() {
    els.forEach((el, i) => {
      el.className = 'ms-c' + (open[i] ? ' o' : '') + (flag[i] && !open[i] ? ' fl' : '') + (boom >= 0 && P.mines[i] ? ' mine' : '') + (i === boom ? ' boom' : '');
      el.textContent = open[i] && P.counts[i] ? P.counts[i] : '';
      el.style.color = open[i] ? MSC[P.counts[i]] : '';
    });
    api.setExtra('Mines', `${M - flag.reduce((a, b) => a + b, 0)}<i>left</i>`);
  }
  const won = () => { for (let i = 0; i < N; i++) if (!P.mines[i] && !open[i]) return false; return true; };
  const dig = (i) => {
    if (open[i] || flag[i]) return;
    if (P.mines[i]) { boom = i; paint(); grid.classList.add('lost'); setTimeout(() => api.fail('Boom!', 'hit a mine'), 900); return; }
    reveal(i);
  };
  const act = (i, longPress) => {
    if (api.done || boom >= 0) return;
    api.start();
    if (open[i]) { // chord: open the neighbours when the flags around a number are complete
      const nb = Core.msNeighbours(W, H, i);
      if (P.counts[i] && nb.filter((c) => flag[c]).length === P.counts[i]) nb.forEach((c) => { if (boom < 0) dig(c); });
      else return;
    } else if (tool === 'flag' || longPress) flag[i] ^= 1;
    else dig(i);
    api.move(); paint();
    if (boom < 0 && won()) { grid.classList.add('done'); api.win(); }
  };
  let press = null;
  grid.addEventListener('contextmenu', (e) => e.preventDefault());
  grid.onpointerdown = (e) => {
    const t = e.target.closest('.ms-c'); if (!t) return; e.preventDefault();
    const i = +t.dataset.i;
    press = { i, fired: false, timer: setTimeout(() => { press.fired = true; act(i, true); if (navigator.vibrate) navigator.vibrate(15); }, 380) };
  };
  const up = (e) => { if (!press) return; clearTimeout(press.timer); if (!press.fired) act(press.i, false); press = null; };
  grid.onpointerup = up;
  grid.onpointercancel = () => { if (press) clearTimeout(press.timer); press = null; };
  grid.onpointerleave = () => { if (press) clearTimeout(press.timer); press = null; };
  const tools = $('div', 'qn-tools');
  const tD = $('button', 'on', '⛏ &nbsp;Dig'), tF = $('button', '', '⚑ &nbsp;Flag');
  const setTool = (t) => { tool = t; tD.classList.toggle('on', t === 'dig'); tF.classList.toggle('on', t === 'flag'); };
  tD.onclick = () => setTool('dig'); tF.onclick = () => setTool('flag');
  tools.append(tD, tF); tools.style.width = cs * W + 'px';
  stage.append(grid, tools, $('div', 'toast', 'Long-press a cell to flag it · tap a finished number to clear around it'));
  api.solution(() => { for (let i = 0; i < N; i++) { if (P.mines[i]) flag[i] = 1; else open[i] = 1; } paint(); });
  paint();
}

// ====================== 2048 ======================
const G2C = { 2: ['#2A2F3D', '#ECEEF3'], 4: ['#363C4E', '#ECEEF3'], 8: ['#F2B179', '#2A1606'], 16: ['#FF8A3D', '#2A1300'], 32: ['#FF5A5F', '#2B0507'], 64: ['#E8364A', '#FFF'],
  128: ['#FFE14D', '#2B2300'], 256: ['#F5C518', '#2B2000'], 512: ['#3DDC84', '#03261A'], 1024: ['#2EC4F1', '#032330'], 2048: ['#A770FF', '#FFF'] };
function mountG2(stage, controls, P, api) {
  let R, tiles, nid, score, over, reached;
  const els = new Map();
  const board = $('div', 'g2-board');
  const POS = (k) => (3 + k * 24.25) + '%';
  for (let r = 0; r < 4; r++) for (let c = 0; c < 4; c++) { const b = $('div', 'g2-bg'); b.style.left = POS(c); b.style.top = POS(r); board.appendChild(b); }
  const alive = () => tiles.filter((t) => !t.dead);
  function spawn() {
    const empty = [];
    for (let r = 0; r < 4; r++) for (let c = 0; c < 4; c++) if (!alive().some((t) => t.r === r && t.c === c)) empty.push([r, c]);
    if (!empty.length) return;
    const [r, c] = empty[Math.floor(R() * empty.length)];
    tiles.push({ id: nid++, v: R() < 0.9 ? 2 : 4, r, c, isNew: true });
  }
  function render() {
    for (const t of tiles) {
      let el = els.get(t.id);
      if (!el) { el = $('div', 'g2-t num'); els.set(t.id, el); board.appendChild(el); }
      el.style.left = POS(t.c); el.style.top = POS(t.r);
      const col = G2C[t.v] || ['#FF6FB5', '#FFF'];
      el.style.background = col[0]; el.style.color = col[1];
      el.textContent = t.v;
      const d = String(t.v).length;
      el.className = 'g2-t num' + (d >= 3 ? ' d' + Math.min(d, 5) : '') + (t.isNew ? ' new' : '') + (t.merged ? ' merged' : '') + (t.dead ? ' dead' : '');
    }
    const dead = tiles.filter((t) => t.dead);
    if (dead.length) setTimeout(() => dead.forEach((t) => { const el = els.get(t.id); if (el) el.remove(); els.delete(t.id); }), 110);
    tiles = alive();
    api.setExtra('Score', score.toLocaleString('en-US'));
  }
  function canMove() {
    const g = Array.from({ length: 4 }, () => new Array(4).fill(0));
    alive().forEach((t) => (g[t.r][t.c] = t.v));
    for (let r = 0; r < 4; r++) for (let c = 0; c < 4; c++) {
      if (!g[r][c]) return true;
      if (c < 3 && g[r][c] === g[r][c + 1]) return true;
      if (r < 3 && g[r][c] === g[r + 1][c]) return true;
    }
    return false;
  }
  function move(dir) { // 0 up 1 right 2 down 3 left
    if (over || api.done) return;
    const [dr, dc] = [[-1, 0], [0, 1], [1, 0], [0, -1]][dir];
    tiles.forEach((t) => { t.isNew = false; t.merged = false; });
    const grid = Array.from({ length: 4 }, () => new Array(4).fill(null));
    tiles.forEach((t) => (grid[t.r][t.c] = t));
    const rs = [0, 1, 2, 3], cs = [0, 1, 2, 3];
    if (dr === 1) rs.reverse(); if (dc === 1) cs.reverse();
    const mergedIds = new Set();
    let moved = false;
    for (const r of rs) for (const c of cs) {
      const t = grid[r][c]; if (!t) continue;
      let nr = r, nc = c, merged = false;
      while (true) {
        const r2 = nr + dr, c2 = nc + dc;
        if (r2 < 0 || r2 > 3 || c2 < 0 || c2 > 3) break;
        const o = grid[r2][c2];
        if (!o) { nr = r2; nc = c2; continue; }
        if (o.v === t.v && !mergedIds.has(o.id)) {
          grid[r][c] = null; t.r = r2; t.c = c2; t.dead = true;
          o.v *= 2; o.merged = true; mergedIds.add(o.id); score += o.v; merged = true; moved = true;
          if (o.v === 2048 && !reached) reached = true;
        }
        break;
      }
      if (!merged && (nr !== r || nc !== c)) { grid[r][c] = null; grid[nr][nc] = t; t.r = nr; t.c = nc; moved = true; }
    }
    if (!moved) return;
    api.move(); spawn(); render();
    if (!canMove()) { over = true; setTimeout(() => api.win({ m: score, title: reached ? 'You made 2048!' : 'Game over' }), 550); }
  }
  function reset() {
    R = Core.rng(Core.hashStr(P.seed));
    els.forEach((el) => el.remove()); els.clear();
    tiles = []; nid = 0; score = 0; over = false; reached = false;
    spawn(); spawn(); render();
  }
  let sw = null;
  board.addEventListener('pointerdown', (e) => { e.preventDefault(); sw = { x: e.clientX, y: e.clientY, id: e.pointerId }; try { board.setPointerCapture(e.pointerId); } catch (_) {} });
  const end = (e) => {
    if (!sw || e.pointerId !== sw.id) return;
    const dx = e.clientX - sw.x, dy = e.clientY - sw.y; sw = null;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 22) return;
    move(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 1 : 3) : (dy > 0 ? 2 : 0));
  };
  board.addEventListener('pointerup', end); board.addEventListener('pointercancel', () => (sw = null));
  window.onkeydown = (e) => { const k = { ArrowUp: 0, ArrowRight: 1, ArrowDown: 2, ArrowLeft: 3 }[e.key]; if (k != null) { e.preventDefault(); move(k); } };
  stage.appendChild(board);
  reset();
  api.btn('↺  Restart', () => { if (api.done) return; reset(); api.resetMoves(); });
  api.btn('End game', () => { if (api.done) return; over = true; api.win({ m: score, title: 'Game over' }); });
}

renderHome();
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost') && !/claude/.test(location.hostname)) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
}
</script>
