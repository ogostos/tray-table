<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0B0D12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tray Table">
<meta name="mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Tray Table — puzzle arcade</title>
<style>
:root{
  --bg:#0B0D12;--s1:#12151D;--s2:#191D28;--s3:#222735;--line:#262B39;--tx:#ECEEF3;--mute:#8C93A6;--dim:#596075;
  --lo:#FFC247;--ub:#FF6B5E;--qn:#B794FF;--t24:#3BE3C3;--kk:#A6E35B;--lk:#FF6FB5;--pp:#4CA8FF;--pr:#FF9F43;--fl:#3DDC84;--g2:#F2B179;--zp:#7C8CFF;--hb:#C7A27A;--sk:#FF8A65;--ng:#F5E663;--ms:#9AA5B8;--ol:#9EE7FF;--tg:#FFB86B;--hu:#E58CFF;--acc:#FFC247;
  --font:ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--font)}
body{min-height:100dvh;user-select:none;-webkit-user-select:none;touch-action:manipulation;overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
#app{max-width:480px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 18px)}

/* ---------- HOME ---------- */
.brand{display:flex;align-items:center;gap:12px;margin:4px 2px 18px}
.logo{width:42px;height:42px;border-radius:13px;background:linear-gradient(145deg,#FFC247,#FF6B5E);display:grid;place-items:center;
  color:#14110a;font-size:22px;font-weight:800;box-shadow:0 6px 24px -8px #FF8A4C}
.t1{font-size:22px;font-weight:800;letter-spacing:-.02em}
.t2{font-size:12.5px;color:var(--mute);margin-top:1px}
.duel{background:var(--s1);border:1px solid var(--line);border-radius:20px;padding:12px;margin-bottom:4px}
.duel-row{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.pill{height:52px;border-radius:15px;background:var(--s2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;gap:8px;
  font-weight:700;font-size:15px;min-width:0;padding:0 10px;transition:.18s}
.pill .dot{width:9px;height:9px;border-radius:50%;background:var(--dim);flex:none}
.pill span.nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill.on{background:#FFF;color:#0B0D12;border-color:#FFF}
.pill.on .dot{background:#22C55E}
.pill input{width:100%;background:transparent;border:0;outline:0;text-align:center;font-weight:700;color:#0B0D12}
.score{font-size:26px;font-weight:800;letter-spacing:-.02em;padding:0 6px;text-align:center}
.score small{display:block;font-size:10px;letter-spacing:.12em;color:var(--mute);font-weight:700;text-transform:uppercase;margin-top:2px}
.duel-hint{font-size:11.5px;color:var(--dim);text-align:center;margin-top:9px}
.cards{display:flex;flex-direction:column;gap:10px}
.card{display:grid;grid-template-columns:64px 1fr auto 30px;align-items:center;gap:14px;text-align:left;background:var(--s1);border:1px solid var(--line);
  border-radius:20px;padding:12px 14px 12px 12px;position:relative;overflow:hidden;transition:transform .12s}
.card:active{transform:scale(.985)}
.card::before{content:"";position:absolute;inset:0 auto 0 0;width:3px;background:var(--c)}
.ico{width:64px;height:64px;border-radius:16px;background:var(--s2);display:grid;place-items:center;overflow:hidden}
.ico svg{width:46px;height:46px}
.cname{font-size:17px;font-weight:800;letter-spacing:-.01em}
.cdesc{font-size:12.5px;color:var(--mute);margin-top:3px;line-height:1.35}
.cmeta{text-align:right}
.fav{width:30px;height:44px;display:grid;place-items:center;font-size:21px;color:#4A5165;margin-right:-6px;line-height:1}
.fav.on{color:#FFC247;text-shadow:0 0 12px rgba(255,194,71,.5)}
.fav-sec{color:#FFC247}
.cmeta b{display:block;font-size:15px;color:var(--c)}
.cmeta span{font-size:11px;color:var(--dim)}
.foot{margin-top:auto;padding-top:20px;text-align:center;font-size:11px;color:var(--dim);letter-spacing:.04em}

/* ---------- GAME SHELL ---------- */
.gbar{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;margin-bottom:10px}
.ibtn{width:44px;height:44px;border-radius:14px;background:var(--s1);border:1px solid var(--line);display:grid;place-items:center;font-size:20px;font-weight:700}
.gtitle{text-align:center;font-weight:800;font-size:18px;justify-self:center;padding:2px 10px;border-radius:12px}
.gtitle:active{background:var(--s1)}
.gtitle small{display:block;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--acc);font-weight:800;margin-top:1px}
.pnav{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:12px}
.pnav button{width:36px;height:32px;border-radius:10px;background:var(--s1);border:1px solid var(--line);font-weight:800;color:var(--mute)}
.pnav .pn{font-size:14px;color:var(--mute);min-width:104px;text-align:center}
.pnav .pn b{color:var(--tx);font-size:16px}
.pnav .tick{color:var(--acc)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.stat{background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:8px 10px}
.stat label{display:block;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);font-weight:800}
.stat b{font-size:19px;font-weight:800}
.stat b i{font-style:normal;font-size:12px;color:var(--mute);font-weight:700;margin-left:3px}
.stat .who{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.rival{font-size:12px;color:var(--mute);text-align:center;min-height:18px;margin-bottom:6px}
.rival b{color:var(--tx)}
.stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;min-height:300px}
.controls{display:flex;gap:8px;justify-content:center;margin-top:14px;flex-wrap:wrap}
.cbtn{height:44px;padding:0 18px;border-radius:14px;background:var(--s1);border:1px solid var(--line);font-weight:700;font-size:14px;color:var(--mute)}
.cbtn:active{background:var(--s2)}
.shake{animation:shake .35s}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}

/* ---------- LIGHTS OUT ---------- */
.lo-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;width:min(100%,380px);padding:14px;background:var(--s1);border-radius:24px;border:1px solid var(--line)}
.lo-cell{aspect-ratio:1;border-radius:14px;background:#1B1F2A;border:1px solid #252A37;transition:background .18s,box-shadow .18s,transform .1s}
.lo-cell.on{background:radial-gradient(circle at 40% 35%,#FFE39A,#FFC247 55%,#E59A12);border-color:#FFD36E;box-shadow:0 0 18px -2px rgba(255,194,71,.65),inset 0 -3px 0 rgba(0,0,0,.15)}
.lo-cell:active{transform:scale(.92)}
.lo-cell.hit{animation:pop .22s}
@keyframes pop{50%{transform:scale(.9)}}

/* ---------- UNBLOCK ---------- */
.ub-wrap{position:relative;width:min(100%,380px);padding:12px;background:#151924;border-radius:24px;border:1px solid var(--line)}
.ub-board{position:relative;width:100%;aspect-ratio:1;border-radius:12px;
  background-color:#0F121A;background-image:linear-gradient(#1C2130 1px,transparent 1px),linear-gradient(90deg,#1C2130 1px,transparent 1px);background-size:calc(100%/6) calc(100%/6);touch-action:none}
.ub-exit{position:absolute;right:0;width:12px;top:calc(12px + (100% - 24px)*2/6);height:calc((100% - 24px)/6);background:#0F121A;display:grid;place-items:center;color:var(--ub);font-weight:900;font-size:14px}
.ub-exit::after{content:"›";}
.car{position:absolute;padding:3.5px;touch-action:none;transition:left .15s ease-out,top .15s ease-out}
.car.drag{transition:none;z-index:3}
.car .body{width:100%;height:100%;border-radius:10px;background:linear-gradient(160deg,#4A5674,#36405A);box-shadow:inset 0 1px 0 rgba(255,255,255,.12),inset 0 -3px 0 rgba(0,0,0,.25);
  display:grid;place-items:center}
.car.l3 .body{background:linear-gradient(160deg,#5C5288,#443C69)}
.car.red .body{background:linear-gradient(160deg,#FF8A74,#FF5A4E);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),inset 0 -3px 0 rgba(0,0,0,.2),0 0 22px -6px #FF6B5E}
.car.red .body::after{content:"→";color:#3A0E0A;font-weight:900;font-size:20px;opacity:.7}
.car.drag .body{filter:brightness(1.15)}
.car.out{left:110%!important;opacity:0;transition:left .45s ease-in,opacity .45s}

/* ---------- QUEENS ---------- */
.qn-wrap{position:relative;width:min(100%,400px);aspect-ratio:1;touch-action:none;--fs:calc(min(100vw - 32px, 400px) / var(--n) * .56)}
.qn-grid{position:absolute;inset:0;display:grid;border-radius:9px;overflow:hidden}
.qn-cell{position:relative;min-width:0;min-height:0;overflow:hidden}
.qn-cell::after{content:"";position:absolute;inset:0;display:grid;place-items:center;font-size:var(--fs);line-height:1;color:#191326;font-weight:900}
.qn-cell.x::after{content:"×";font-weight:700;opacity:.5}
.qn-cell.ax::after{content:"×";font-weight:600;opacity:.22}
.qn-cell.q::after{content:"♛";}
.qn-cell.bad{background-image:repeating-linear-gradient(45deg,rgba(220,38,38,.38) 0 5px,transparent 5px 10px)}
.qn-cell.bad.q::after{color:#B91C1C}
.qn-svg{position:absolute;pointer-events:none}
.qn-wrap.erasing{outline:2px dashed rgba(255,107,107,.6);outline-offset:4px;border-radius:12px}
.qn-tools{display:flex;gap:6px;width:min(100%,400px)}
.qn-tools button{flex:1;height:42px;border-radius:12px;background:var(--s1);border:1px solid var(--line);font-weight:700;font-size:13.5px;color:var(--mute)}
.qn-tools button.on{background:#fff;color:#0B0D12;border-color:#fff}
.qn-tools button.auto{flex:.8}
.qn-tools button.auto.on{background:var(--qn);border-color:var(--qn);color:#1A1030}
/* ---------- 24 ---------- */
.t24-dots{display:flex;gap:7px}
.t24-dots i{width:28px;height:6px;border-radius:3px;background:var(--s3)}
.t24-dots i.done{background:var(--t24)}
.t24-dots i.cur{background:#fff}
.t24-cards{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:min(100%,340px)}
.t24-card{aspect-ratio:1.15;border-radius:22px;background:var(--s1);border:1.5px solid var(--line);font-size:44px;font-weight:800;display:grid;place-items:center;transition:.15s}
.t24-card.sel{border-color:var(--t24);background:#10302B;box-shadow:0 0 0 3px rgba(59,227,195,.18)}
.t24-card.gone{visibility:hidden;transition:none}
.t24-card.win{background:var(--t24);color:#062A23;border-color:var(--t24)}
.t24-card .fr{display:inline-flex;flex-direction:column;align-items:center;font-size:28px;line-height:1}
.t24-card .fr i{font-style:normal;border-top:2.5px solid currentColor;padding-top:2px;margin-top:2px}
.t24-ops{display:flex;gap:10px}
.t24-op{width:62px;height:56px;border-radius:16px;background:var(--s2);border:1.5px solid var(--line);font-size:26px;font-weight:800;color:var(--t24)}
.t24-op.sel{background:var(--t24);color:#062A23;border-color:var(--t24)}
.toast{font-size:13px;color:var(--mute);min-height:18px;text-align:center}
.toast b{color:var(--t24)}

/* ---------- KENKEN ---------- */
.kk-grid{display:grid;width:min(100%,380px);aspect-ratio:1;background:var(--s1);border:3px solid #E9ECF3;border-radius:8px;overflow:hidden}
.kk-cell{position:relative;display:grid;place-items:center;font-size:clamp(20px,8vw,34px);font-weight:800;border:0 solid #E9ECF3;box-shadow:inset 0 0 0 .5px #303647}
.kk-cell .lab{position:absolute;top:3px;left:5px;font-size:clamp(9px,2.8vw,12px);font-weight:800;color:var(--kk);letter-spacing:-.01em}
.kk-cell.sel{background:#22301A}
.kk-cell.peer{background:#161A24}
.kk-cell.sel.peer{background:#22301A}
.kk-cell.dup{color:#FF6B6B}
.kk-cell.badcage .lab{color:#FF6B6B}
.kk-pad{display:flex;gap:8px;width:min(100%,380px)}
.kk-key{flex:1;height:56px;border-radius:15px;background:var(--s2);border:1.5px solid var(--line);font-size:24px;font-weight:800}
.kk-key:active{background:var(--s3)}
.kk-key.del{font-size:18px;color:var(--mute)}


/* ---------- LINKS ---------- */
.lk-svg{width:min(100%,400px);aspect-ratio:1;background:#10131B;border-radius:18px;border:1px solid var(--line);touch-action:none;display:block}
/* ---------- PIPES ---------- */
.pp-grid{display:grid;gap:3px;width:min(100%,400px);aspect-ratio:1;padding:8px;background:#10131B;border-radius:20px;border:1px solid var(--line)}
.pp-tile{background:#171B25;border-radius:9px;display:grid;place-items:center;color:#3A4254;overflow:hidden}
.pp-tile svg{width:100%;height:100%;transition:transform .16s ease-out;display:block}
.pp-tile.wet{color:var(--pp)}
.pp-tile.wet.src{color:var(--pp)}
.pp-grid.solved .pp-tile{color:var(--pp);background:#13243A}
/* ---------- POUR ---------- */
.pr-rack{display:grid;justify-content:center;gap:22px 12px;width:min(100%,400px);padding:18px 6px 6px}
.tube{width:46px;height:168px;border:2.5px solid #3A4152;border-top:0;border-radius:0 0 23px 23px;display:flex;flex-direction:column-reverse;padding:3px;gap:0;overflow:hidden;
  transition:transform .15s,border-color .15s;background:rgba(255,255,255,.02);position:relative}
.tube::before{content:"";position:absolute;top:0;left:-6px;right:-6px;height:3px}
.tube i{display:block;height:25%;flex:none;border-radius:2px;box-shadow:inset 0 -2px 0 rgba(0,0,0,.18)}
.tube i:first-child{border-radius:0 0 18px 18px}
.tube.sel{transform:translateY(-16px);border-color:#fff}
.tube.done{border-color:var(--pr);box-shadow:0 0 18px -6px var(--pr)}
.rack-small .tube{width:38px;height:144px}
/* ---------- FLOOD ---------- */
.fl-grid{display:grid;width:min(100%,400px);aspect-ratio:1;border-radius:14px;overflow:hidden;border:1px solid var(--line)}
.fl-grid i{display:block;transition:background-color .28s}
.fl-grid i.home{box-shadow:inset 0 0 0 2px rgba(255,255,255,.75)}
.fl-pal{display:flex;gap:9px;justify-content:center;width:min(100%,400px)}
.fl-btn{flex:1;max-width:58px;aspect-ratio:1;border-radius:16px;box-shadow:inset 0 -4px 0 rgba(0,0,0,.2);transition:transform .1s,opacity .2s}
.fl-btn:active{transform:scale(.9)}
.fl-btn.cur{opacity:.25}
/* ---------- HOME SECTIONS ---------- */
.sec{font-size:12px;font-weight:800;color:var(--mute);margin:18px 4px 8px;display:flex;justify-content:space-between;align-items:baseline}
.sec span{font-weight:600;color:var(--dim);font-size:11.5px}


/* ---------- 2048 ---------- */
.g2-board{position:relative;width:min(100%,380px);aspect-ratio:1;background:#151924;border-radius:18px;border:1px solid var(--line);touch-action:none}
.g2-bg,.g2-t{position:absolute;width:21.25%;height:21.25%;border-radius:11px}
.g2-bg{background:#1C2130}
.g2-t{display:grid;place-items:center;font-weight:800;font-size:clamp(22px,8.5vw,36px);transition:left .1s ease-out,top .1s ease-out;letter-spacing:-.02em}
.g2-t.d3{font-size:clamp(18px,7vw,30px)}.g2-t.d4{font-size:clamp(15px,5.6vw,24px)}.g2-t.d5{font-size:clamp(12px,4.4vw,19px)}
.g2-t.new{animation:g2in .2s ease-out}
.g2-t.merged{animation:g2pop .2s}
.g2-t.dead{z-index:0}
@keyframes g2in{from{transform:scale(.3);opacity:0}}
@keyframes g2pop{50%{transform:scale(1.15)}}
/* ---------- SOLO ---------- */
.solo-row{display:grid;grid-template-columns:1fr auto;gap:8px}
.add2{height:52px;padding:0 16px;border-radius:15px;background:transparent;border:1.5px dashed #3A4152;color:var(--mute);font-weight:700;font-size:14px;white-space:nowrap}
.lnk{color:var(--mute);text-decoration:underline;text-underline-offset:2px;font-size:11.5px;font-weight:700}
.res-row.solo1{grid-template-columns:1fr}

/* ---------- HUE ---------- */
.hu-grid{display:grid;gap:3px;touch-action:none;transition:gap .4s}
.hu-t{aspect-ratio:1;border-radius:6px;position:relative;transition:transform .12s,border-radius .4s}
.hu-t.fixed::after{content:"";position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:rgba(11,13,18,.55)}
.hu-t.sel{transform:scale(.82);box-shadow:0 0 0 3px #fff}
.hu-grid.solved{gap:0}.hu-grid.solved .hu-t{border-radius:0}
/* ---------- ONE LINE ---------- */
.ol-svg{display:block;touch-action:none;background:#10131B;border-radius:22px;border:1px solid var(--line)}
.ol-svg.done{box-shadow:0 0 0 2px var(--ol),0 0 40px -10px var(--ol)}
/* ---------- TANGO ---------- */
.tg-wrap{position:relative;width:min(100%,390px);aspect-ratio:1}
.tg-grid{position:absolute;inset:0;display:grid;gap:4px}
.tg-c{background:#1A1E29;border-radius:10px;display:grid;place-items:center;padding:16%;min-width:0;min-height:0}
.tg-c svg{width:100%;height:100%;display:block}
.tg-c.given{background:#262B38}
.tg-c.bad{background:#3A1A20;box-shadow:inset 0 0 0 2px #FF6B6B}
.tg-sign{position:absolute;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;background:#0B0D12;color:#C9CDD8;display:grid;place-items:center;font-size:13px;font-weight:900;line-height:1;pointer-events:none;border:1px solid #3A4152}
.tg-sign.bad{color:#FF6B6B;border-color:#FF6B6B}
/* ---------- LOBBY / DUEL ---------- */
.dim{color:var(--dim)}
.pdot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px;vertical-align:1px}
.pill.on{background:#fff;color:#0B0D12;border-color:#fff}
.pill.on .dot{background:var(--pc,#22C55E)}
.sheet{max-height:92dvh;overflow:auto}
.lobby .rules{background:var(--s2);border-radius:16px;padding:12px 14px;margin-bottom:14px}
.lobby .rules p{font-size:13.5px;margin:0 0 6px;line-height:1.45}
.lobby .rules p:last-child{margin:0}
.opt{margin-bottom:12px}
.opt>label{display:block;font-size:12px;color:var(--mute);font-weight:700;margin:0 2px 6px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:4px;background:var(--s2);border:1px solid var(--line);border-radius:14px;padding:4px}
.seg button{min-height:42px;padding:6px 4px;border-radius:10px;font-weight:700;font-size:13.5px;color:var(--mute);line-height:1.15}
.seg button small{display:block;font-size:10.5px;font-weight:600;opacity:.7;margin-top:2px}
.seg button.on{background:#fff;color:#0B0D12}
.note{font-size:12px;color:var(--mute);text-align:center;margin-bottom:4px}
.verdict .vs{margin-top:6px;font-size:13px;color:var(--mute)}
.turn{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px;padding:9px 12px;border-radius:14px;
  background:color-mix(in srgb,var(--pc) 15%,var(--s1));border:1.5px solid var(--pc);font-size:14px}
.turn b{color:var(--pc)}
.turn .sc{font-size:12px;white-space:nowrap}
.turn .sc b{color:var(--tx)}
#app.duelling{box-shadow:inset 0 4px 0 var(--pc)}
.handoff{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:30px;text-align:center;
  background:radial-gradient(circle at 50% 38%,color-mix(in srgb,var(--pc) 55%,#0B0D12),#0B0D12 72%);animation:fade .2s}
.handoff .kick{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#D9DCE5;font-weight:800}
.handoff .who{font-size:52px;font-weight:800;letter-spacing:-.02em;color:#fff;line-height:1.05;margin-top:6px}
.handoff .sub{color:#fff;font-size:20px;font-weight:700}
.handoff .det{color:#C3C7D2;font-size:14px;margin:4px 0 22px}
.handoff .go{height:60px;padding:0 36px;border-radius:18px;background:var(--pc);color:#0B0D12;font-weight:800;font-size:18px;box-shadow:0 10px 40px -12px var(--pc)}
.handoff .lnk{margin-top:16px}
.res{border-left:3px solid var(--rc,transparent)}
.res.lost b{color:var(--mute)}
.cbtn.concede{color:#FF8A8A;border-color:#3A2A30}
.cbtn.warn{background:#4A1D24;color:#fff;border-color:#FF6B6B}

/* ---------- ZIP ---------- */
.zp-svg{display:block;width:min(100%,400px);aspect-ratio:1;background:#10131B;border-radius:18px;border:1px solid var(--line);touch-action:none}
.zp-svg.done{box-shadow:0 0 0 2px var(--zp),0 0 40px -10px var(--zp)}
/* ---------- BRIDGES ---------- */
.hb-svg{display:block;width:min(100%,400px);aspect-ratio:1;background:#10131B;border-radius:18px;border:1px solid var(--line);touch-action:none}
.hb-svg.done{box-shadow:0 0 0 2px var(--hb),0 0 40px -10px var(--hb)}
/* ---------- NONOGRAM ---------- */
.ng-view{width:100%;overflow:hidden;border-radius:10px;touch-action:none}
.ng-view.zoomed{overflow:auto;max-height:62dvh;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.ng-view.panning{touch-action:pan-x pan-y}.ng-view.panning .ng{touch-action:pan-x pan-y}
.ng{display:grid;touch-action:none;user-select:none;width:max-content;margin:0 auto}
.ng-corner{position:sticky;left:0;top:0;z-index:3;background:var(--bg)}
.ng-cc{position:sticky;top:0;z-index:2;background:var(--bg);display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:1px;padding-bottom:4px;font-size:var(--fs);font-weight:800;color:#C9CDD8;line-height:1.05}
.ng-rc{position:sticky;left:0;z-index:2;background:var(--bg);display:flex;justify-content:flex-end;align-items:center;gap:4px;padding-right:6px;font-size:var(--fs);font-weight:800;color:#C9CDD8}
.ng-cc.ok,.ng-rc.ok{color:#4A5165}
.ng-c{background:#1A1E29;border-right:1px solid #0B0D12;border-bottom:1px solid #0B0D12;position:relative}
.ng-c.br{border-right:2px solid #5A6175}.ng-c.bb{border-bottom:2px solid #5A6175}
.ng-c.f{background:var(--ng)}
.ng-c.x::after{content:"×";position:absolute;inset:0;display:grid;place-items:center;color:#5A6175;font-weight:700;font-size:calc(var(--cs)*.7);line-height:1}
.ng.done .ng-c.x::after{opacity:0}.ng.done .ng-c{border-color:transparent}
/* ---------- SHIKAKU ---------- */
.sk-board{position:relative;border-radius:10px;touch-action:none;background-color:#141822;border:2px solid #2A3040;
  background-image:linear-gradient(#262B39 1px,transparent 1px),linear-gradient(90deg,#262B39 1px,transparent 1px)}
.sk-layer{position:absolute;inset:0;pointer-events:none}
.sk-rect{position:absolute;padding:2px;box-sizing:border-box}
.sk-rect::before{content:"";position:absolute;inset:2px;border-radius:7px;background:var(--rc);opacity:.78;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)}
.sk-rect.bad::before{background:repeating-linear-gradient(45deg,rgba(255,107,107,.45) 0 6px,rgba(255,107,107,.18) 6px 12px);opacity:1;box-shadow:inset 0 0 0 2px #FF6B6B}
.sk-rect.preview{pointer-events:none;z-index:2}.sk-rect.preview::before{background:rgba(255,255,255,.14);box-shadow:inset 0 0 0 2px #fff;opacity:1}
.sk-num{position:absolute;transform:translate(-50%,-50%);font-weight:900;font-size:clamp(14px,4.6vw,20px);color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.6);z-index:3}
.sk-board.done{box-shadow:0 0 0 2px var(--sk),0 0 40px -10px var(--sk)}
/* ---------- MINESWEEPER ---------- */
.ms-grid{display:grid;gap:2px;touch-action:none;-webkit-touch-callout:none}
.ms-c{height:var(--cs);border-radius:5px;background:linear-gradient(160deg,#3A4152,#2C3242);display:grid;place-items:center;font-weight:900;font-size:calc(var(--cs)*.55);box-shadow:inset 0 -2px 0 rgba(0,0,0,.25)}
.ms-c.o{background:#161A24;box-shadow:none}
.ms-c.fl::after{content:"⚑";color:#FF6B6B;font-size:calc(var(--cs)*.55)}
.ms-c.mine{background:#3A1A20}.ms-c.mine::after{content:"✸";color:#FF6B6B}
.ms-c.boom{background:#FF5A5F}.ms-c.boom::after{color:#fff}
.ms-grid.done .ms-c:not(.o){background:#2A4A3A}
/* ---------- SHEETS ---------- */
.solbar{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--s1);border-top:1px solid var(--line);padding:12px 16px calc(env(safe-area-inset-bottom) + 12px);box-shadow:0 -12px 30px rgba(0,0,0,.45);animation:up .25s ease-out}
.solbar .sbt{max-width:448px;margin:0 auto 10px;font-size:14.5px;color:var(--mute)}.solbar .sbt b{color:var(--tx)}
.solbar .sbb{max-width:448px;margin:0 auto;display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:8px}
.solbar .big{height:48px;font-size:14px;padding:0 6px}
.solbar .sbb:has(> :nth-child(2):last-child){grid-template-columns:1.6fr 1fr}
body.has-bar #app{padding-bottom:170px}
#app.solved-shown .controls,#app.solved-shown .qn-tools{visibility:hidden}
.lo-cell.sol{box-shadow:inset 0 0 0 3px #fff}
.t24-sol{display:grid;gap:8px;width:min(100%,340px)}
.t24-sol div{display:flex;justify-content:space-between;gap:10px;background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-weight:700}
.t24-sol span{color:var(--mute)}.t24-sol b{color:var(--t24)}

.sheet-x{position:absolute;top:14px;right:14px;width:38px;height:38px;border-radius:50%;background:var(--s2);border:1px solid var(--line);color:var(--mute);font-size:15px;font-weight:700;display:grid;place-items:center;z-index:2}
.sheet>.kicker,.sheet>h2{padding-right:44px}
.handoff .hback{margin-top:18px;height:44px;padding:0 20px;border-radius:14px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);color:#fff;font-weight:700;font-size:14px}

.veil{position:fixed;inset:0;background:rgba(5,6,9,.72);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:flex;align-items:flex-end;justify-content:center;z-index:20;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet{width:100%;max-width:480px;background:var(--s1);border:1px solid var(--line);border-bottom:0;border-radius:28px 28px 0 0;padding:22px 20px calc(env(safe-area-inset-bottom) + 20px);position:relative;animation:up .28s cubic-bezier(.2,.9,.3,1.1)}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.kicker{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--acc);font-weight:800}
.sheet h2{margin:6px 0 14px;font-size:30px;letter-spacing:-.02em}
.sheet p{color:var(--mute);font-size:15px;line-height:1.5;margin:0 0 10px}
.res-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.res{background:var(--s2);border:1px solid var(--line);border-radius:18px;padding:12px 14px}
.res.best{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc) inset}
.res label{font-size:12px;color:var(--mute);font-weight:700;display:flex;justify-content:space-between}
.res label em{font-style:normal;color:var(--acc);font-size:10px;letter-spacing:.1em}
.res b{display:block;font-size:24px;margin-top:4px}
.res span{font-size:12.5px;color:var(--dim)}
.verdict{font-size:14px;color:var(--tx);background:var(--s2);border-radius:14px;padding:10px 12px;margin-bottom:14px;text-align:center}
.btns{display:flex;flex-direction:column;gap:8px}
.big{display:block;width:100%;height:52px;border-radius:16px;font-weight:800;font-size:16px;background:var(--s2);border:1px solid var(--line)}
.big.pri{background:var(--acc);color:#0B0D12;border-color:var(--acc)}
.burst{position:absolute;left:50%;top:0;pointer-events:none}
.burst i{position:absolute;width:8px;height:12px;border-radius:2px;background:var(--acc);opacity:0;animation:conf 1.1s ease-out forwards}
@keyframes conf{0%{opacity:1;transform:translate(0,0) rotate(0)}100%{opacity:0;transform:translate(var(--x),var(--y)) rotate(var(--r))}}
.demo{display:flex;justify-content:center;margin:6px 0 14px}
</style>

<script>
// ====================== STATE ======================
const KEY = 'traytable.v2';
const store = (() => {
  let mem = null;
  try { const s = localStorage.getItem(KEY); if (s) mem = JSON.parse(s); } catch (e) {}
  if (!mem) {
    mem = {};
    try { const old = JSON.parse(localStorage.getItem('traytable.v1') || 'null'); if (old) { mem.players = old.players; mem.duo = !!old.duo; } } catch (e) {}
  }
  mem.players = mem.players || ['Player 1', 'Player 2'];
  mem.duo = !!mem.duo;
  mem.res = mem.res || {};
  mem.cfg = mem.cfg || {};
  mem.duel = mem.duel || {};
  return { d: mem, save() { try { localStorage.setItem(KEY, JSON.stringify(mem)); } catch (e) {} } };
})();
const S = store.d;
const PC = ['#5EB1FF', '#FF7AB6']; // player colours
const TN = Core.TIER_NAMES;

const $ = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
const fmtT = (s) => { s = Math.max(0, Math.round(s)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const nm = (p) => esc(S.players[p]);
const dot = (p) => `<i class="pdot" style="background:${PC[p]}"></i>`;

// ====================== GAMES REGISTRY ======================
const PAL = ['#FF5A5F', '#FFB020', '#FFE14D', '#3DDC84', '#2EC4F1', '#4C6FFF', '#A770FF', '#FF6FB5', '#EDEFF5', '#A0724A', '#B8F04A', '#7C8698'];
const COLOUR_GAMES = [
  { id: 'lk', sec: 'c', name: 'Links', color: 'var(--lk)', metric: 'time', desc: 'Join every pair of coloured dots. Fill the whole board.',
    rules: ['Drag from a dot to draw a pipe to the <b>other dot of the same colour</b>.', 'Pipes can\'t cross. Draw over a pipe to cut it.', 'Every pair joined <b>and every cell filled</b> wins. Fastest time wins; fewer strokes breaks a tie.'],
    icon: `<svg viewBox="0 0 46 46"><rect x="2" y="2" width="42" height="42" rx="8" fill="#10131B"/><path d="M10 10V36H22" stroke="#FF6FB5" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M23 10H36V24" stroke="#2EC4F1" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="10" cy="10" r="5" fill="#FF6FB5"/><circle cx="22" cy="36" r="5" fill="#FF6FB5"/><circle cx="23" cy="10" r="5" fill="#2EC4F1"/><circle cx="36" cy="24" r="5" fill="#2EC4F1"/><circle cx="36" cy="36" r="5" fill="#FFE14D"/></svg>`, mount: mountLK },
  { id: 'pp', sec: 'c', name: 'Pipes', color: 'var(--pp)', metric: 'moves', desc: 'Rotate the tiles until water reaches every end.',
    rules: ['Tap a tile to <b>rotate</b> it a quarter turn.', 'Connect every tile to the <b>source</b> in the middle — lit pipes have water.', 'No open ends allowed. Par is the fewest taps. Fewer taps wins.'],
    icon: `<svg viewBox="0 0 46 46"><rect x="2" y="2" width="42" height="42" rx="8" fill="#10131B"/><path d="M23 23H40M23 23V6M23 23H6V40" stroke="#4CA8FF" stroke-width="6" fill="none" stroke-linecap="round"/><circle cx="23" cy="23" r="7" fill="#4CA8FF"/><path d="M36 30v10" stroke="#3A4254" stroke-width="6" stroke-linecap="round"/></svg>`, mount: mountPP },
  { id: 'pr', sec: 'c', name: 'Pour', color: 'var(--pr)', metric: 'moves', desc: 'Pour the colours until every tube holds just one.',
    rules: ['Tap a tube, then another, to <b>pour</b> its top colour across.', 'You can only pour onto the <b>same colour</b> or into an empty tube, and only while there\'s room.', 'Sort every colour into its own tube. Fewer pours wins. Undo is free.'],
    icon: `<svg viewBox="0 0 46 46">${[['#FF5A5F','#4C6FFF','#FF5A5F'],['#4C6FFF','#FFB020','#4C6FFF'],['#FFB020','#FF5A5F','#FFB020']].map((t,k)=>`<rect x="${5+k*13}" y="6" width="10" height="34" rx="5" fill="none" stroke="#3A4152" stroke-width="1.6"/>`+t.map((c,j)=>`<rect x="${6.5+k*13}" y="${29-j*9.5}" width="7" height="9" rx="${j?1:3}" fill="${c}"/>`).join('')).join('')}</svg>`, mount: mountPR },
  { id: 'fl', sec: 'c', name: 'Flood', color: 'var(--fl)', metric: 'moves', desc: 'Paint from the corner until the whole board is one colour.',
    rules: ['Your blob starts in the <b>top-left corner</b>.', 'Pick a colour — your blob turns that colour and swallows every touching cell of it.', 'Fill the board in as <b>few moves</b> as you can. Beat the target.'],
    icon: `<svg viewBox="0 0 46 46">${Array.from({length:25},(_,i)=>{const r=Math.floor(i/5),c=i%5;const cols=['#3DDC84','#FF5A5F','#FFE14D','#4C6FFF','#A770FF'];const v=(r+c<3)?'#3DDC84':cols[(r*7+c*3)%5];return `<rect x="${3+c*8}" y="${3+r*8}" width="8" height="8" fill="${v}"/>`}).join('')}</svg>`, mount: mountFL },
];
COLOUR_GAMES.push(
  { id: 'hu', sec: 'c', name: 'Hue', color: 'var(--hu)', metric: 'moves', desc: 'Rebuild the colour gradient, tile by tile.',
    rules: ['The tiles form a smooth <b>colour gradient</b> — but they\'ve been shuffled.', 'Tap two tiles to <b>swap</b> them. Tiles with a dot are pinned in place and show you the way.', 'Restore the gradient in as <b>few swaps</b> as you can. Par is the minimum.'],
    icon: `<svg viewBox="0 0 46 46">${Array.from({length:16},(_,i)=>{const x=i%4,y=Math.floor(i/4);const r=Math.round(255-x*30-y*20),g=Math.round(120+x*30),b=Math.round(150+y*30);return `<rect x="${3+x*10}" y="${3+y*10}" width="9.4" height="9.4" rx="2" fill="rgb(${r},${g},${b})"/>`}).join('')}<circle cx="7.7" cy="7.7" r="1.6" fill="#0B0D12"/><circle cx="38.3" cy="38.3" r="1.6" fill="#0B0D12"/></svg>`, mount: mountHU },
  { id: 'ol', sec: 'c', name: 'One Line', color: 'var(--ol)', metric: 'time', desc: 'Trace the whole figure in one stroke, no line twice.',
    rules: ['Draw the <b>whole figure</b> as one continuous line.', 'Start at a dot and drag along the lines. Each line can be drawn <b>only once</b>; dots can be visited many times.', 'Lift your finger and carry on from where you stopped. Stuck? <b>Undo</b> or start over. Fastest time wins.'],
    icon: `<svg viewBox="0 0 46 46"><rect x="2" y="2" width="42" height="42" rx="8" fill="#10131B"/><path d="M9 37 23 9 37 37Z M9 37 37 23 M23 9V37" stroke="#9EE7FF" stroke-width="3" fill="none" stroke-linejoin="round"/><path d="M9 37 23 9 37 37" stroke="#fff" stroke-width="4.2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>${[[9,37],[23,9],[37,37],[37,23],[23,37]].map(([x,y])=>`<circle cx="${x}" cy="${y}" r="3.4" fill="#9EE7FF"/>`).join('')}</svg>`, mount: mountOL },
);
COLOUR_GAMES.push(
  { id: 'zp', sec: 'c', name: 'Zip', color: 'var(--zp)', metric: 'time', desc: 'One path through every cell, numbers in order.',
    rules: ['Start on <b>1</b> and drag a single path through <b>every cell</b> of the grid.', 'Pass the numbers <b>in order</b> — 1, 2, 3… — and finish on the last one.', 'Drag back over your path to undo it. Fastest time wins; fewer strokes breaks a tie.'],
    icon: `<svg viewBox="0 0 46 46"><rect x="2" y="2" width="42" height="42" rx="8" fill="#10131B"/><path d="M10 10H36V23H10V36H36" stroke="#7C8CFF" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>${[[10,10,1],[36,23,2],[36,36,3]].map(([x,y,k])=>`<circle cx="${x}" cy="${y}" r="5.4" fill="#fff"/><text x="${x}" y="${y+2.6}" font-size="7.5" font-weight="900" text-anchor="middle" fill="#0B0D12" font-family="system-ui">${k}</text>`).join('')}</svg>`, mount: mountZP },
  { id: 'hb', sec: 'c', name: 'Bridges', color: 'var(--hb)', metric: 'time', desc: 'Link every island with the right number of bridges.',
    rules: ['Each island\'s number is how many <b>bridges</b> touch it.', 'Bridges run straight across or down, <b>never cross</b>, and up to <b>two</b> can join the same pair.', 'All islands must end up <b>connected</b>. Drag from an island toward a neighbour (or tap one, then the other) to add a bridge; a third time removes them.'],
    icon: `<svg viewBox="0 0 46 46"><rect x="2" y="2" width="42" height="42" rx="8" fill="#10131B"/><path d="M11 11H35M11 11V35" stroke="#C7A27A" stroke-width="2.6"/><path d="M35 9.6V35M37.6 9.6V35" stroke="#C7A27A" stroke-width="2.2" transform="translate(-1.3 0)"/>${[[11,11,2],[35,11,3],[11,35,1],[35,35,2]].map(([x,y,k],i)=>`<circle cx="${x}" cy="${y}" r="6.2" fill="${i%3===0?'#C7A27A':'#1A1E29'}" stroke="#C7A27A" stroke-width="1.6"/><text x="${x}" y="${y+2.8}" font-size="8" font-weight="900" text-anchor="middle" fill="${i%3===0?'#1B140C':'#ECEEF3'}" font-family="system-ui">${k}</text>`).join('')}</svg>`, mount: mountHB },
  { id: 'sk', sec: 'c', name: 'Shikaku', color: 'var(--sk)', metric: 'time', desc: 'Split the grid into rectangles that match their numbers.',
    rules: ['Divide the whole grid into <b>rectangles</b>.', 'Every rectangle holds <b>exactly one number</b>, and that number is its <b>area</b> (a 6 can be 2×3 or 1×6).', 'Drag from corner to corner to draw a rectangle; tap one to remove it. Fastest time wins.'],
    icon: `<svg viewBox="0 0 46 46"><rect x="2" y="2" width="42" height="42" rx="8" fill="#10131B"/><rect x="5" y="5" width="17" height="24" rx="3" fill="#FF8A65" opacity=".85"/><rect x="24" y="5" width="17" height="11" rx="3" fill="#5EB1FF" opacity=".85"/><rect x="24" y="18" width="17" height="23" rx="3" fill="#3DDC84" opacity=".85"/><rect x="5" y="31" width="17" height="10" rx="3" fill="#FFC247" opacity=".85"/>${[[13.5,19,6],[32.5,13.5,2],[32.5,31.5,4],[13.5,38.5,2]].map(([x,y,k])=>`<text x="${x}" y="${y}" font-size="9" font-weight="900" text-anchor="middle" fill="#0B0D12" font-family="system-ui">${k}</text>`).join('')}</svg>`, mount: mountSK },
);
const GAMES = [...COLOUR_GAMES,
  { id: 'g2', sec: 'l', unit: 'Game', name: '2048', color: 'var(--g2)', metric: 'score', desc: 'Swipe, merge equal tiles, chase 2048 and beyond.',
    rules: ['<b>Swipe</b> to slide every tile.', 'Two equal tiles that touch <b>merge</b> — 2+2 = 4, 4+4 = 8, all the way up.', 'Reach <b>2048</b>, then keep going. It ends when no move is left. Highest score wins.'],
    icon: `<svg viewBox="0 0 46 46"><rect x="2" y="2" width="42" height="42" rx="8" fill="#151924"/>${[['#2A2F3D','#F2B179','#2A2F3D'],['#FF8A3D','#2A2F3D','#FFE14D'],['#2A2F3D','#FF5A5F','#F2B179']].map((row,r)=>row.map((f,c)=>`<rect x="${5+c*12.5}" y="${5+r*12.5}" width="11" height="11" rx="2.5" fill="${f}"/>`).join('')).join('')}</svg>`, mount: mountG2 },
  { id: 'lo', sec: 'l', name: 'Lights Out', color: 'var(--lo)', metric: 'moves', desc: 'Flip lights and their neighbours until the board goes dark.',
    rules: ['Tap a light to flip it <b>and its four neighbours</b>.', 'Turn every light <b>off</b>.', '<b>Par</b> is the fewest taps that can solve it. Fewer moves wins the duel; time breaks ties.'],
    icon: `<svg viewBox="0 0 46 46">${[0,1,2].map(r=>[0,1,2].map(c=>{const on=[1,3,4,5,7].includes(r*3+c);return `<rect x="${2+c*15}" y="${2+r*15}" width="12" height="12" rx="3.5" fill="${on?'#FFC247':'#2A2F3D'}"/>`}).join('')).join('')}</svg>`, mount: mountLO },
  { id: 'ub', sec: 'l', name: 'Unblock', color: 'var(--ub)', metric: 'moves', desc: 'Slide the blocks and get the red one out.',
    rules: ['Drag a block <b>along its length</b> — sideways blocks move sideways, upright ones move up and down.', 'Get the <b>red block</b> out through the gap on the right.', 'One slide of any distance = <b>one move</b>. Par is the minimum.'],
    icon: `<svg viewBox="0 0 46 46"><rect x="3" y="3" width="40" height="40" rx="6" fill="#151924"/><rect x="6" y="18" width="20" height="10" rx="3" fill="#FF6B5E"/><rect x="29" y="6" width="10" height="24" rx="3" fill="#4A5674"/><rect x="6" y="31" width="30" height="9" rx="3" fill="#5C5288"/><rect x="6" y="6" width="20" height="9" rx="3" fill="#4A5674"/></svg>`, mount: mountUB },

const hasTiers = (g) => g.metric !== 'score';

// ---------- results & settings ----------
function cfg(gid) {
  const c = (S.cfg[gid] = S.cfg[gid] || {});
  if (c.tier == null) c.tier = 0;
  if (!c.timer) c.timer = 'now';
  if (c.first == null) c.first = 0;
  if (!c.mode) c.mode = 'same';
  return c;
}
const rkey = (t, n) => t + ':' + n;
function getRes(gid, t, n, p) { return ((S.res[gid] || {})[rkey(t, n)] || [])[p] || null; }
function putRes(gid, t, n, p, r) {
  const g = (S.res[gid] = S.res[gid] || {}), k = rkey(t, n);
  g[k] = g[k] || [null, null];
  const prev = g[k][p];
  const isBest = !prev || cmp(G[gid], r, prev).c < 0;
  if (isBest) g[k][p] = r;
  return { prev, isBest };
}
function nextNum(gid, t, p) { for (let n = 1; ; n++) if (!getRes(gid, t, n, p)) return n; }
function solvedCount(gid, t, p) { const g = S.res[gid] || {}; return Object.keys(g).filter((k) => k.startsWith(t + ':') && g[k][p]).length; }
function bestScore(gid, p) { let b = 0; for (const k in S.res[gid] || {}) { const r = S.res[gid][k][p]; if (r) b = Math.max(b, r.m); } return b; }

// a < b  => c < 0. Conceded results always lose; ties broken by a second measure where there is one.
function cmp(g, a, b, mode = 'same') {
  if (a.x && b.x) return { c: 0, why: 'Both conceded' };
  if (a.x) return { c: 1, why: 'conceded' };
  if (b.x) return { c: -1, why: 'conceded' };
  const sec = (x) => Math.round(x.t);
  if (g.metric === 'moves') {
    const ka = a.m - (mode === 'diff' ? a.p || 0 : 0), kb = b.m - (mode === 'diff' ? b.p || 0 : 0);
    if (ka !== kb) return { c: ka - kb, why: mode === 'diff' ? 'fewer moves over par' : 'fewer moves' };
    if (sec(a) !== sec(b)) return { c: sec(a) - sec(b), why: 'same moves — faster' };
    return { c: 0, why: 'Same moves, same time' };
  }
  if (g.metric === 'score') {
    if (a.m !== b.m) return { c: b.m - a.m, why: 'higher score' };
    if (sec(a) !== sec(b)) return { c: sec(a) - sec(b), why: 'same score — faster' };
    return { c: 0, why: 'Same score, same time' };
  }
  if (sec(a) !== sec(b)) return { c: sec(a) - sec(b), why: 'faster' };
  if ((a.a || 0) !== (b.a || 0)) return { c: (a.a || 0) - (b.a || 0), why: `same time — fewer moves (${a.a || 0} vs ${b.a || 0})` };
  return { c: 0, why: 'Same time, same number of moves' };
}
const fmtMain = (g, x) => x.x ? (x.why === 'hit a mine' ? 'Boom' : 'Conceded') : g.metric === 'moves' ? `${x.m} moves` : g.metric === 'score' ? x.m.toLocaleString('en-US') : fmtT(x.t);
const fmtSub = (g, x, mode) => x.x ? `after ${fmtT(x.t)}` : g.metric === 'moves' ? `${fmtT(x.t)}${mode === 'diff' && x.p != null ? ` · par ${x.p}` : ''}` : g.metric === 'score' ? `points · ${fmtT(x.t)}` : `${x.a || 0} moves`;

// ---------- duels ----------
function duelOf(gid) { return (S.duel[gid] = S.duel[gid] || { rounds: [] }); }
function openRound(gid) { const d = duelOf(gid); const i = d.rounds.findIndex((r) => !r.res[0] || !r.res[1]); return i < 0 ? null : i; }
function turnOf(round) { if (!round.res[round.first]) return round.first; if (!round.res[1 - round.first]) return 1 - round.first; return null; }
function gameScore(gid) {
  const s = [0, 0, 0]; // p0 wins, ties, p1 wins
  for (const r of duelOf(gid).rounds) { if (!r.res[0] || !r.res[1]) continue; const c = cmp(G[gid], r.res[0], r.res[1], r.mode).c; s[c < 0 ? 0 : c > 0 ? 2 : 1]++; }
  return s;
}
function totalScore() { const s = [0, 0, 0]; for (const g of GAMES) { const x = gameScore(g.id); s[0] += x[0]; s[1] += x[1]; s[2] += x[2]; } return s; }

  const c = cfg(gid), g = G[gid], t = hasTiers(g) ? c.tier : 0, d = duelOf(gid);
  const used = new Set(); d.rounds.forEach((r) => { if (r.t === t) r.nums.forEach((n) => used.add(n)); });
  const free = () => { for (let n = 1; ; n++) if (!used.has(n) && !getRes(gid, t, n, 0) && !getRes(gid, t, n, 1)) { used.add(n); return n; } };
  const a = free(), b = c.mode === 'diff' ? free() : a;

  store.save();
  return d.rounds.length - 1;
}
const scoreLine = (s) => `<span style="color:${PC[0]}">${nm(0)}</span> <b class="num">${s[0]}</b> <span class="dim">–</span> <b class="num">${s[2]}</b> <span style="color:${PC[1]}">${nm(1)}</span>${s[1] ? ` <span class="dim">· ${s[1]} tie${s[1] > 1 ? 's' : ''}</span>` : ''}`;

    const n = duelOf(gid).rounds.length + 1;
    go.innerHTML = `Start round ${n} · ${nm(c.first)} first`;
    go.style.background = PC[c.first]; go.style.borderColor = PC[c.first];
    go.onclick = () => { v.remove(); const i = newRound(gid); handoff(gid, i, c.first); };
  }
  btns.appendChild(go);
  if (S.duo && ri != null) {
    const skip = $('button', 'big', 'Cancel this round');
    skip.onclick = () => { duelOf(gid).rounds.splice(ri, 1); store.save(); re(); };
    btns.appendChild(skip);
  }
  const leave = $('button', 'big', '‹  Back to arcade'); leave.onclick = () => goHome();
  btns.appendChild(leave);
  kids.push(btns);
  let v = old;
  if (old) { const sh = old.querySelector('.sheet'), top = sh.scrollTop; sh.replaceChildren(sh.querySelector('.sheet-x'), ...kids); sh.scrollTop = top; }
  else v = veil(kids, 'lobby', () => goHome());

// ====================== HAND-OFF ======================
function handoff(gid, ri, p) {
  const g = G[gid], r = duelOf(gid).rounds[ri];
  const other = 1 - p, otherDone = r.res[other];
  const h = $('div', 'handoff');
  h.style.setProperty('--pc', PC[p]);
  const what = r.mode === 'same' ? (otherDone ? `Same puzzle ${nm(other)} just played` : 'Same puzzle for both of you') : 'Your own puzzle — same difficulty';
  h.innerHTML = `<div class="kick">${g.name} · Round ${ri + 1}${hasTiers(g) ? ' · ' + TN[r.t] : ''}</div>
    <div class="who">${nm(p)}</div><div class="sub">your turn</div><div class="det">${what}</div>`;
  const go = $('button', 'go', cfg(gid).timer === 'now' ? 'Start — clock runs' : 'Start');
  h.appendChild(go);
  const back = $('button', 'hback', `‹  ${g.name} menu`); back.onclick = () => { h.remove(); toMenu(gid); };
  h.appendChild(back);
  document.body.appendChild(h);
  const api = openGame({ gid, t: r.t, num: r.nums[p], p, ri });
  go.onclick = () => { h.remove(); if (cfg(gid).timer === 'now') api.start(); };
}

// ====================== GAME SHELL ======================
function openGame(ctx) {
  const { gid, t, num, p, ri } = ctx;
  const duel = ri != null;
  clearInterval(tickTimer); window.onkeydown = null;
  document.querySelectorAll('.veil,.solbar').forEach((v) => v.remove()); document.body.classList.remove('has-bar'); app.classList.remove('solved-shown');
  const g = G[gid], c = cfg(gid);
  document.documentElement.style.setProperty('--acc', getComputedStyle(document.documentElement).getPropertyValue('--' + gid).trim() || '#FFC247');
  app.innerHTML = '';
  const round = duel ? duelOf(gid).rounds[ri] : null, mode = round ? round.mode : 'same';
  const P = GEN[gid](t, num);

  const bar = $('div', 'gbar');
  navPush();
  curGame = gid;
  const back = $('button', 'ibtn back', '‹'); back.setAttribute('aria-label', `${g.name} menu`); back.onclick = () => toMenu(gid);
  const help = $('button', 'ibtn', '?'); help.onclick = () => showRules(g);
  const ttl = $('button', 'gtitle', `${g.name}<small>${hasTiers(g) ? TN[t] + ' ▾' : 'Classic'}</small>`); ttl.onclick = () => toMenu(gid);
  bar.append(back, ttl, help);
  app.appendChild(bar);

  if (duel) {
    const tb = $('div', 'turn');
    tb.style.setProperty('--pc', PC[p]);
    tb.innerHTML = `<div>${dot(p)}<b>${nm(p)}</b> is playing <span class="dim">· round ${ri + 1}</span></div><div class="sc">${scoreLine(gameScore(gid))}</div>`;
    app.appendChild(tb);
    app.style.setProperty('--pc', PC[p]);
    app.classList.add('duelling');
  } else {
    app.classList.remove('duelling');
    const nav = $('div', 'pnav');
    const prev = $('button', '', '‹'), next = $('button', '', '›');
    prev.onclick = () => openGame({ ...ctx, num: num - 1 }); next.onclick = () => openGame({ ...ctx, num: num + 1 });
    if (num <= 1) prev.style.visibility = 'hidden';
    const mine = getRes(gid, t, num, 0);
    nav.append(prev, $('div', 'pn num', `${g.unit || 'Puzzle'} <b>#${num}</b>${mine ? ' <span class="tick">✓</span>' : ''}`), next);
    app.appendChild(nav);
  }

  const stats = $('div', 'stats');
  const sMain = $('div', 'stat'), sTime = $('div', 'stat'), sThird = $('div', 'stat');
  if (duel) {
    const o = round.res[1 - p];
    sThird.innerHTML = `<label>${nm(1 - p)}</label><b class="num">${o ? (o.x ? '—' : fmtMain(g, o).replace(' moves', '<i>mv</i>')) : '…'}</b>`;
  } else {
    const mine = getRes(gid, t, num, 0);
    sThird.innerHTML = `<label>Best</label><b class="num">${mine ? fmtMain(g, mine).replace(' moves', '<i>moves</i>') : '—'}</b>`;
  }
  stats.append(sMain, sTime, sThird);
  const stage = $('div', 'stage');
  const controls = $('div', 'controls');
  app.append(stats, stage, controls);

  const st = { moves: 0, par: null, started: false, t0: 0, acc: 0, penalty: 0, done: false };
  const elapsed = () => st.acc + (st.started && !st.paused ? (performance.now() - st.t0) / 1000 : 0) + st.penalty;
  const paint = () => {
    if (g.metric === 'moves') sMain.innerHTML = `<label>Moves</label><b class="num">${st.moves}${st.par != null ? `<i>/ ${st.parLabel || 'par'} ${st.par}</i>` : ''}</b>`;
    else sMain.innerHTML = `<label>${st.extraLabel || 'Status'}</label><b class="num">${st.extra || '—'}</b>`;
    sTime.innerHTML = `<label>Time</label><b class="num">${st.started || st.done ? fmtT(elapsed()) : '0:00'}</b>`;
  };
  const finish = (r, title) => {
    st.acc = elapsed() - st.penalty; st.started = false; st.done = true; paint();
    r.t = Math.round(elapsed() * 10) / 10; r.a = st.moves; if (st.par != null) r.p = st.par;
    let info = {};
    if (!r.x) { info = putRes(gid, t, num, p, r); st.solvedByPlayer = true; }
    if (duel) round.res[p] = r;
    store.save();
    if (r.x && !duel) { setTimeout(() => showGaveUp(ctx, r, title, st), 60); return; } // solo: straight to the answer
    setTimeout(() => showResult(ctx, r, title, info, st), r.x ? 50 : 450);
  };
  let solver = null, revealed = false;
  st.reveal = () => { if (revealed || !solver) return; revealed = true; app.classList.add('solved-shown'); solver(); };
  st.canReveal = () => !!solver;
  let concedeArm = 0;
  const api = {
    get done() { return st.done; },
    start() { if (!st.started && !st.done) { st.started = true; st.t0 = performance.now(); paint(); } },
    move(n = 1) { if (st.done) return; api.start(); st.moves = Math.max(0, st.moves + n); paint(); },
    resetMoves() { st.moves = 0; paint(); },
    setPar(v, label) { st.par = v; st.parLabel = label; paint(); },
    setExtra(label, v) { st.extraLabel = label; st.extra = v; paint(); },
    penalty(s) { api.start(); st.penalty += s; paint(); },
    btn(label, fn, cls = '') { const b = $('button', 'cbtn ' + cls, label); b.onclick = fn; controls.appendChild(b); return b; },
    win(opts = {}) { if (st.done) return; finish({ m: opts.m != null ? opts.m : st.moves }, opts.title); },
    fail(title, why) { if (st.done) return; finish({ x: 1, m: 0, why }, title); },
    solution(fn) { solver = fn; },
  };
  document.onvisibilitychange = () => {
    if (st.done || !st.started) return;
    if (document.hidden) { st.acc += (performance.now() - st.t0) / 1000; st.paused = true; }
    else { st.t0 = performance.now(); st.paused = false; }
  };
  g.mount(stage, controls, P, api, { num, t });
  const cb = (!duel && g.metric === 'score') ? null : api.btn(duel ? 'Concede' : 'Give up', () => {
    if (st.done) return;
    if (Date.now() - concedeArm > 2500) { concedeArm = Date.now(); cb.textContent = 'Tap again to confirm'; cb.classList.add('warn'); setTimeout(() => { if (!st.done) { cb.textContent = duel ? 'Concede' : 'Give up'; cb.classList.remove('warn'); } }, 2500); return; }
    finish({ x: 1, m: 0 }, duel ? 'Conceded' : 'Gave up');
  }, 'concede');
  paint();
  tickTimer = setInterval(paint, 250);
  if (!duel && c.timer === 'now') api.start();
  return api;
}

function showGaveUp(ctx, r, title, st) {

}
function showRules(g) {

function burstEl() {

  return burst;
}
function resCard(g, x, label, opts = {}) {
  return `<div class="res ${opts.best ? 'best' : ''} ${x && x.x ? 'lost' : ''}" ${opts.pc ? `style="--rc:${opts.pc}"` : ''}><label><span>${label}</span>${opts.tag ? `<em>${opts.tag}</em>` : ''}</label><b class="num">${x ? fmtMain(g, x) : '—'}</b><span class="num">${x ? fmtSub(g, x, opts.mode) : 'not played yet'}</span></div>`;
}
function showResult(ctx, r, title, info, st) {
  const { gid, t, num, p, ri } = ctx;
  const g = G[gid];
  const kids = [];
  const btns = $('div', 'btns');
  let v;
  if (ri == null) {
    // ---- solo ----
    if (!r.x) kids.push(burstEl());
    kids.push($('div', 'kicker', `${g.name} · ${hasTiers(g) ? TN[t] + ' · ' : ''}${g.unit || 'Puzzle'} #${num}`), $('h2', '', r.x ? title || 'Gave up' : title || 'Solved'));
    const verdict = [];
    if (!r.x && g.metric === 'moves' && st.par != null) { const pl = st.parLabel || 'par'; verdict.push(r.m < st.par ? `Under the ${pl} by ${st.par - r.m}!` : r.m === st.par ? `Right on ${pl}.` : `${pl[0].toUpperCase() + pl.slice(1)} is ${st.par} — ${r.m - st.par} over.`); }
    if (!r.x && info.isBest && info.prev) verdict.push('New personal best!');
    let second = '';
    if (g.metric === 'score') second = resCard(g, { m: bestScore(gid, 0), t: 0 }, 'Best ever').replace(/points · 0:00/, 'points');
    else if (info.prev) second = resCard(g, info.prev, info.isBest ? 'Previous best' : 'Your best');
    kids.push($('div', 'res-row' + (second ? '' : ' solo1'), resCard(g, r, g.unit ? 'This game' : 'This run', { best: !r.x }) + second));
    if (verdict.length) kids.push($('div', 'verdict', verdict.join(' · ')));
    let nx = num + 1; while (getRes(gid, t, nx, 0)) nx++; // next unsolved puzzle after this one
    const bNext = $('button', 'big pri', hasTiers(g) ? `Next puzzle · #${nx}` : 'New game');
    bNext.onclick = () => { v.remove(); openGame({ gid, t, num: hasTiers(g) ? nx : nextNum(gid, 0, 0), p: 0 }); };
    btns.append(bNext);
    if (hasTiers(g)) { const a = $('button', 'big', r.x ? 'Try this one again' : 'Play this one again'); a.onclick = () => { v.remove(); openGame(ctx); }; btns.append(a); }
  } else {
    // ---- duel ----
    const round = duelOf(gid).rounds[ri], other = 1 - p, o = round.res[other];
    const head = `${g.name} · Round ${ri + 1}${hasTiers(g) ? ' · ' + TN[round.t] : ''}`;
    if (!o) {
      if (!r.x) kids.push(burstEl());
      kids.push($('div', 'kicker', head), $('h2', '', r.x ? `${nm(p)} ${r.why || 'conceded'}` : `${nm(p)} is done`));
      kids.push($('div', 'res-row solo1', resCard(g, r, `${dot(p)}${nm(p)}`, { best: !r.x, pc: PC[p], mode: round.mode })));
      kids.push($('div', 'verdict', `${g.name} score: ${scoreLine(gameScore(gid))}`));
      const pass = $('button', 'big pri', `Hand over to ${nm(other)} →`);
      pass.style.background = PC[other]; pass.style.borderColor = PC[other];
      pass.onclick = () => { v.remove(); handoff(gid, ri, other); };
      btns.append(pass);
      if (r.x && round.mode === 'diff' && st.canReveal()) { // their own board, so no spoiler for the other player
        const see = $('button', 'big', 'Show the solution');
        see.onclick = () => { v.remove(); st.reveal(); showBar(`<b>${nm(p)} ${r.why || 'conceded'}.</b> Here’s the solution.`, [[`Hand over to ${nm(other)} →`, 'pri', () => handoff(gid, ri, other), PC[other]], ['‹ Menu', '', () => toMenu(gid)]]); };
        btns.append(see);
      }
    } else {
      const res = round.res, k = cmp(g, res[0], res[1], round.mode);
      const w = k.c < 0 ? 0 : k.c > 0 ? 1 : null;
      if (w != null) kids.push(burstEl());
      kids.push($('div', 'kicker', head), $('h2', '', w == null ? 'Tie' : `${nm(w)} wins the round`));
      const card = (q) => resCard(g, res[q], `${dot(q)}${nm(q)}`, { best: w === q, tag: w === q ? 'WIN' : '', pc: PC[q], mode: round.mode });
      kids.push($('div', 'res-row', card(0) + card(1)));
      let why = k.why;
      if (w != null && why === 'conceded') why = `${nm(1 - w)} ${round.res[1 - w].why || 'conceded'}`;
      else if (w != null) why = `${nm(w)}: ${why}`;
      kids.push($('div', 'verdict', `${why}<div class="vs">${g.name}: ${scoreLine(gameScore(gid))}</div>`));
      const first = cfg(gid).first;
      const nx = $('button', 'big pri', `Next round · ${nm(first)} starts →`);
      nx.style.background = PC[first]; nx.style.borderColor = PC[first];
      nx.onclick = () => { v.remove(); const i = newRound(gid); handoff(gid, i, first); };
      btns.append(nx);
      if (st.canReveal() && !st.solvedByPlayer) {
        const see = $('button', 'big', 'Show the solution');
        see.onclick = () => { v.remove(); st.reveal(); showBar(`<b>Round ${ri + 1}</b> · here’s the solution${round.mode === 'diff' ? ` to ${nm(p)}’s puzzle` : ''}.`, [[`Next round · ${nm(first)} starts →`, 'pri', () => { const i = newRound(gid); handoff(gid, i, first); }, PC[first]], ['‹ Menu', '', () => toMenu(gid)]]); };
        btns.append(see);
      }
    }
  }
  const home = $('button', 'big', `‹  ${g.name} menu · change level`); home.onclick = () => { v.remove(); toMenu(gid); };
  btns.append(home);
  kids.push(btns);
  v = veil(kids);
  v.onclick = null;
}

// ====================== LIGHTS OUT ======================
function mountLO(stage, controls, P, api) {
  const n = P.n;
  let b = P.board.slice();
  api.setPar(P.par);
  const grid = $('div', 'lo-grid');
  grid.style.gridTemplateColumns = `repeat(${n},minmax(0,1fr))`;
  const cells = [];
  const paint = () => cells.forEach((c, i) => c.classList.toggle('on', !!b[i]));
  for (let i = 0; i < n * n; i++) {
    const c = $('button', 'lo-cell');
    c.onpointerdown = (e) => {
      e.preventDefault();
      if (api.done) return;
      Core.loToggle(b, n, i); api.move(); paint();
      const r = Math.floor(i / n), cc = i % n;
      [[0, 0], [1, 0], [-1, 0], [0, 1], [0, -1]].forEach(([dr, dc]) => {
        const rr = r + dr, c2 = cc + dc; if (rr < 0 || c2 < 0 || rr >= n || c2 >= n) return;
        const el = cells[rr * n + c2]; el.classList.remove('hit'); void el.offsetWidth; el.classList.add('hit');
      });
      if (b.every((v) => !v)) api.win();
    };
    cells.push(c); grid.appendChild(c);
  }
  paint(); stage.appendChild(grid);
  api.solution(() => {
    b = P.board.slice(); paint();
    const x = Core.loPlan(b, n); x.forEach((i) => cells[i].classList.add('sol'));
    x.forEach((i, k) => setTimeout(() => { Core.loToggle(b, n, i); paint(); }, 700 + k * 450));
  });
  api.btn('↺  Reset', () => { if (api.done) return; b = P.board.slice(); paint(); api.resetMoves(); });
}

// ====================== UNBLOCK ======================
function mountUB(stage, controls, P, api) {
  const V = P.vehicles, parS = P.par;
  const start = V.map((v) => (v.h ? v.c : v.r));
  let pos = start.slice();
  api.setPar(+parS);
  const wrap = $('div', 'ub-wrap'), board = $('div', 'ub-board');
  wrap.append(board, $('div', 'ub-exit'));
  const cars = V.map((v, i) => {
    const car = $('div', 'car' + (i === 0 ? ' red' : '') + (v.len === 3 ? ' l3' : ''));
    car.appendChild($('div', 'body'));
    car.style.width = ((v.h ? v.len : 1) / 6 * 100) + '%';
    car.style.height = ((v.h ? 1 : v.len) / 6 * 100) + '%';
    board.appendChild(car);
    return car;
  });
  const place = (i, p) => { const v = V[i]; const r = v.h ? v.r : p, c = v.h ? p : v.c; cars[i].style.left = (c / 6 * 100) + '%'; cars[i].style.top = (r / 6 * 100) + '%'; };
  const placeAll = () => V.forEach((_, i) => place(i, pos[i]));
  placeAll();
  const occupied = (except) => {
    const g = new Array(36).fill(false);
    V.forEach((v, i) => { if (i === except) return; for (let k = 0; k < v.len; k++) g[(v.h ? v.r : pos[i] + k) * 6 + (v.h ? pos[i] + k : v.c)] = true; });
    return g;
  };
  let drag = null;
  cars.forEach((car, i) => {
    car.onpointerdown = (e) => {
      if (api.done || drag) return;
      e.preventDefault();
      const v = V[i], g = occupied(i);
      const free = (k) => !g[(v.h ? v.r : k) * 6 + (v.h ? k : v.c)];
      let lo = pos[i], hi = pos[i];
      while (lo - 1 >= 0 && free(lo - 1)) lo--;
      while (hi + v.len <= 5 && free(hi + v.len)) hi++;
      const cell = board.clientWidth / 6;
      drag = { i, id: e.pointerId, s: v.h ? e.clientX : e.clientY, p0: pos[i], lo, hi, cell, cur: pos[i] };
      try { car.setPointerCapture(e.pointerId); } catch (_) {}
      car.classList.add('drag');
    };
    car.onpointermove = (e) => {
      if (!drag || drag.i !== i || e.pointerId !== drag.id) return;
      const v = V[i];
      const d = (v.h ? e.clientX : e.clientY) - drag.s;
      const p = Math.max(drag.lo, Math.min(drag.hi, drag.p0 + d / drag.cell));
      drag.cur = p;
      const r = v.h ? v.r : p, c = v.h ? p : v.c;
      car.style.left = (c / 6 * 100) + '%'; car.style.top = (r / 6 * 100) + '%';
    };
    const end = (e) => {
      if (!drag || drag.i !== i) return;
      const np = Math.round(drag.cur);
      car.classList.remove('drag');
      pos[i] = np; place(i, np);
      if (np !== drag.p0) api.move();
      drag = null;
      if (i === 0 && np === 6 - V[0].len) {
        setTimeout(() => car.classList.add('out'), 120);
        api.win();
      }
    };
    car.onpointerup = end; car.onpointercancel = end;
  });
  stage.appendChild(wrap);
  api.solution(() => {
    const path = Core.ubPath(V); if (!path) return;
    pos = path[0].slice(); placeAll();
    path.slice(1).forEach((q, k) => setTimeout(() => { pos = q.slice(); placeAll(); if (k === path.length - 2) setTimeout(() => cars[0].classList.add('out'), 350); }, 600 + k * 600));
  });
  api.btn('↺  Reset', () => { if (api.done) return; pos = start.slice(); placeAll(); api.resetMoves(); });
}

// ====================== QUEENS ======================
const QCOL = ['#E9A86B', '#8FB8F0', '#B6A0F2', '#9FD8A0', '#F0D27A', '#F29BA8', '#7FD4D0', '#D9BE96', '#C5CAD6', '#E8C3F0'];
function mountQN(stage, controls, P, api, ctx) {
  const n = P.n, reg = P.region, num = ctx.t + '-' + ctx.num;
  const C = cfg('qn');
  let mark = new Array(n * n).fill(0); // 0 empty, 1 x, 2 queen
  const hist = [];
  let tool = 'mark';
  const colorOrder = Core.rng(Core.hashStr('qc-' + num));
  const cols = QCOL.slice(); for (let i = cols.length - 1; i > 0; i--) { const j = Math.floor(colorOrder() * (i + 1)); [cols[i], cols[j]] = [cols[j], cols[i]]; }
  const wrap = $('div', 'qn-wrap'); wrap.style.setProperty('--n', n);
  const grid = $('div', 'qn-grid');
  grid.style.gridTemplateColumns = grid.style.gridTemplateRows = `repeat(${n},minmax(0,1fr))`;
  const cells = [];
  for (let i = 0; i < n * n; i++) { const el = $('div', 'qn-cell'); el.style.background = cols[reg[i]]; cells.push(el); grid.appendChild(el); }
  // region borders drawn once as vector lines -> crisp, even, rounded joints
  let d = '';
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) {
    const i = r * n + c;
    if (c < n - 1 && reg[i] !== reg[i + 1]) d += `M${c + 1} ${r}V${r + 1}`;
    if (r < n - 1 && reg[i] !== reg[i + n]) d += `M${c} ${r + 1}H${c + 1}`;
  }
  let thin = '';

// ====================== 24 ======================
function mount24(stage, controls, P, api) {
  let h = 0, cards, hist, sel, op, locked = false;
  const dots = $('div', 't24-dots');
  const grid = $('div', 't24-cards');
  const ops = $('div', 't24-ops');
  const toast = $('div', 'toast');
  stage.append(dots, grid, ops, toast);
  const fmtV = (v) => (v[1] === 1 ? String(v[0]) : `<span class="fr">${v[0]}<i>${v[1]}</i></span>`);
  const load = () => {
    cards = P.hands[h].nums.map((x) => ({ v: Core.fr(x) }));
    hist = []; sel = null; op = null; locked = false; toast.innerHTML = '&nbsp;';
    paint();
  };
  const opEls = {};
  for (const o of ['+', '-', '×', '÷']) {
    const b = $('button', 't24-op', o === '-' ? '−' : o);
    b.onclick = () => { if (locked || api.done || sel == null) return; op = op === o ? null : o; paint(); };
    opEls[o] = b; ops.appendChild(b);
  }
  const slots = [0, 1, 2, 3].map((k) => {
    const b = $('button', 't24-card num');
    b.onclick = () => tapCard(k);
    grid.appendChild(b); return b;
  });
  function paint() {
    dots.innerHTML = P.hands.map((_, k) => `<i class="${k < h ? 'done' : k === h ? 'cur' : ''}"></i>`).join('');
    slots.forEach((b, k) => {
      const c = cards[k];
      b.classList.toggle('gone', !c);
      b.classList.toggle('sel', sel === k);
      b.classList.remove('win');
      b.innerHTML = c ? fmtV(c.v) : '';
    });
    for (const o in opEls) opEls[o].classList.toggle('sel', op === o);
    api.setExtra('Hand', `${Math.min(h + 1, 5)}<i>/ 5</i>`);
  }
  function tapCard(k) {
    if (locked || api.done || !cards[k]) return;
    api.start();
    if (sel == null || (op == null && sel !== k)) { sel = k; paint(); return; }
    if (sel === k) { sel = null; op = null; paint(); return; }
    const v = Core.fop(cards[sel].v, cards[k].v, op);
    if (!v) { grid.classList.remove('shake'); void grid.offsetWidth; grid.classList.add('shake'); toast.textContent = 'Can’t divide by zero'; return; }
    hist.push(cards.map((c) => c && { v: c.v.slice() }));
    cards[k] = { v }; cards[sel] = null; sel = k; op = null; api.move();
    const left = cards.filter(Boolean);
    paint();
    if (left.length === 1) {
      if (v[0] === 24 && v[1] === 1) {
        slots[k].classList.add('win'); locked = true; toast.innerHTML = '<b>24!</b>';
        setTimeout(() => { h++; if (h >= 5) { paint(); api.win(); } else load(); }, 650);
      } else {
        grid.classList.remove('shake'); void grid.offsetWidth; grid.classList.add('shake');
        toast.textContent = 'Not 24 — undo or reset';
      }
    }
  }
  api.solution(() => {
    [dots, grid, ops, toast].forEach((e) => (e.style.display = 'none'));
    stage.appendChild($('div', 't24-sol', P.hands.map((hd) => `<div><span class="num">${hd.nums.join(' · ')}</span><b class="num">${hd.solution.replace(/-/g, '−')} = 24</b></div>`).join('')));
  });
  api.btn('↶  Undo', () => { if (locked || !hist.length) return; cards = hist.pop(); sel = null; op = null; toast.innerHTML = '&nbsp;'; paint(); });
  api.btn('↺  Reset', () => { if (locked) return; load(); });
  api.btn('Give up  +60s', () => {
    if (locked || api.done) return;
    locked = true; api.penalty(60);
    toast.innerHTML = `<b>${P.hands[h].solution.replace(/-/g, '−')}</b> = 24`;
    setTimeout(() => { h++; if (h >= 5) { paint(); api.win(); } else load(); }, 2600);
  });
  load();
}

// ====================== KENKEN ======================
function mountKK(stage, controls, P, api) {
  const n = P.n, cageOf = P.cageOf;
  const vals = new Array(n * n).fill(0);
  let sel = null;
  const grid = $('div', 'kk-grid');
  grid.style.gridTemplateColumns = `repeat(${n},1fr)`;
  const cells = [];
  for (let i = 0; i < n * n; i++) {
    const r = Math.floor(i / n), c = i % n, g = cageOf[i];
    const el = $('button', 'kk-cell num');
    const B = (cond) => (cond ? '2.5px' : '0');
    el.style.borderTopWidth = B(r > 0 && cageOf[i - n] !== g);
    el.style.borderLeftWidth = B(c > 0 && cageOf[i - 1] !== g);
    const cage = P.cages[g];
    if (cage.cells[0] === i) { const l = $('span', 'lab', `${cage.target}${cage.op}`); el.appendChild(l); }
    const v = $('span', 'v'); el.appendChild(v);
    el.onclick = () => { if (api.done) return; sel = i; paint(); };
    cells.push(el); grid.appendChild(el);
  }
  function paint() {
    const dup = new Set();
    for (let i = 0; i < n * n; i++) {
      if (!vals[i]) continue;
      const r = Math.floor(i / n), c = i % n;
      for (let k = 0; k < n; k++) {
        const a = r * n + k, b = k * n + c;
        if (a !== i && vals[a] === vals[i]) dup.add(i);
        if (b !== i && vals[b] === vals[i]) dup.add(i);
      }
    }
    const badCage = new Set(); let allCages = true;
    P.cages.forEach((cg, gi) => {
      const vs = cg.cells.map((k) => vals[k]);
      if (vs.some((x) => !x)) { allCages = false; return; }
      if (!Core.cageOk(cg.op, cg.target, vs)) { badCage.add(gi); allCages = false; }
    });
    const sr = sel == null ? -1 : Math.floor(sel / n), sc = sel == null ? -1 : sel % n;
    cells.forEach((el, i) => {
      el.querySelector('.v').textContent = vals[i] || '';
      el.classList.toggle('sel', i === sel);
      el.classList.toggle('peer', sel != null && (Math.floor(i / n) === sr || i % n === sc));
      el.classList.toggle('dup', dup.has(i));
      el.classList.toggle('badcage', badCage.has(cageOf[i]));
    });
    const filled = vals.filter(Boolean).length;
    api.setExtra('Filled', `${filled}<i>/ ${n * n}</i>`);
    if (filled === n * n && dup.size === 0 && allCages) api.win();
  }
  const pad = $('div', 'kk-pad');
  for (let k = 1; k <= n; k++) {
    const b = $('button', 'kk-key num', k);
    b.onclick = () => { if (api.done || sel == null) return; vals[sel] = k; api.move(); paint(); };
    pad.appendChild(b);
  }
  const del = $('button', 'kk-key del', '⌫');
  del.onclick = () => { if (api.done || sel == null) return; vals[sel] = 0; api.move(); paint(); };
  pad.appendChild(del);
  stage.append(grid, pad);
  sel = 0; paint();
  api.solution(() => { P.solution.forEach((v, i) => (vals[i] = v)); sel = null; paint(); });
  api.btn('Clear board', () => { if (api.done) return; vals.fill(0); paint(); });
}

// ====================== LINKS ======================
function mountLK(stage, controls, P, api) {
  const n = P.n, K = P.k;
  const dotAt = new Map(); P.dots.forEach(([a, b], c) => { dotAt.set(a, c); dotAt.set(b, c); });
  let paths = P.dots.map(() => []), active = null;
  const NS = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(NS, 'svg'); svg.setAttribute('viewBox', `0 0 ${n} ${n}`); svg.setAttribute('class', 'lk-svg');
  const adj = (a, b) => Math.abs(Math.floor(a / n) - Math.floor(b / n)) + Math.abs((a % n) - (b % n)) === 1;
  const other = (c, d) => (P.dots[c][0] === d ? P.dots[c][1] : P.dots[c][0]);
  const complete = (c) => { const p = paths[c]; return p.length >= 2 && dotAt.get(p[0]) === c && p[p.length - 1] === other(c, p[0]); };
  const owner = (cell) => { for (let c = 0; c < K; c++) if (paths[c].includes(cell)) return c; return null; };
  const cxy = (i) => [(i % n) + 0.5, Math.floor(i / n) + 0.5];
  function render() {
    let h = '';
    for (let i = 1; i < n; i++) h += `<path d="M${i} 0V${n}M0 ${i}H${n}" stroke="#1E2330" stroke-width="0.03"/>`;
    paths.forEach((p, c) => p.forEach((i) => { h += `<rect x="${i % n}" y="${Math.floor(i / n)}" width="1" height="1" fill="${PAL[c]}" opacity="${complete(c) ? 0.22 : 0.12}"/>`; }));
    paths.forEach((p, c) => { if (p.length > 1) h += `<polyline points="${p.map((i) => cxy(i).join(',')).join(' ')}" fill="none" stroke="${PAL[c]}" stroke-width="0.34" stroke-linecap="round" stroke-linejoin="round"/>`; });
    P.dots.forEach(([a, b], c) => [a, b].forEach((d) => { const [x, y] = cxy(d); h += `<circle cx="${x}" cy="${y}" r="0.34" fill="${PAL[c]}"/>`; if (active === c) h += `<circle cx="${x}" cy="${y}" r="0.44" fill="none" stroke="${PAL[c]}" stroke-width="0.05" opacity=".6"/>`; }));
    svg.innerHTML = h;
    const linked = paths.filter((_, c) => complete(c)).length;
    const filled = new Set(paths.flat()).size;
    api.setExtra('Linked', `${linked}<i>/ ${K}</i>`);
    return { linked, filled };
  }
  const cellAt = (e) => { const r = svg.getBoundingClientRect(); const c = Math.floor((e.clientX - r.left) / r.width * n), rr = Math.floor((e.clientY - r.top) / r.height * n); return c < 0 || rr < 0 || c >= n || rr >= n ? null : rr * n + c; };
  svg.addEventListener('pointerdown', (e) => {
    if (api.done) return; e.preventDefault();
    const cell = cellAt(e); if (cell == null) return;
    api.start();
    if (dotAt.has(cell)) { const c = dotAt.get(cell); paths[c] = [cell]; active = c; }
    else { const o = owner(cell); if (o == null) return; paths[o] = paths[o].slice(0, paths[o].indexOf(cell) + 1); active = o; }
    try { svg.setPointerCapture(e.pointerId); } catch (_) {}
    render();
  });
  svg.addEventListener('pointermove', (e) => {
    if (active == null) return;
    const cell = cellAt(e); if (cell == null) return;
    const p = paths[active], last = p[p.length - 1];
    if (cell === last) return;
    const idx = p.indexOf(cell);
    if (idx >= 0) { paths[active] = p.slice(0, idx + 1); render(); return; }
    if (!adj(last, cell) || complete(active)) return;
    if (dotAt.has(cell) && dotAt.get(cell) !== active) return;
    const o = owner(cell); if (o != null) paths[o] = paths[o].slice(0, paths[o].indexOf(cell));
    p.push(cell); render();
  });
  const up = () => { if (active == null) return; active = null; api.move(); const r = render(); if (r.linked === K && r.filled === n * n) api.win(); };
  svg.addEventListener('pointerup', up); svg.addEventListener('pointercancel', up);
  stage.appendChild(svg);
  render();
  api.solution(() => { paths = P.solution.map((sg) => sg.slice()); active = null; render(); });
  api.btn('↺  Reset', () => { if (api.done) return; paths = P.dots.map(() => []); render(); });
}

// ====================== PIPES ======================
function mountPP(stage, controls, P, api) {
  const n = P.n;
  const base = P.tiles.slice(), turns = new Array(n * n).fill(0);
  const cur = () => base.map((m, i) => { let y = m; for (let k = 0; k < turns[i] % 4; k++) y = Core.rotCW(y); return y; });
  api.setPar(P.par);
  const grid = $('div', 'pp-grid'); grid.style.gridTemplateColumns = `repeat(${n},1fr)`;
  const tiles = base.map((m, i) => {
    const deg = [1, 2, 4, 8].filter((b) => m & b).length;
    const segs = [[1, 'M50 50V-2'], [2, 'M50 50H102'], [4, 'M50 50V102'], [8, 'M50 50H-2']].filter(([b]) => m & b).map(([, d]) => `<path d="${d}" stroke="currentColor" stroke-width="17" stroke-linecap="butt"/>`).join('');
    const center = i === P.src ? `<circle cx="50" cy="50" r="27" fill="currentColor"/><circle cx="50" cy="50" r="11" fill="#0B0D12"/>`
      : deg === 1 ? `<circle cx="50" cy="50" r="19" fill="currentColor"/><circle cx="50" cy="50" r="8" fill="#0B0D12" opacity=".55"/>` : `<circle cx="50" cy="50" r="8.5" fill="currentColor"/>`;
    const b = $('button', 'pp-tile' + (i === P.src ? ' src' : ''), `<svg viewBox="0 0 100 100">${segs}${center}</svg>`);
    b.onclick = () => {
      if (api.done) return;
      turns[i]++; b.firstChild.style.transform = `rotate(${turns[i] * 90}deg)`;
      api.move(); paint();
    };
    grid.appendChild(b); return b;
  });
  function paint() {
    const res = Core.pipesConnected(n, P.src, cur());
    tiles.forEach((t, i) => t.classList.toggle('wet', res.seen.has(i)));
    if (res.solved) { grid.classList.add('solved'); api.win(); }
  }
  stage.appendChild(grid);
  paint();
  api.solution(() => {
    base.forEach((m, i) => { let y = m, k = 0; while (y !== P.solution[i] && k < 4) { y = Core.rotCW(y); k++; } turns[i] += ((k - turns[i]) % 4 + 4) % 4; tiles[i].firstChild.style.transform = `rotate(${turns[i] * 90}deg)`; });
    paint();
  });
  api.btn('↺  Reset', () => { if (api.done) return; turns.fill(0); tiles.forEach((t) => (t.firstChild.style.transform = '')); api.resetMoves(); paint(); });
}

// ====================== POUR ======================

// ====================== ONE LINE ======================
function mountOL(stage, controls, P, api) {
  const { W, H } = P;
  const idx = new Map();
  P.edges.forEach(([a, b], k) => { idx.set(a + '-' + b, k); idx.set(b + '-' + a, k); });

  const svg = document.createElementNS(NS, 'svg');
  svg.setAttribute('viewBox', `-0.6 -0.6 ${W + 0.2} ${H + 0.2}`);
  svg.setAttribute('class', 'ol-svg');
  svg.style.aspectRatio = `${W + 0.2} / ${H + 0.2}`;
  svg.style.width = `min(100%, ${Math.round(420 * (W + 0.2) / (H + 0.2))}px)`;
  const toast = $('div', 'toast', '&nbsp;');
  const cur = () => path[path.length - 1];
  function render() {
    let h = '';
    for (const [a, b] of P.edges) { const [x1, y1] = xy(a), [x2, y2] = xy(b); h += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#2A3040" stroke-width="0.16" stroke-linecap="round"/>`; }
    if (path.length > 1) h += `<polyline points="${path.map((v) => xy(v).join(',')).join(' ')}" fill="none" stroke="var(--ol)" stroke-width="0.17" stroke-linecap="round" stroke-linejoin="round"/>`;
    for (const v of P.nodes) { const [x, y] = xy(v); h += `<circle cx="${x}" cy="${y}" r="0.15" fill="${path.includes(v) ? '#9EE7FF' : '#3E4558'}"/>`; }
    if (path.length) { const [x, y] = xy(cur()); h += `<circle cx="${x}" cy="${y}" r="0.27" fill="none" stroke="#fff" stroke-width="0.06"/><circle cx="${x}" cy="${y}" r="0.17" fill="#fff"/>`; }
    svg.innerHTML = h;
    api.setExtra('Lines', `${usedE.length}<i>/ ${P.edges.length}</i>`);
  }
  const nodeAt = (e, rad) => {
    const r = svg.getBoundingClientRect();
    const ux = (e.clientX - r.left) / r.width * (W + 0.2) - 0.6, uy = (e.clientY - r.top) / r.height * (H + 0.2) - 0.6;
    let best = null, bd = rad;
    for (const v of P.nodes) { const [x, y] = xy(v); const d = Math.hypot(x - ux, y - uy); if (d < bd) { bd = d; best = v; } }

  };
  const stepTo = (v) => {
    const c = cur();
    if (v === c) return;
    if (path.length >= 2 && v === path[path.length - 2] && usedE[usedE.length - 1] === idx.get(c + '-' + v)) { path.pop(); usedE.pop(); render(); return; }
    const k = idx.get(c + '-' + v);
    if (k == null || usedE.includes(k)) return;
    usedE.push(k); path.push(v); api.move(); render();
    if (usedE.length === P.edges.length) { svg.classList.add('done'); api.win(); return; }
    const free = P.edges.some(([a, b], j) => !usedE.includes(j) && (a === v || b === v));
    toast.innerHTML = free ? '&nbsp;' : 'Stuck — <b>undo</b> a few lines or start over';
  };
  let drawing = null;
  svg.addEventListener('pointerdown', (e) => {
    if (api.done) return; e.preventDefault();
    const v = nodeAt(e, 0.48);
    if (v == null) return;
    api.start();
    if (!path.length) { path = [v]; render(); }
    else if (v !== cur()) { toast.innerHTML = 'Carry on from the <b>white dot</b> — or start over'; return; }
    drawing = e.pointerId;
    try { svg.setPointerCapture(e.pointerId); } catch (_) {}
  });
  svg.addEventListener('pointermove', (e) => { if (drawing !== e.pointerId || api.done) return; const v = nodeAt(e, 0.36); if (v != null) stepTo(v); });
  const up = () => { drawing = null; if (path.length === 1 && !usedE.length) { path = []; render(); } };
  svg.addEventListener('pointerup', up); svg.addEventListener('pointercancel', up);
  stage.append(svg, toast);
  render();
  api.solution(() => {
    const tr = P.trail; path = [tr[0]]; usedE = []; toast.innerHTML = 'Start at the white dot and follow the line'; render();
    tr.slice(1).forEach((v, k) => setTimeout(() => { usedE.push(idx.get(path[path.length - 1] + '-' + v)); path.push(v); render(); if (k === tr.length - 2) svg.classList.add('done'); }, 500 + k * 220));
  });
  api.btn('↶  Undo', () => { if (api.done || !usedE.length) return; usedE.pop(); path.pop(); if (path.length === 1) path = []; toast.innerHTML = '&nbsp;'; render(); });
  api.btn('↺  Start over', () => { if (api.done) return; path = []; usedE = []; toast.innerHTML = '&nbsp;'; render(); });
}

// ====================== TANGO ======================
const SUN = '<svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="11" fill="#FFB86B"/><circle cx="20" cy="20" r="15" fill="none" stroke="#FFB86B" stroke-width="2" stroke-dasharray="3 4.85" opacity=".7"/></svg>';

// ====================== ZIP ======================
function mountZP(stage, controls, P, api) {
  const n = P.n, numAt = new Map(P.numbers), K = P.count;
  const first = P.numbers.find(([, k]) => k === 1)[0], last = P.numbers.find(([, k]) => k === K)[0];
  let path = [];
  const NS = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(NS, 'svg');
  svg.setAttribute('viewBox', `0 0 ${n} ${n}`); svg.setAttribute('class', 'zp-svg');
  const adj = (a, b) => Math.abs(Math.floor(a / n) - Math.floor(b / n)) + Math.abs((a % n) - (b % n)) === 1;
  const cxy = (i) => [(i % n) + 0.5, Math.floor(i / n) + 0.5];
  const reached = () => path.reduce((m, c) => (numAt.has(c) ? Math.max(m, numAt.get(c)) : m), 0);

    let h = '';
